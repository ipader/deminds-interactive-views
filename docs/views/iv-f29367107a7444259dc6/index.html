</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-08-25T13:43:05.919Z","language":"zh-CN","name":"DeMinds","version":"1.0.27"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"AI 介导的认识论交互与知识生产","outlineVersion":1},"sourceRevision":"sha256:15f7b2df418a780b5ce9fcf0f6fe84c3f6e0efb93424c8d04a8fb30407869846","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"AI-mediated_Epistemic_Interaction_and_Knowledge_Production_zh-CN.md","title":"AI 介导的认识论交互与知识生产"},"files":[{"byteLength":13160,"content":"# AI 介导的认识论交互与知识生产\n\n*AI-mediated Epistemic Interaction and Knowledge Production*\n\n**作者：** Kaining Wang  \n**机构：** 北京 Amber 生物医学工程研究院（Beijing Amber Institute of Biomedical Engineering）\n\n## 摘要\n\n本文对 **AI 介导的认识论知识生产（AI-mediated epistemic production）** 作出形式化界定，并将其提出为一种区别于传统 AI 辅助研究流程的原创性、结构化学术探究范式。传统的人类—AI 研究模型通常将人工智能定位为工具，使其在由人类预先设计并固定的认识论框架内执行预定义研究任务。与之不同，本文提出的范式表明：人类研究者与大语言模型之间持续、递归式的交互，可以生成涌现式研究问题、结构性抽象、迭代性假设，并进一步形成形式化知识产出。\n\n本文构建了一个完整的 **递归式认识论知识生产循环（Recursive Epistemic Production Cycle）**，包括六个相互依存的阶段：观察、抽象、递归交互、比较性泛化、形式化与独立约束。本文进一步界定了大语言模型在知识生产全过程中承担的三种独特认识论角色：**认知媒介、观察对象与对话式探究伙伴**。\n\n为处理人类—AI 递归推理中固有的认识论风险，本文建立了明确的边界约束，用以区分：**对话一致性与命题真值、模型共识与学科验证、生成式猜想与经验证据**。通过将原创理论结构锚定于经验证的当代人类—AI 协作研究与经典认识论框架之中，本文为学术研究中人类—AI 协同知识生产的形式化与评估提供了一套严谨、可独立成立的方法论基础。\n\n**关键词：** 人工智能；人类—AI 交互；认识论知识生产；递归探究；分布式认知；科学推理；认识论边界\n\n## 1. 引言\n\n现有关于人类与生成式 AI 协作的大量文献，主要聚焦于 **AI 辅助研究流程（AI-assisted research workflows）**（Vaccaro et al., 2024）。在这一传统范式中，研究者通常会预先设定完整的研究议程、固定的研究问题与预定义的概念框架。人工智能系统主要承担辅助性的任务执行工作，包括文献整理、语句修订、结构填充与内容摘要等。这类辅助的核心作用，是在边界既定、范围预设的研究任务中提升执行效率；研究的核心认识论架构仍由人类在 AI 介入之前独立完成（Dellermann et al., 2019）。\n\n本文界定并形式化一种不同于上述模式、但在现有讨论中仍缺乏充分理论化的结构化研究范式：\n\n**AI 介导的认识论交互与知识生产**，是指一种持续的人类—AI 过程。在这一过程中，研究问题、概念结构、假设与形式化知识产出，通过递归交互被逐步生成、评估、修订并编码。为行文简洁，下文将这一范式简称为 **AI 介导的认识论知识生产（AI-mediated epistemic production）**。\n\nAI 辅助研究与 AI 介导的认识论知识生产之间的决定性差异，不在于 AI 的参与程度，也不在于任务范围是否开放，而在于：**具有认识论意义的新颖性究竟在研究过程的哪个环节进入。**\n\n- **AI 辅助研究：** 研究的核心认识论架构——包括研究议程、核心概念和基础性研究框架——在 AI 介入之前已经固定。AI 主要用于执行和优化预定义的研究任务，即使实践中偶尔也可能产生一些次要问题或洞见。\n- **AI 介导的认识论知识生产：** 递归式的人类—AI 交互会生成涌现式研究问题、持续演化的抽象结构和迭代性假设，并最终形成形式化的知识编码。\n\n在这种“介导式”模式中，研究的核心认识论组成部分并非由人类研究者预先设定，而是在持续的人类—AI 对话中不断涌现、调整与重构。这使该框架从根本上区别于随意的 AI 头脑风暴；后者缺乏结构化的认识论迭代、形式约束以及标准化的知识编码机制。\n\n当代研究已越来越多地认识到，大语言模型能够参与科学假设的迭代形成与优化，而不只是执行静态、预定义的任务（Park et al., 2024）。\n\n## 2. 递归式认识论知识生产循环\n\nAI 介导的认识论交互与知识生产可以表示为一个 **递归式认识论知识生产循环（The Recursive Epistemic Production Cycle）**，由六个相互依存且以非线性方式关联的阶段构成。\n\n### 核心支配原则\n\n**不存在天然具有最终裁决权的阶段。**\n\n任何后续阶段产生的发现，都可以触发对先前阶段的完整或部分回溯，以进行修订、重构或重新抽象。正是这种 **递归回退机制（recursive rollback mechanism）**，使本框架区别于线性的、终点锁定式研究流程（Dewey, 1938）。\n\n### 2.1 观察（Observation）\n\n研究者从跨模型的人类—AI 交互中捕捉结构模式、概念矛盾、领域异常以及尚未解决的理论空白。这些观察材料构成新认识论建构的原始基础（Peirce, 1958）。\n\n### 2.2 抽象（Abstraction）\n\n研究者以具体交互现象为基础，提炼具有一般性的结构框架，而不依附于既有领域标签、常规理论或固定的学科分类体系。此阶段使新颖的结构性洞见与既有学术惯例相解耦，从而支持将观察到的现象转化为理论构念（Magnani, 2001）。\n\n### 2.3 递归交互（Recursive Interaction）\n\n初步形成的抽象框架通过持续的人类—AI 交流被反复质疑、扩展与修订。AI 会生成替代性解释、反方论证、逻辑补充与概念延展，以检验新兴结构的稳健性及其边界条件。\n\n### 2.4 比较性泛化（Comparative Generalization）\n\n多模型并行交互用于评估候选认识论结构的跨系统稳定性，并帮助区分可能具有一般性的结构与模型特有产物。相关研究已经提出多 LLM 比较工作流，用于量化不同模型输出之间的结构一致性；但此类一致性指标本身并不构成最终的学科验证。\n\n### 2.5 形式化（Formalization）\n\n经过迭代优化的抽象结构被转化为标准化的学术定义、逻辑命题、结构框架与完整的正式学术稿件，从而将交互式认知过程中涌现的洞见转化为明确、可编码的学术知识产物（Fierro et al., 2024）。\n\n### 2.6 独立约束（Independent Constraint）\n\n形式化产出需要接受外部学科证据的评估与约束，包括已发表文献、实证发现、学科标准与逻辑一致性（Reichenbach, 1938）。如果验证结果出现矛盾，则应触发递归回退，返回任一先前阶段进行结构性修订。\n\n## 3. 介导式范式的核心理论属性\n\n### 3.1 作为探究媒介、对象与伙伴的 LLM\n\n不同于 AI 辅助研究中单一的“辅助工具”定位，大语言模型在 AI 介导的认识论知识生产中同时承担三种认识论角色，由此形成一种独特的 **三元探究结构**。\n\n1. **认知媒介（Cognitive Medium）：** 扩展人类的假设空间与概念搜索边界，提供仅凭个体人类思维难以获得的多元解释维度与结构可能性（Clark \u0026 Chalmers, 1998; Hutchins, 1995）。\n2. **观察对象（Observational Object）：** LLM 自身稳定、反复出现的行为模式与结构倾向，可以作为可分析的观察数据参与认识论建构。这意味着 AI 不仅是工具，也被明确纳入认识论过程中的观察对象（Rahwan et al., 2019）。\n3. **对话式探究伙伴（Dialogic Inquiry Partner）：** 持续提供概念压力、竞争性论证、替代性表述与逻辑反驳，从而推动新兴理论结构不断精炼，并持续澄清其边界（Horvitz, 1999）。\n\n### 3.2 研究者必须具备的能力\n\n通过介导式交互生成具有潜在有效性的新知识，从根本上依赖的是 **结构化的人类认识论能力**，而非 AI 的生成能力本身。研究者所需的核心能力包括：**元反思能力、结构抽象辨识能力、逻辑约束意识、形式化表达能力，以及面向证伪的判断力**。\n\n这些能力由认识论实践本身来界定，而不是由学术资历或职业身份决定。\n\n### 3.3 认识论边界与独立有效性约束\n\n为避免确认偏误以及缺乏依据的认识论越界，本框架为人类—AI 协同建构设定了严格且普适的认识论边界。\n\n**重复出现的 AI 共识不等同于客观证据。** 核心边界规则如下：\n\n- AI 生成的假设属于概念性猜想，而不是实证证据或理论证据（Ji et al., 2023）；\n- 跨模型一致的输出并不构成学科验证；\n- 对话稳定性与反复一致并不等同于命题真值（Sharma et al., 2024）；\n- 形式化的数学表达或结构表达不能替代实证验证。\n\n任何关于认识论有效性和学科认可的主张，都必须接受适当、独立的外部约束，包括同行评议文献、经验观察、学科实验、标准化计算以及领域特定的验证协议。\n\n这一边界从根本上将严谨的 AI 介导认识论知识生产与无约束的推测性对话区分开来，并有助于降低已有研究充分记录的人类对自动化系统输出过度依赖的风险（Parasuraman \u0026 Riley, 1997）。\n\n## 4. 结论\n\nAI 介导的认识论知识生产并不是传统 AI 辅助研究流程的替代方案，而是一种面向探索性理论研究、独立且结构化的认识论组织范式。传统 AI 辅助研究主要优化人类预设研究议程的执行效率；相比之下，这种介导式范式重新组织了学术探究的基本条件：**核心研究问题、概念架构、理论假设以及形式化学术产出，都可以在结构化的人类—AI 递归交互中涌现并持续迭代。**\n\n这一模式的意义不在于用 AI 取代人类探究，而在于重新组织人类探究生成、检验并形式化新知识的条件——这些过程通过与生成式 AI 系统的持续交互得以展开。经形式化的递归循环，为描述、评估并系统化学术研究中严谨的人类—AI 协同知识生产提供了一套完整的理论框架。\n\n## 致谢\n\n作者在北京 Amber 生物医学工程研究院担任名誉首席人工智能科学家（Chief AI Scientist）。\n\n## 利益冲突声明\n\n作者声明无利益冲突。\n\n## 参考文献\n\nClark, A., \u0026 Chalmers, D. J. (1998). The extended mind. *Analysis, 58*(1), 7–19. https://doi.org/10.1093/analys/58.1.7\n\nDellermann, D., Lipusch, N., Ebel, P., \u0026 Leimeister, J. M. (2019). Design principles for a hybrid intelligence decision support system for business model validation. *Electronic Markets, 29*, 423–441. https://doi.org/10.1007/s12525-018-0309-2\n\nDewey, J. (1938). *Logic: The theory of inquiry*. Holt, Rinehart and Winston.\n\nFierro, D., Dhar, R., Stamatiou, M., Garneau, N., \u0026 Søgaard, A. (2024). Defining knowledge: Bridging epistemology and large language models. *Proceedings of the 2024 Conference on Empirical Methods in Natural Language Processing (EMNLP)*, 16096–16111. https://doi.org/10.18653/v1/2024.emnlp-main.900\n\nHorvitz, E. (1999). Principles of mixed-initiative user s=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e2.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e观察对象（Observational Object）：\u003c/strong\u003e\u0026nbsp;LLM 自身稳定、反复出现的行为模式与结构倾向，可以作为可分析的观察数据参与认识论建构。这意味着 AI 不仅是工具，也被明确纳入认识论过程中的观察对象（Rahwan et al., 2019）。\u003c/span\u003e","payload":{"lines":"14,15","tag":"h4"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3.\u0026nbsp;\u003cstrong style=\"font-weight: 700;\"\u003e对话式探究伙伴（Dialogic Inquiry Partner）：\u003c/strong\u003e\u0026nbsp;持续提供概念压力、竞争性论证、替代性表述与逻辑反驳，从而推动新兴理论结构不断精炼，并持续澄清其边界（Horvitz, 1999）。\u003c/span\u003e","payload":{"lines":"15,16","tag":"h4"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3.1 作为探究媒介、对象与伙伴的 LLM\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:da338a00e1f0c0a223b9cc852c67180d45cc7abaa9c6738fbd15227c851e2e0a\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"12,13","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3.2 研究者必须具备的能力\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:ab03355743d80ad90989060b7d90f558ce1eaf63f1783067486f2900120d0c01\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"16,17","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3.3 认识论边界与独立有效性约束\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:66db1ae3832c1966d3c35bf504ea930936353c938bcd1fcc16a6dbbaf555ca2d\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"17,18","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e3. 介导式范式的核心理论属性\u003c/span\u003e","payload":{"lines":"11,12","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e4. 结论\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:084f237231b0837f5ff5d989d2c6a88f2c75bd3b4d5a16b7c681654dbaf1e463\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"18,19","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e致谢\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:294e8d0d135f1bf75e37aef44ac445d3528443914d9709e2097e79f6ba435010\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"19,20","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e利益冲突声明\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:6953a84353daa1614cae89445692382d3068ed9bd2fc8dccbff9597c5e81bb9c\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"20,21","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e参考文献\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:d8b1e517706d8e076f971ff3251ceb2a5b625c76d9fc30a729c25297ab858aad\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"21,22","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003eAI 介导的认识论交互与知识生产\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"AI 介导的认识论交互与知识生产\" data-note-id=\"note:sha256:cf4919fa76ab055d275cecd48a8d31834c1e2439b3d2626a73430253c9058ffc\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"ai-介导的认识论交互与知识生产\"\u003eAI 介导的认识论交互与知识生产\u003c/h1\u003e\n\u003cp\u003e\u003cem\u003eAI-mediated Epistemic Interaction and Knowledge Production\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e作者：\u003c/strong\u003e Kaining Wang\u003cbr\u003e\u003cstrong\u003e机构：\u003c/strong\u003e 北京 Amber 生物医学工程研究院（Beijing Amber Institute of Biomedical Engineering）\u003c/p\u003e\n\u003ch2 id=\"摘要\"\u003e摘要\u003c/h2\u003e\n\u003cp\u003e本文对 \u003cstrong\u003eAI 介导的认识论知识生产（AI-mediated epistemic production）\u003c/strong\u003e 作出形式化界定，并将其提出为一种区别于传统 AI 辅助研究流程的原创性、结构化学术探究范式。传统的人类—AI 研究模型通常将人工智能定位为工具，使其在由人类预先设计并固定的认识论框架内执行预定义研究任务。与之不同，本文提出的范式表明：人类研究者与大语言模型之间持续、递归式的交互，可以生成涌现式研究问题、结构性抽象、迭代性假设，并进一步形成形式化知识产出。\u003c/p\u003e\n\u003cp\u003e本文构建了一个完整的 \u003cstrong\u003e递归式认识论知识生产循环（Recursive Epistemic Production Cycle）\u003c/strong\u003e，包括六个相互依存的阶段：观察、抽象、递归交互、比较性泛化、形式化与独立约束。本文进一步界定了大语言模型在知识生产全过程中承担的三种独特认识论角色：\u003cstrong\u003e认知媒介、观察对象与对话式探究伙伴\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e为处理人类—AI 递归推理中固有的认识论风险，本文建立了明确的边界约束，用以区分：\u003cstrong\u003e对话一致性与命题真值、模型共识与学科验证、生成式猜想与经验证据\u003c/strong\u003e。通过将原创理论结构锚定于经验证的当代人类—AI 协作研究与经典认识论框架之中，本文为学术研究中人类—AI 协同知识生产的形式化与评估提供了一套严谨、可独立成立的方法论基础。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e关键词：\u003c/strong\u003e 人工智能；人类—AI 交互；认识论知识生产；递归探究；分布式认知；科学推理；认识论边界\u003c/p\u003e\n\u003ch2 id=\"1-引言\"\u003e1. 引言\u003c/h2\u003e\n\u003cp\u003e现有关于人类与生成式 AI 协作的大量文献，主要聚焦于 \u003cstrong\u003eAI 辅助研究流程（AI-assisted research workflows）\u003c/strong\u003e（Vaccaro et al., 2024）。在这一传统范式中，研究者通常会预先设定完整的研究议程、固定的研究问题与预定义的概念框架。人工智能系统主要承担辅助性的任务执行工作，包括文献整理、语句修订、结构填充与内容摘要等。这类辅助的核心作用，是在边界既定、范围预设的研究任务中提升执行效率；研究的核心认识论架构仍由人类在 AI 介入之前独立完成（Dellermann et al., 2019）。\u003c/p\u003e\n\u003cp\u003e本文界定并形式化一种不同于上述模式、但在现有讨论中仍缺乏充分理论化的结构化研究范式：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI 介导的认识论交互与知识生产\u003c/strong\u003e，是指一种持续的人类—AI 过程。在这一过程中，研究问题、概念结构、假设与形式化知识产出，通过递归交互被逐步生成、评估、修订并编码。为行文简洁，下文将这一范式简称为 \u003cstrong\u003eAI 介导的认识论知识生产（AI-mediated epistemic production）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003eAI 辅助研究与 AI 介导的认识论知识生产之间的决定性差异，不在于 AI 的参与程度，也不在于任务范围是否开放，而在于：\u003cstrong\u003e具有认识论意义的新颖性究竟在研究过程的哪个环节进入。\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAI 辅助研究：\u003c/strong\u003e 研究的核心认识论架构——包括研究议程、核心概念和基础性研究框架——在 AI 介入之前已经固定。AI 主要用于执行和优化预定义的研究任务，即使实践中偶尔也可能产生一些次要问题或洞见。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI 介导的认识论知识生产：\u003c/strong\u003e 递归式的人类—AI 交互会生成涌现式研究问题、持续演化的抽象结构和迭代性假设，并最终形成形式化的知识编码。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e在这种“介导式”模式中，研究的核心认识论组成部分并非由人类研究者预先设定，而是在持续的人类—AI 对话中不断涌现、调整与重构。这使该框架从根本上区别于随意的 AI 头脑风暴；后者缺乏结构化的认识论迭代、形式约束以及标准化的知识编码机制。\u003c/p\u003e\n\u003cp\u003e当代研究已越来越多地认识到，大语言模型能够参与科学假设的迭代形成与优化，而不只是执行静态、预定义的任务（Park et al., 2024）。\u003c/p\u003e\n\u003ch2 id=\"2-递归式认识论知识生产循环\"\u003e2. 递归式认识论知识生产循环\u003c/h2\u003e\n\u003cp\u003eAI 介导的认识论交互与知识生产可以表示为一个 \u003cstrong\u003e递归式认识论知识生产循环（The Recursive Epistemic Production Cycle）\u003c/strong\u003e，由六个相互依存且以非线性方式关联的阶段构成。\u003c/p\u003e\n\u003ch3 id=\"核心支配原则\"\u003e核心支配原则\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e不存在天然具有最终裁决权的阶段。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e任何后续阶段产生的发现，都可以触发对先前阶段的完整或部分回溯，以进行修订、重构或重新抽象。正是这种 \u003cstrong\u003e递归回退机制（recursive rollback mechanism）\u003c/strong\u003e，使本框架区别于线性的、终点锁定式研究流程（Dewey, 1938）。\u003c/p\u003e\n\u003ch3 id=\"21-观察observation\"\u003e2.1 观察（Observation）\u003c/h3\u003e\n\u003cp\u003e研究者从跨模型的人类—AI 交互中捕捉结构模式、概念矛盾、领域异常以及尚未解决的理论空白。这些观察材料构成新认识论建构的原始基础（Peirce, 1958）。\u003c/p\u003e\n\u003ch3 id=\"22-抽象abstraction\"\u003e2.2 抽象（Abstraction）\u003c/h3\u003e\n\u003cp\u003e研究者以具体交互现象为基础，提炼具有一般性的结构框架，而不依附于既有领域标签、常规理论或固定的学科分类体系。此阶段使新颖的结构性洞见与既有学术惯例相解耦，从而支持将观察到的现象转化为理论构念（Magnani, 2001）。\u003c/p\u003e\n\u003ch3 id=\"23-递归交互recursive-interaction\"\u003e2.3 递归交互（Recursive Interaction）\u003c/h3\u003e\n\u003cp\u003e初步形成的抽象框架通过持续的人类—AI 交流被反复质疑、扩展与修订。AI 会生成替代性解释、反方论证、逻辑补充与概念延展，以检验新兴结构的稳健性及其边界条件。\u003c/p\u003e\n\u003ch3 id=\"24-比较性泛化comparative-generalization\"\u003e2.4 比较性泛化（Comparative Generalization）\u003c/h3\u003e\n\u003cp\u003e多模型并行交互用于评估候选认识论结构的跨系统稳定性，并帮助区分可能具有一般性的结构与模型特有产物。相关研究已经提出多 LLM 比较工作流，用于量化不同模型输出之间的结构一致性；但此类一致性指标本身并不构成最终的学科验证。\u003c/p\u003e\n\u003ch3 id=\"25-形式化formalization\"\u003e2.5 形式化（Formalization）\u003c/h3\u003e\n\u003cp\u003e经过迭代优化的抽象结构被转化为标准化的学术定义、逻辑命题、结构框架与完整的正式学术稿件，从而将交互式认知过程中涌现的洞见转化为明确、可编码的学术知识产物（Fierro et al., 2024）。\u003c/p\u003e\n\u003ch3 id=\"26-独立约束independent-constraint\"\u003e2.6 独立约束（Independent Constraint）\u003c/h3\u003e\n\u003cp\u003e形式化产出需要接受外部学科证据的评估与约束，包括已发表文献、实证发现、学科标准与逻辑一致性（Reichenbach, 1938）。如果验证结果出现矛盾，则应触发递归回退，返回任一先前阶段进行结构性修订。\u003c/p\u003e\n\u003ch2 id=\"3-介导式范式的核心理论属性\"\u003e3. 介导式范式的核心理论属性\u003c/h2\u003e\n\u003ch3 id=\"31-作为探究媒介对象与伙伴的-llm\"\u003e3.1 作为探究媒介、对象与伙伴的 LLM\u003c/h3\u003e\n\u003cp\u003e不同于 AI 辅助研究中单一的“辅助工具”定位，大语言模型在 AI 介导的认识论知识生产中同时承担三种认识论角色，由此形成一种独特的 \u003cstrong\u003e三元探究结构\u003c/strong\u003e。\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e认知媒介（Cognitive Medium）：\u003c/strong\u003e 扩展人类的假设空间与概念搜索边界，提供仅凭个体人类思维难以获得的多元解释维度与结构可能性（Clark \u0026amp; Chalmers, 1998; Hutchins, 1995）。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e观察对象（Observational Object）：\u003c/strong\u003e LLM 自身稳定、反复出现的行为模式与结构倾向，可以作为可分析的观察数据参与认识论建构。这意味着 AI 不仅是工具，也被明确纳入认识论过程中的观察对象（Rahwan et al., 2019）。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e对话式探究伙伴（Dialogic Inquiry Partner）：\u003c/strong\u003e 持续提供概念压力、竞争性论证、替代性表述与逻辑反驳，从而推动新兴理论结构不断精炼，并持续澄清其边界（Horvitz, 1999）。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"32-研究者必须具备的能力\"\u003e3.2 研究者必须具备的能力\u003c/h3\u003e\n\u003cp\u003e通过介导式交互生成具有潜在有效性的新知识，从根本上依赖的是 \u003cstrong\u003e结构化的人类认识论能力\u003c/strong\u003e，而非 AI 的生成能力本身。研究者所需的核心能力包括：\u003cstrong\u003e元反思能力、结构抽象辨识能力、逻辑约束意识、形式化表达能力，以及面向证伪的判断力\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e这些能力由认识论实践本身来界定，而不是由学术资历或职业身份决定。\u003c/p\u003e\n\u003ch3 id=\"33-认识论边界与独立有效性约束\"\u003e3.3 认识论边界与独立有效性约束\u003c/h3\u003e\n\u003cp\u003e为避免确认偏误以及缺乏依据的认识论越界，本框架为人类—AI 协同建构设定了严格且普适的认识论边界。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e重复出现的 AI 共识不等同于客观证据。\u003c/strong\u003e 核心边界规则如下：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAI 生成的假设属于概念性猜想，而不是实证证据或理论证据（Ji et al., 2023）；\u003c/li\u003e\n\u003cli\u003e跨模型一致的输出并不构成学科验证；\u003c/li\u003e\n\u003cli\u003e对话稳定性与反复一致并不等同于命题真值（Sharma et al., 2024）；\u003c/li\u003e\n\u003cli\u003e形式化的数学表达或结构表达不能替代实证验证。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e任何关于认识论有效性和学科认可的主张，都必须接受适当、独立的外部约束，包括同行评议文献、经验观察、学科实验、标准化计算以及领域特定的验证协议。\u003c/p\u003e\n\u003cp\u003e这一边界从根本上将严谨的 AI 介导认识论知识生产与无约束的推测性对话区分开来，并有助于降低已有研究充分记录的人类对自动化系统输出过度依赖的风险（Parasuraman \u0026amp; Riley, 1997）。\u003c/p\u003e\n\u003ch2 id=\"4-结论\"\u003e4. 结论\u003c/h2\u003e\n\u003cp\u003eAI 介导的认识论知识生产并不是传统 AI 辅助研究流程的替代方案，而是一种面向探索性理论研究、独立且结构化的认识论组织范式。传统 AI 辅助研究主要优化人类预设研究议程的执行效率；相比之下，这种介导式范式重新组织了学术探究的基本条件：\u003cstrong\u003e核心研究问题、概念架构、理论假设以及形式化学术产出，都可以在结构化的人类—AI 递归交互中涌现并持续迭代。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这一模式的意义不在于用 AI 取代人类探究，而在于重新组织人类探究生成、检验并形式化新知识的条件——这些过程通过与生成式 AI 系统的持续交互得以展开。经形式化的递归循环，为描述、评估并系统化学术研究中严谨的人类—AI 协同知识生产提供了一套完整的理论框架。\u003c/p\u003e\n\u003ch2 id=\"致谢\"\u003e致谢\u003c/h2\u003e\n\u003cp\u003e作者在北京 Amber 生物医学工程研究院担任名誉首席人工智能科学家（Chief AI Scientist）。\u003c/p\u003e\n\u003ch2 id=\"利益冲突声明\"\u003e利益冲突声明\u003c/h2\u003e\n\u003cp\u003e作者声明无利益冲突。\u003c/p\u003e\n\u003ch2 id=\"参考文献\"\u003e参考文献\u003c/h2\u003e\n\u003cp\u003eClark, A., \u0026amp; Chalmers, D. J. (1998). The extended mind. \u003cem\u003eAnalysis, 58\u003c/em\u003e(1), 7–19. \u003ca href=\"https://doi.org/10.1093/analys/58.1.7\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1093/analys/58.1.7\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDellermann, D., Lipusch, N., Ebel, P., \u0026amp; Leimeister, J. M. (2019). Design principles for a hybrid intelligence decision support system for business model validation. \u003cem\u003eElectronic Markets, 29\u003c/em\u003e, 423–441. \u003ca href=\"https://doi.org/10.1007/s12525-018-0309-2\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1007/s12525-018-0309-2\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDewey, J. (1938). \u003cem\u003eLogic: The theory of inquiry\u003c/em\u003e. Holt, Rinehart and Winston.\u003c/p\u003e\n\u003cp\u003eFierro, D., Dhar, R., Stamatiou, M., Garneau, N., \u0026amp; Søgaard, A. (2024). Defining knowledge: Bridging epistemology and large language models. \u003cem\u003eProceedings of the 2024 Conference on Empirical Methods in Natural Language Processing (EMNLP)\u003c/em\u003e, 16096–16111. \u003ca href=\"https://doi.org/10.18653/v1/2024.emnlp-main.900\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.18653/v1/2024.emnlp-main.900\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eHorvitz, E. (1999). Principles of mixed-initiative user interfaces. \u003cem\u003eProceedings of the SIGCHI Conference on Human Factors in Computing Systems (CHI ’99)\u003c/em\u003e, 159–166. \u003ca href=\"https://doi.org/10.1145/302979.303030\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1145/3029 u003eReichenbach, H. (1938). \u003cem\u003eExperience and prediction: An analysis of the foundations and the structure of knowledge\u003c/em\u003e. University of Chicago Press.\u003c/p\u003e\n\u003cp\u003eSharma, M., Tong, M., Korbak, T., Duvenaud, D., Askell, A., Bowman, S., Durmus, E., Hatfield-Dodds, Z., Johnston, S. R., Kravec, S., Maxwell, T., McCandlish, S., Ndousse, K., Rausch, O., Schiefer, N., Yan, D., Zhang, M., \u0026amp; Perez, E. (2024). Towards understanding sycophancy in language models. \u003cem\u003eInternational Conference on Learning Representations (ICLR) 2024\u003c/em\u003e.\u003c/p\u003e\n\u003cp\u003eVaccaro, M., Almaatouq, A., \u0026amp; Malone, T. (2024). When combinations of humans and AI are useful: A systematic review and meta-analysis. \u003cem\u003eNature Human Behaviour, 8\u003c/em\u003e, 2293–2303. \u003ca href=\"https://doi.org/10.1038/s41562-024-02024-1\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1038/s41562-024-02024-1\u003c/a\u003e\u003c/p\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:084f237231b0837f5ff5d989d2c6a88f2c75bd3b4d5a16b7c681654dbaf1e463":{"html":"\u003cp\u003eAI 介导的认识论知识生产并不是传统 AI 辅助研究流程的替代方案，而是一种面向探索性理论研究、独立且结构化的认识论组织范式。传统 AI 辅助研究主要优化人类预设研究议程的执行效率；相比之下，这种介导式范式重新组织了学术探究的基本条件：\u003cstrong\u003e核心研究问题、概念架构、理论假设以及形式化学术产出，都可以在结构化的人类—AI 递归交互中涌现并持续迭代。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这一模式的意义不在于用 AI 取代人类探究，而在于重新组织人类探究生成、检验并形式化新知识的条件——这些过程通过与生成式 AI 系统的持续交互得以展开。经形式化的递归循环，为描述、评估并系统化学术研究中严谨的人类—AI 协同知识生产提供了一套完整的理论框架。\u003c/p\u003e\n","kind":"html","rawMarkdown":"AI 介导的认识论知识生产并不是传统 AI 辅助研究流程的替代方案，而是一种面向探索性理论研究、独立且结构化的认识论组织范式。传统 AI 辅助研究主要优化人类预设研究议程的执行效率；相比之下，这种介导式范式重新组织了学术探究的基本条件：**核心研究问题、概念架构、理论假设以及形式化学术产出，都可以在结构化的人类—AI 递归交互中涌现并持续迭代。**\n\n这一模式的意义不在于用 AI 取代人类探究，而在于重新组织人类探究生成、检验并形式化新知识的条件——这些过程通过与生成式 AI 系统的持续交互得以展开。经形式化的递归循环，为描述、评估并系统化学术研究中严谨的人类—AI 协同知识生产提供了一套完整的理论框架。","sourceFormat":"markdown"},"note:sha256:0cfd524b62e6f9e26c3a641ef8a1b0b87dbe8230571ffbe51dbd94115cf45a3f":{"html":"\u003cp\u003e本文对 \u003cstrong\u003eAI 介导的认识论知识生产（AI-mediated epistemic production）\u003c/strong\u003e 作出形式化界定，并将其提出为一种区别于传统 AI 辅助研究流程的原创性、结构化学术探究范式。传统的人类—AI 研究模型通常将人工智能定位为工具，使其在由人类预先设计并固定的认识论框架内执行预定义研究任务。与之不同，本文提出的范式表明：人类研究者与大语言模型之间持续、递归式的交互，可以生成涌现式研究问题、结构性抽象、迭代性假设，并进一步形成形式化知识产出。\u003c/p\u003e\n\u003cp\u003e本文构建了一个完整的 \u003cstrong\u003e递归式认识论知识生产循环（Recursive Epistemic Production Cycle）\u003c/strong\u003e，包括六个相互依存的阶段：观察、抽象、递归交互、比较性泛化、形式化与独立约束。本文进一步界定了大语言模型在知识生产全过程中承担的三种独特认识论角色：\u003cstrong\u003e认知媒介、观察对象与对话式探究伙伴\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e为处理人类—AI 递归推理中固有的认识论风险，本文建立了明确的边界约束，用以区分：\u003cstrong\u003e对话一致性与命题真值、模型共识与学科验证、生成式猜想与经验证据\u003c/strong\u003e。通过将原创理论结构锚定于经验证的当代人类—AI 协作研究与经典认识论框架之中，本文为学术研究中人类—AI 协同知识生产的形式化与评估提供了一套严谨、可独立成立的方法论基础。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e关键词：\u003c/strong\u003e 人工智能；人类—AI 交互；认识论知识生产；递归探究；分布式认知；科学推理；认识论边界\u003c/p\u003e\n","kind":"html","rawMarkdown":"本文对 **AI 介导的认识论知识生产（AI-mediated epistemic production）** 作出形式化界定，并将其提出为一种区别于传统 AI 辅助研究流程的原创性、结构化学术探究范式。传统的人类—AI 研究模型通常将人工智能定位为工具，使其在由人类预先设计并固定的认识论框架内执行预定义研究任务。与之不同，本文提出的范式表明：人类研究者与大语言模型之间持续、递归式的交互，可以生成涌现式研究问题、结构性抽象、迭代性假设，并进一步形成形式化知识产出。\n\n本文构建了一个完整的 **递归式认识论知识生产循环（Recursive Epistemic Production Cycle）**，包括六个相互依存的阶段：观察、抽象、递归交互、比较性泛化、形式化与独立约束。本文进一步界定了大语言模型在知识生产全过程中承担的三种独特认识论角色：**认知媒介、观察对象与对话式探究伙伴**。\n\n为处理人类—AI 递归推理中固有的认识论风险，本文建立了明确的边界约束，用以区分：**对话一致性与命题真值、模型共识与学科验证、生成式猜想与经验证据**。通过将原创理论结构锚定于经验证的当代人类—AI 协作研究与经典认识论框架之中，本文为学术研究中人类—AI 协同知识生产的形式化与评估提供了一套严谨、可独立成立的方法论基础。\n\n**关键词：** 人工智能；人类—AI 交互；认识论知识生产；递归探究；分布式认知；科学推理；认识论边界","sourceFormat":"markdown"},"note:sha256:16299ac1478be76f76cac05d324d2f0b41fdf25797f13a3ab046f2526870137c":{"html":"\u003cp\u003eAI 介导的认识论交互与知识生产可以表示为一个 \u003cstrong\u003e递归式认识论知识生产循环（The Recursive Epistemic Production Cycle）\u003c/strong\u003e，由六个相互依存且以非线性方式关联的阶段构成。\u003c/p\u003e\n","kind":"html","rawMarkdown":"AI 介导的认识论交互与知识生产可以表示为一个 **递归式认识论知识生产循环（The Recursive Epistemic Production Cycle）**，由六个相互依存且以非线性方式关联的阶段构成。","sourceFormat":"markdown"},"note:sha256:1ce5690f20311fbbfae5990e59b50744646c6ad8f3582a87a4614440686ccf60":{"html":"\u003cp\u003e研究者从跨模型的人类—AI 交互中捕捉结构模式、概念矛盾、领域异常以及尚未解决的理论空白。这些观察材料构成新认识论建构的原始基础（Peirce, 1958）。\u003c/p\u003e\n","kind":"html","rawMarkdown":"研究者从跨模型的人类—AI 交互中捕捉结构模式、概念矛盾、领域异常以及尚未解决的理论空白。这些观察材料构成新认识论建构的原始基础（Peirce, 1958）。","sourceFormat":"markdown"},"note:sha256:294e8d0d135f1bf75e37aef44ac445d3528443914d9709e2097e79f6ba435010":{"html":"\u003cp\u003e作者在北京 Amber 生物医学工程研究院担任名誉首席人工智能科学家（Chief AI Scientist）。\u003c/p\u003e\n","kind":"html","rawMarkdown":"作者在北京 Amber 生物医学工程研究院担任名誉首席人工智能科学家（Chief AI Scientist）。","sourceFormat":"markdown"},"note:sha256:5885cff19ddf06246d0ae92795fe073cf1a567c29f3e65260a1b2c714c5fbe43":{"html":"\u003cp\u003e研究者以具体交互现象为基础，提炼具有一般性的结构框架，而不依附于既有领域标签、常规理论或固定的学科分类体系。此阶段使新颖的结构性洞见与既有学术惯例相解耦，从而支持将观察到的现象转化为理论构念（Magnani, 2001）。\u003c/p\u003e\n","kind":"html","rawMarkdown":"研究者以具体交互现象为基础，提炼具有一般性的结构框架，而不依附于既有领域标签、常规理论或固定的学科分类体系。此阶段使新颖的结构性洞见与既有学术惯例相解耦，从而支持将观察到的现象转化为理论构念（Magnani, 2001）。","sourceFormat":"markdown"},"note:sha256:66db1ae3832c1966d3c35bf504ea930936353c938bcd1fcc16a6dbbaf555ca2d":{"blocks":[{"children":[],"kind":"leaf","title":"为避免确认偏误以及缺乏依据的认识论越界，本框架为人类—AI 协同建构设定了严格且普适的认识论边界。"},{"children":[{"title":"AI 生成的假设属于概念性猜想，而不是实证证据或理论证据（Ji et al., 2023）；"},{"title":"跨模型一致的输出并不构成学科验证；"},{"title":"对话稳定性与反复一致并不等同于命题真值（Sharma et al., 2024）；"},{"title":"形式化的数学表达或结构表达不能替代实证验证。"}],"kind":"section","title":"重复出现的 AI 共识不等同于客观证据。 核心边界规则如下"},{"children":[],"kind":"leaf","title":"任何关于认识论有效性和学科认可的主张，都必须接受适当、独立的外部约束，包括同行评议文献、经验观察、学科实验、标准化计算以及领域特定的验证协议。"},{"children":[],"kind":"leaf","title":"这一边界从根本上将严谨的 AI 介导认识论知识生产与无约束的推测性对话区分开来，并有助于降低已有研究充分记录的人类对自动化系统输出过度依赖的风险（Parasuraman \u0026 Riley, 1997）。"}],"html":"\u003cp\u003e为避免确认偏误以及缺乏依据的认识论越界，本框架为人类—AI 协同建构设定了严格且普适的认识论边界。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e重复出现的 AI 共识不等同于客观证据。\u003c/strong\u003e 核心边界规则如下：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAI 生成的假设属于概念性猜想，而不是实证证据或理论证据（Ji et al., 2023）；\u003c/li\u003e\n\u003cli\u003e跨模型一致的输出并不构成学科验证；\u003c/li\u003e\n\u003cli\u003e对话稳定性与反复一致并不等同于命题真值（Sharma et al., 2024）；\u003c/li\u003e\n\u003cli\u003e形式化的数学表达或结构表达不能替代实证验证。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e任何关于认识论有效性和学科认可的主张，都必须接受适当、独立的外部约束，包括同行评议文献、经验观察、学科实验、标准化计算以及领域特定的验证协议。\u003c/p\u003e\n\u003cp\u003e这一边界从根本上将严谨的 AI 介导认识论知识生产与无约束的推测性对话区分开来，并有助于降低已有研究充分记录的人类对自动化系统输出过度依赖的风险（Parasuraman \u0026amp; Riley, 1997）。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"为避免确认偏误以及缺乏依据的认识论越界，本框架为人类—AI 协同建构设定了严格且普适的认识论边界。\n\n**重复出现的 AI 共识不等同于客观证据。** 核心边界规则如下：\n\n- AI 生成的假设属于概念性猜想，而不是实证证据或理论证据（Ji et al., 2023）；\n- 跨模型一致的输出并不构成学科验证；\n- 对话稳定性与反复一致并不等同于命题真值（Sharma et al., 2024）；\n- 形式化的数学表达或结构表达不能替代实证验证。\n\n任何关于认识论有效性和学科认可的主张，都必须接受适当、独立的外部约束，包括同行评议文献、经验观察、学科实验、标准化计算以及领域特定的验证协议。\n\n这一边界从根本上将严谨的 AI 介导认识论知识生产与无约束的推测性对话区分开来，并有助于降低已有研究充分记录的人类对自动化系统输出过度依赖的风险（Parasuraman \u0026 Riley, 1997）。","sourceFormat":"markdown"},"note:sha256:68435623794b710550e4f2314bb84cff536ca13aaad857d2095c787433f32c14":{"html":"\u003cp\u003e形式化产出需要接受外部学科证据的评估与约束，包括已发表文献、实证发现、学科标准与逻辑一致性（Reichenbach, 1938）。如果验证结果出现矛盾，则应触发递归回退，返回任一先前阶段进行结构性修订。\u003c/p\u003e\n","kind":"html","rawMarkdown":"形式化产出需要接受外部学科证据的评估与约束，包括已发表文献、实证发现、学科标准与逻辑一致性（Reichenbach, 1938）。如果验证结果出现矛盾，则应触发递归回退，返回任一先前阶段进行结构性修订。","sourceFormat":"markdown"},"note:sha256:6953a84353daa1614cae89445692382d3068ed9bd2fc8dccbff9597c5e81bb9c":{"html":"\u003cp\u003e作者声明无利益冲突。\u003c/p\u003e\n","kind":"html","rawMarkdown":"作者声明无利益冲突。","sourceFormat":"markdown"},"note:sha256:86548060b1aafe400440ea820b86403a1a01cfb1bccfaf85686f9ae0e89ace70":{"html":"\u003cp\u003e经过迭代优化的抽象结构被转化为标准化的学术定义、逻辑命题、结构框架与完整的正式学术稿件，从而将交互式认知过程中涌现的洞见转化为明确、可编码的学术知识产物（Fierro et al., 2024）。\u003c/p\u003e\n","kind":"html","rawMarkdown":"经过迭代优化的抽象结构被转化为标准化的学术定义、逻辑命题、结构框架与完整的正式学术稿件，从而将交互式认知过程中涌现的洞见转化为明确、可编码的学术知识产物（Fierro et al., 2024）。","sourceFormat":"markdown"},"note:sha256:883b50ac7bf8397a33e056518b8be22a84e174bb3ba0271eef2bb6e0df1bc983":{"html":"\u003cp\u003e初步形成的抽象框架通过持续的人类—AI 交流被反复质疑、扩展与修订。AI 会生成替代性解释、反方论证、逻辑补充与概念延展，以检验新兴结构的稳健性及其边界条件。\u003c/p\u003e\n","kind":"html","rawMarkdown":"初步形成的抽象框架通过持续的人类—AI 交流被反复质疑、扩展与修订。AI 会生成替代性解释、反方论证、逻辑补充与概念延展，以检验新兴结构的稳健性及其边界条件。","sourceFormat":"markdown"},"note:sha256:ab03355743d80ad90989060b7d90f558ce1eaf63f1783067486f2900120d0c01":{"html":"\u003cp\u003e通过介导式交互生成具有潜在有效性的新知识，从根本上依赖的是 \u003cstrong\u003e结构化的人类认识论能力\u003c/strong\u003e，而非 AI 的生成能力本身。研究者所需的核心能力包括：\u003cstrong\u003e元反思能力、结构抽象辨识能力、逻辑约束意识、形式化表达能力，以及面向证伪的判断力\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e这些能力由认识论实践本身来界定，而不是由学术资历或职业身份决定。\u003c/p\u003e\n","kind":"html","rawMarkdown":"通过介导式交互生成具有潜在有效性的新知识，从根本上依赖的是 **结构化的人类认识论能力**，而非 AI 的生成能力本身。研究者所需的核心能力包括：**元反思能力、结构抽象辨识能力、逻辑约束意识、形式化表达能力，以及面向证伪的判断力**。\n\n这些能力由认识论实践本身来界定，而不是由学术资历或职业身份决定。","sourceFormat":"markdown"},"note:sha256:b4de052c21ff052f0ad584aab2fb04cfd0ccf7b59ceba6a2bbeae96bd20843d9":{"html":"\u003cp\u003e\u003cstrong\u003e不存在天然具有最终裁决权的阶段。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e任何后续阶段产生的发现，都可以触发对先前阶段的完整或部分回溯，以进行修订、重构或重新抽象。正是这种 \u003cstrong\u003e递归回退机制（recursive rollback mechanism）\u003c/strong\u003e，使本框架区别于线性的、终点锁定式研究流程（Dewey, 1938）。\u003c/p\u003e\n","kind":"html","rawMarkdown":"**不存在天然具有最终裁决权的阶段。**\n\n任何后续阶段产生的发现，都可以触发对先前阶段的完整或部分回溯，以进行修订、重构或重新抽象。正是这种 **递归回退机制（recursive rollback mechanism）**，使本框架区别于线性的、终点锁定式研究流程（Dewey, 1938）。","sourceFormat":"markdown"},"note:sha256:c0d5a175c09c46b630643e478037d0bc6107a188862003a343c32ffd741deaaf":{"blocks":[{"children":[],"kind":"leaf","title":"现有关于人类与生成式 AI 协作的大量文献，主要聚焦于 AI 辅助研究流程（AI-assisted research workflows）（Vaccaro et al., 2024）。在这一传统范式中，研究者通常会预先设定完整的研究议程、固定的研究问题与预定义的概念框架。人工智能系统主要承担辅助性的任务执行工作，包括文献整理、语句修订、结构填充与内容摘要等。这类辅助的核心作用，是在边界既定、范围预设的研究任务中提升执行效率；研究的核心认识论架构仍由人类在 AI 介入之前独立完成（Dellermann et al., 2019）。"},{"bodyBlocks":[{"kind":"paragraph","text":"AI 介导的认识论交互与知识生产，是指一种持续的人类—AI 过程。在这一过程中，研究问题、概念结构、假设与形式化知识产出，通过递归交互被逐步生成、评估、修订并编码。为行文简洁，下文将这一范式简称为 AI 介导的认识论知识生产（AI-mediated epistemic production）。"}],"children":[],"kind":"compound_leaf","lead":"本文界定并形式化一种不同于上述模式、但在现有讨论中仍缺乏充分理论化的结构化研究范式："},{"children":[{"title":"**AI 辅助研究：** 研究的核心认识论架构——包括研究议程、核心概念和基础性研究框架——在 AI 介入之前已经固定。AI 主要用于执行和优化预定义的研究任务，即使实践中偶尔也可能产生一些次要问题或洞见。"},{"title":"**AI 介导的认识论知识生产：** 递归式的人类—AI 交互会生成涌现式研究问题、持续演化的抽象结构和迭代性假设，并最终形成形式化的知识编码。"}],"kind":"section","title":"AI 辅助研究与 AI 介导的认识论知识生产之间的决定性差异，不在于 AI 的参与程度，也不在于任务范围是否开放，而在于：具有认识论意义的新颖性究竟在研究过程的哪个环节进入。"},{"children":[],"kind":"leaf","title":"在这种“介导式”模式中，研究的核心认识论组成部分并非由人类研究者预先设定，而是在持续的人类—AI 对话中不断涌现、调整与重构。这使该框架从根本上区别于随意的 AI 头脑风暴；后者缺乏结构化的认识论迭代、形式约束以及标准化的知识编码机制。"},{"children":[],"kind":"leaf","title":"当代研究已越来越多地认识到，大语言模型能够参与科学假设的迭代形成与优化，而不只是执行静态、预定义的任务（Park et al., 2024）。"}],"html":"\u003cp\u003e现有关于人类与生成式 AI 协作的大量文献，主要聚焦于 \u003cstrong\u003eAI 辅助研究流程（AI-assisted research workflows）\u003c/strong\u003e（Vaccaro et al., 2024）。在这一传统范式中，研究者通常会预先设定完整的研究议程、固定的研究问题与预定义的概念框架。人工智能系统主要承担辅助性的任务执行工作，包括文献整理、语句修订、结构填充与内容摘要等。这类辅助的核心作用，是在边界既定、范围预设的研究任务中提升执行效率；研究的核心认识论架构仍由人类在 AI 介入之前独立完成（Dellermann et al., 2019）。\u003c/p\u003e\n\u003cp\u003e本文界定并形式化一种不同于上述模式、但在现有讨论中仍缺乏充分理论化的结构化研究范式：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI 介导的认识论交互与知识生产\u003c/strong\u003e，是指一种持续的人类—AI 过程。在这一过程中，研究问题、概念结构、假设与形式化知识产出，通过递归交互被逐步生成、评估、修订并编码。为行文简洁，下文将这一范式简称为 \u003cstrong\u003eAI 介导的认识论知识生产（AI-mediated epistemic production）\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003eAI 辅助研究与 AI 介导的认识论知识生产之间的决定性差异，不在于 AI 的参与程度，也不在于任务范围是否开放，而在于：\u003cstrong\u003e具有认识论意义的新颖性究竟在研究过程的哪个环节进入。\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAI 辅助研究：\u003c/strong\u003e 研究的核心认识论架构——包括研究议程、核心概念和基础性研究框架——在 AI 介入之前已经固定。AI 主要用于执行和优化预定义的研究任务，即使实践中偶尔也可能产生一些次要问题或洞见。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI 介导的认识论知识生产：\u003c/strong\u003e 递归式的人类—AI 交互会生成涌现式研究问题、持续演化的抽象结构和迭代性假设，并最终形成形式化的知识编码。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e在这种“介导式”模式中，研究的核心认识论组成部分并非由人类研究者预先设定，而是在持续的人类—AI 对话中不断涌现、调整与重构。这使该框架从根本上区别于随意的 AI 头脑风暴；后者缺乏结构化的认识论迭代、形式约束以及标准化的知识编码机制。\u003c/p\u003e\n\u003cp\u003e当代研究已越来越多地认识到，大语言模型能够参与科学假设的迭代形成与优化，而不只是执行静态、预定义的任务（Park et al., 2024）。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"现有关于人类与生成式 AI 协作的大量文献，主要聚焦于 **AI 辅助研究流程（AI-assisted research workflows）**（Vaccaro et al., 2024）。在这一传统范式中，研究者通常会预先设定完整的研究议程、固定的研究问题与预定义的概念框架。人工智能系统主要承担辅助性的任务执行工作，包括文献整理、语句修订、结构填充与内容摘要等。这类辅助的核心作用，是在边界既定、范围预设的研究任务中提升执行效率；研究的核心认识论架构仍由人类在 AI 介入之前独立完成（Dellermann et al., 2019）。\n\n本文界定并形式化一种不同于上述模式、但在现有讨论中仍缺乏充分理论化的结构化研究范式：\n\n**AI 介导的认识论交互与知识生产**，是指一种持续的人类—AI 过程。在这一过程中，研究问题、概念结构、假设与形式化知识产出，通过递归交互被逐步生成、评估、修订并编码。为行文简洁，下文将这一范式简称为 **AI 介导的认识论知识生产（AI-mediated epistemic production）**。\n\nAI 辅助研究与 AI 介导的认识论知识生产之间的决定性差异，不在于 AI 的参与程度，也不在于任务范围是否开放，而在于：**具有认识论意义的新颖性究竟在研究过程的哪个环节进入。**\n\n- **AI 辅助研究：** 研究的核心认识论架构——包括研究议程、核心概念和基础性研究框架——在 AI 介入之前已经固定。AI 主要用于执行和优化预定义的研究任务，即使实践中偶尔也可能产生一些次要问题或洞见。\n- **AI 介导的认识论知识生产：** 递归式的人类—AI 交互会生成涌现式研究问题、持续演化的抽象结构和迭代性假设，并最终形成形式化的知识编码。\n\n在这种“介导式”模式中，研究的核心认识论组成部分并非由人类研究者预先设定，而是在持续的人类—AI 对话中不断涌现、调整与重构。这使该框架从根本上区别于随意的 AI 头脑风暴；后者缺乏结构化的认识论迭代、形式约束以及标准化的知识编码机制。\n\n当代研究已越来越多地认识到，大语言模型能够参与科学假设的迭代形成与优化，而不只是执行静态、预定义的任务（Park et al., 2024）。","sourceFormat":"markdown"},"note:sha256:cf4919fa76ab055d275cecd48a8d31834c1e2439b3d2626a73430253c9058ffc":{"html":"\u003cp\u003e\u003cem\u003eAI-mediated Epistemic Interaction and Knowledge Production\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e作者：\u003c/strong\u003e Kaining Wang\u003cbr\u003e\u003cstrong\u003e机构：\u003c/strong\u003e 北京 Amber 生物医学工程研究院（Beijing Amber Institute of Biomedical Engineering）\u003c/p\u003e\n","kind":"html","rawMarkdown":"*AI-mediated Epistemic Interaction and Knowledge Production*\n\n**作者：** Kaining Wang  \n**机构：** 北京 Amber 生物医学工程研究院（Beijing Amber Institute of Biomedical Engineering）","sourceFormat":"markdown"},"note:sha256:cf6101a7d674b197c3ab7baaca7dca95dd8a33d83b4627ad91ab465feff604ef":{"html":"\u003cp\u003e多模型并行交互用于评估候选认识论结构的跨系统稳定性，并帮助区分可能具有一般性的结构与模型特有产物。相关研究已经提出多 LLM 比较工作流，用于量化不同模型输出之间的结构一致性；但此类一致性指标本身并不构成最终的学科验证。\u003c/p\u003e\n","kind":"html","rawMarkdown":"多模型并行交互用于评估候选认识论结构的跨系统稳定性，并帮助区分可能具有一般性的结构与模型特有产物。相关研究已经提出多 LLM 比较工作流，用于量化不同模型输出之间的结构一致性；但此类一致性指标本身并不构成最终的学科验证。","sourceFormat":"markdown"},"note:sha256:d8b1e517706d8e076f971ff3251ceb2a5b625c76d9fc30a729c25297ab858aad":{"html":"\u003cp\u003eClark, A., \u0026amp; Chalmers, D. J. (1998). The extended mind. \u003cem\u003eAnalysis, 58\u003c/em\u003e(1), 7–19. \u003ca href=\"https://doi.org/10.1093/analys/58.1.7\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1093/analys/58.1.7\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDellermann, D., Lipusch, N., Ebel, P., \u0026amp; Leimeister, J. M. (2019). Design principles for a hybrid intelligence decision support system for business model validation. \u003cem\u003eElectronic Markets, 29\u003c/em\u003e, 423–441. \u003ca href=\"https://doi.org/10.1007/s12525-018-0309-2\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1007/s12525-018-0309-2\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDewey, J. (1938). \u003cem\u003eLogic: The theory of inquiry\u003c/em\u003e. Holt, Rinehart and Winston.\u003c/p\u003e\n\u003cp\u003eFierro, D., Dhar, R., Stamatiou, M., Garneau, N., \u0026amp; Søgaard, A. (2024). Defining knowledge: Bridging epistemology and large language models. \u003cem\u003eProceedings of the 2024 Conference on Empirical Methods in Natural Language Processing (EMNLP)\u003c/em\u003e, 16096–16111. \u003ca href=\"https://doi.org/10.18653/v1/2024.emnlp-main.900\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.18653/v1/2024.emnlp-main.900\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eHorvitz, E. (1999). Principles of mixed-initiative user interfaces. \u003cem\u003eProceedings of the SIGCHI Conference on Human Factors in Computing Systems (CHI ’99)\u003c/em\u003e, 159–166. \u003ca href=\"https://doi.org/10.1145/302979.303030\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1145/302979.303030\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eHutchins, E. (1995). \u003cem\u003eCognition in the wild\u003c/em\u003e. MIT Press.\u003c/p\u003e\n
