</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-08-25T07:31:30.535Z","language":"zh-CN","name":"DeMinds","version":"1.0.26"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"李飞飞最新访谈：AI咋能代替人呢？","outlineVersion":1},"sourceRevision":"sha256:413b971ad6aa90ca572db6527715ec6ef05814baa1f5cc3e09e5f2551179c42a","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"李飞飞最新访谈：AI咋能代替人呢？.md","sourceUrl":"https://mp.weixin.qq.com/s/mjYarBmoETYTcj3husF4Hg","title":"李飞飞最新访谈：AI咋能代替人呢？"},"files":[{"byteLength":38799,"content":"# 李飞飞最新访谈：AI咋能代替人呢？\n\n\u003e [量子位](https://mp.weixin.qq.com/s/mjYarBmoETYTcj3husF4Hg) · 关注前沿科技 · 2026-08-16 18:30\n\n文婷 发自 凹非寺\n量子位 | 公众号 QbitAI\n\n**AI咋能代替人呢？**\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGFv7xcZjz2kbjicibYe6Ovd5J7d93FlfDTNoYibhTcGOq8klzN0IjsvjLf9TCD1ibxqqLjwXjdicuVSiczgCibhRQNXibAIytPy6jtgP0M/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\u0026tp=webp\u0026wxfrom=5\u0026wx_lazy=1)\n\n不错，这话是李飞飞说的。\n\n在Huberman Lab最新一期访谈中，李飞飞还讨论了“为什么苏格拉底是人类历史上最顶尖的‘提示词工程师’”、“为什么不能一刀切地禁止学生们用AI”等非常有趣的话题，并给出了一个笃定的答案：\n\n\u003e **无论是在医疗、影视、还是教育等领域，AI都不是人类的替代者，而是个人能力的放大镜。**\n\n全程高能，重点笔记如下：\n\n- 我觉得人类一直没吸取的一大教训，就是老一辈总爱哀叹下一代，仿佛年轻人什么都不懂，说他们没规矩、遗忘历史。但**纵观人类历史大脉络，我们整体其实是在向着更好的方向发展。**\n- **不能只让少数科技企业替整个社会做决定**，单纯追逐市场收益的逻辑，绝不能凌驾于社会伦理与大众文化之上。\n- 学术界和医学界有个不成文的潜规则，即掌握技术核心逻辑的人，会刻意回避向大众讲清底层原理，靠信息差守住话语权，可这种做法对任何人都没有好处。**只有让人们了解真相，大家才会更有安全感。**\n- 想要守护下一代，**一定要看见教师群体，帮扶老师与家长**，才能真正引导青少年正确使用 AI。\n- **技术变革时代，机遇和阵痛同时存在，我们需要理性、审慎地面对。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGmdHsCFWEUgBH9PrmoX6nHph73r2RictEdy8Pqrxkgd7vfr7sGIQ7LdLVp0VBqhz1tgtuNp7iaub600jVriaK1aW32foMPBDfLAk/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n本文在不改变原意的基础上，由AI对访谈内容文字实录进行了精校。\n\n看得开心！\n\n## AI还缺什么？\n\n**主持人（Andrew Huberman）：**飞飞，我们今天先从**视觉**开始聊聊AI吧。很多人觉得光线感知和AI离得很远，但它其实是AI发展的一大起点？\n\n### 视觉是智能的基石\n\n**李飞飞：**没错，**视觉是智能的基石。**我们可以沿着生物演化和计算机视觉两条脉络来理解它。\n\n从生物演化来看，5.4亿年前，远古海洋生物第一次“看见”光，感光细胞的出现直接催生了寒武纪物种大爆发。对人类而言同样如此，我们大脑皮层一半的神经活动都与视觉相关，婴幼儿也是先学会“看”，再学会“说”。\n\n对AI而言，视觉对它的贡献主要体现在**提供算法灵感**和**促进数据觉醒**两方面。\n\n第一是**算法灵感**。上世纪50年代，科学家们发现哺乳动物的视觉系统具有层级神经结构，这直接启发了早期神经网络的设计。\n\n如今，模型参数的规模虽已暴涨，但其根源仍可追溯至生物视觉研究。\n\n第二是**数据觉醒**。本世纪初，算法效果始终不太理想，2006年我在普林斯顿做研究时才意识到，**卡脖子的可能并不是算法，而是训练数据太少了。**\n\n你想想看，一个孩子到6岁便能认出桌子、椅子、花等几万样东西，靠的就是成长过程中看过的海量画面。\n\n受这个启发，我们才不再死磕算法，转而发起ImageNet项目，攒出了千万级的图片数据集。\n\n等到2012年，**大数据集、深度神经网络和GPU算力三者碰头，现代AI才算真正迎来了转折点。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGNrG1HgWcrQfVbp4TiaeZAxHkOWWw97WAZPdiaqiaPicGs9Zg1ibSdypBaCQgiclfo9gW424RqJfYkhymN4rIbJic5FrVTiczL3lmfTib4/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**主持人：**2012年前后，AI的图像识别能力突然上了一个大台阶。以前连相似的人脸都分不清，2012年之后一下子就能精准认出谁是谁，这背后到底发生了什么？\n\n**李飞飞：**就是刚才所说的**“GPU并行算力提升、神经网络技术成熟、互联网带来海量数据”三要素集齐了。**\n\n拿ImageNet图像识别竞赛举个例子，**人去分辨一千种物品，识别错误率大概只有4%**，且我们认错大多不是看得太仓促，纯粹是东西长得太像，或是记混了品类。\n\n而早年神经网络的错误率虽然下降了一大截，但始终比不上人类；一直到2016年，算法识别准确度才第一次超过人。\n\n**语音、听觉方向的发展路径，和图像识别几乎一模一样。**\n\n2016到2017年，Transformer架构出现之后，性能很快就甩开了图像领域最早的经典模型AlexNet；\n\n随后，靠着更完善的网络结构、海量文本素材，再加上GPU算力支撑，经过整整五年的迭代优化，ChatGPT才在2022年正式问世。\n\n**主持人：**我觉得人身上有个特别厉害的天赋，叫**物体恒存。**\n\n好比我们只看见一截猫尾巴，结合房间里的环境，便能立刻判断这是一只家里养的猫，而不是狐狸。\n\n你觉得AI什么时候才能拥有这种结合场景自主推理的能力呢？\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGKAPw5r0rROCQuxFka6fucr8r3h0d7sic02U8HTNiajv70xTdYxzvtiaicuBmHwO7ojfHKicj4WBekIRqM0QOrp2nlaBia8K8xpPS4U/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**李飞飞：**现在的大模型依靠海量数据，确实能做出差不多的判断，但**底层逻辑和人脑完全是两码事。**\n\n小孩子只见过几只猫，就能举一反三认出所有猫；可AI得刷完网上几乎所有猫咪图片，依靠数据里的统计规律去分辨。\n\n**两者的学习逻辑天差地别**，背后还有一大堆待破解的科学难题。\n\n**主持人：**后来AI还能让静态图动起来，比如让图片里的猫追着老鼠跑，这又是怎么实现的？\n\n**李飞飞：**关键就是**往训练数据里加入大量新的视频素材**，一个标志性的节点就是**2024年Sora发布。**\n\n不过，**当时的算法仍建立在神经网络框架之上，尚未出现颠覆性的技术革新。**\n\n**所以模型还是看不懂猫的肌肉构造及身体结构**，只能靠着海量的视频摸透了物体运动的统计规律，并生成看着符合常识的动作；\n\n这也就解释了为什么AI生成的画面会经常出现别扭或不合理的bug了。\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGHcHBve6TOXWz0XFzbzOeZic0WU2kiaSRGRQeasnW931NNctBemVORQRfc7VvgVHIrhPrtow0sbHFt3lXSnVrN7EhH0ETmxz7e3U/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n### 私人又主观的情感体验\n\n**主持人：**那往更深一层说，像自主创造力、独属于个人的内心感受呢？\n\nAI所有训练素材都来源于网络，但人有太多私密的内心体验根本不会发到网上。就像欣赏抽象画作时独有的情绪、想起小时候老家那种专属自己的感触，**AI是不是永远都欠缺这部分感知？**\n\n**李飞飞：**你问到了最核心的一点。\n\n**互联网汇集了人类图文、影像等各式各样的行为数据，这也是AI之所以强大的根本。**\n\n但那些高度私人化的思绪、情绪与心底的感触，没有任何形式的记录，网上自然找不到相关数据，**AI根本没办法学习和体会。**\n\n举个例子，AlphaGo下出的第37手，看着好像具备了创造力，可围棋有一套完整严谨的数学规则；\n\n反观不少**顶尖数学难题**，需要人类跳出固有框架想出全新解法，**这类问题我更看好人和AI配合协作攻克。**\n\n至于看到一只杯子，瞬间勾起只属于自己的童年往事，这种**私人又主观的情感体验，是现阶段AI完全触碰不到的局限。**\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGHGgX30stJj221DPyjbr8cMe1YP3Jv2Ip5yZjs5q7fCMu3t4uMKplic0b55icnaTqCXJT4mkvZfc419YPjA4SgUYqh2olmsnYOl0/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**主持人：**那将来如果用上无创脑机设备，直接读取大脑里的信号，能不能补上这块短板？\n\n**李飞飞：**单从理论技术层面来讲有实现的可能，但有一个硬性前提是“人内心的心理活动信号，得能被传感器捕捉识别。”\n\n要是连我们自己都没办法用语言或者动作把内心细腻的感受表达出来，机器自然也就获取不到对应的信息。\n\n**主持人：**那直觉、内心诉求、紧迫感这类发自本能的内在状态呢？AI有可能产生真正属于自己的内在驱动力吗？\n\n**李飞飞：**现在我们能通过设定目标函数，让AI模仿出近似的效果，像是深度思考模式、快速应答模式等等。\n\n可这些说到底也**只是调整数学参数而已**，**AI不会生出真实的恐惧、喜爱，更不存在发自本心的共情。**\n\n它说出那些安抚人的话语，只是套用学到的语言表达模式（learned language patterns），和人类发自心底的共情完全是两回事，**这一点很有必要跟大众好好科普清楚。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGHr5iawoYNjeEGNdX5EMf3rdk5Biaia37RLTicviaJ6nzbqH0sftVuODqEibkDXssPgr7xo4eT1ZTtTia4rgFjibrLRKJbhstL5vf7lFlo/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n### 技术创新和潜在风险\n\n**主持人：**那如今，AI技术迭代得这么快，监管部门、普通大众还有行业从业者，要怎么把握分寸，平衡技术创新和潜在风险？\n\n**李飞飞：**这也是我在斯坦福大学创办**HAI（以人为本人工智能研究院）**的初衷。\n\nAI行业的发展可以参考汽车、生物科技过往的发展治理经验，让所有相关方都参与进来共同把控。\n\n一方面我们要**制定完善的行业伦理准则**、**在高校开设AI伦理相关课程**，**配套落地对应的监管条例**；\n\n像医疗AI这类高风险应用，还需要类似FDA的**权威机构设立安全红线。**\n\n**不能只让少数科技企业替整个社会做决定，单纯追逐市场收益的逻辑，绝不能凌驾于社会伦理与大众文化之上。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGUVpLJAJA3o7HU3iaXuiadicGOpVB4TEV84AG0CXGI2NoKg4xJoorY79JvjoNvkXSicAoedOh0XWJzdSzpeO1icntRTuyJ7KtHTia6Q/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n## AI不是替代者，而是个人能力的放大镜\n\n**主持人：**这个回答非常切中当下。那我们接着聊一个大家都很期待、而且现在已经初见成效的方向——**AI在疾病发现和治疗上的应用。**\n\n我们都知道，生物医学本身还在不断迭代更新。这不是说现在的皮肤科、神经外科、肿瘤科医生的专业知识不靠谱，他们一直都是在成熟的知识体系里开展工作，只是**这套体系本身一直在更新。**几乎每个月，都会有新的研究成果推翻过去的固有认知。\n\n就拿教科书里的知识点来说，我们一直学的是神经元的动作电位遵循“全或无”原则，要么完全触发，要么完全不触发。\n\n但多年前，《Nature》上就有论文证实，同一个神经元产生的动作电位，波形其实可以千差万别。**业内几乎所有人都看过这项研究，却很少有人真正愿意接纳这种颠覆传统的结论。**\n\n但**AI不一样**，**它可以毫无负担地全盘接受新设定**，处理海量数据、吸收新知的效率，**甚至超过斯坦福、MIT、加州理工等全球顶尖高校的研究生。**\n\n所以我想听听你的看法，**未来医生、患者要怎么和AI协同配合、一起攻克疾病呢？**\n\n我们能不能借此建立一套**全新的科研发现和诊疗模式**，从根本上提升医疗效果、改善人类的健康状态？\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGEmOiaw5OC3xSAQ0YkTWTLgfOYFd0n9vAUXAACqcplkQwicL371sE3FRkbE8jPqiaCForSoSeuj0x7DuRSxULR6ps2SibLm2bdhVKM/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n### 辅助前沿科学研究\n\n**李飞飞：**你说到了AI最有价值、也最让人期待的落地场景：**辅助前沿科学研究。**\n\n放到生物医学领域，更是直接关乎所有人的疾病与健康。\n\n长久以来，科研突破几乎完全依靠人类研究者，靠着一代代积累的理论知识，耗费大量时间精力反复做实验。\n\n**虽然现在有各类大型科研仪器，但研究的核心始终是人，而AI相当于一款全新工具**，它能储存海量资料、打通不同学科的知识壁垒，做到人类很难实现的跨领域融合。\n\n拿我自己举例，我深耕视觉神经科学和人工智能，但对嗅觉相关领域一窍不通，很多专业术语我都不熟悉，**人脑很难同时吃透这么多细分方向，AI却没有这种局限。**\n\n这就像数百年前电力问世，彻底重塑人类社会，既是巨大机遇，也难免让人产生顾虑。\n\n**用AI助力医学研究、临床诊疗，就是当下最值得深耕的机遇。**\n\n怎么整合各类医学信息、怎么把分析结果清晰给到医生和患者，怎么让患者全程参与诊疗过程，这里面还有非常大的探索空间。\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGD3AiadKoT7chd5TCOO2uhhxgfDrSlDQoEKYCr0aeturzX3UgwPbibsgdM0j2ic4o6gnx4hqy4UH12Oia3iaafVDuQVOY4pCibolkow/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**主持人：**我先叠个甲，我不是说AI能胜过所有医生，但我前段时间亲身经历了眩晕的问题，是AI帮我分清了根源到底是眩晕症，还是血压过低。\n\n**当时就连一位专攻前庭问题的耳鼻喉专科医生，一开始都判断失误了。**\n\n**李飞飞：**你当时输入了哪些信息？只输入了自己身体的主观感受，没有其他检查数据吗？\n\n**主持人：**就只描述了一两天里身体的异样感受。\n\n后来我发现是医生开的药产生副作用，那种感受特别难受，整个人天旋地转，总觉得身体在往下坠。\n\n我自己能分清单纯头晕和病理性眩晕，梳理完线索才确定，是药物让我的血压降得太低。我当时咨询了好几位业内不错的医生，当然都不是斯坦福这边的。\n\n**李飞飞：**那我们单纯从学术、客观的角度聊聊这件事。\n\n**主持人：**这件事非常有意思。我后来和那位复诊的医生聊，他坦言如果我当时直接到诊室，他能安排全套检查排查病因。\n\n**但我靠AI没花一分钱，一上午就锁定了问题根源**，补充电解质之后，短短两小时身体不适感就完全消退了。\n\n当然不能完全排除心理安慰剂的作用，但我的症状确实好转。我也不是建议大家生病不去看医生，只是**AI展现出的辅助能力，实在让人惊叹。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGggUY85eyoyGD2ibibLQx53MnicoZ8vB1UiatmmkGVDoL5iaTm8quic15p9zj2VQMIxNn5ia5nGKibxEAETtibGBCYHPqmIgEDkZbkswGw/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**李飞飞：**我觉得医生完全可以把这类工具当成**诊疗帮手。**\n\n### 人机协作可以大放异彩\n\n我说一件我自己亲身经历的事吧，就是咱们这次访谈原本要延期，因为前段时间我父亲在斯坦福做肝脏手术。\n\n这场手术依靠**达芬奇手术机器人**完成，并由外科主刀医生全程操控，这就是很典型的人机深度协作。\n\n术后我和主刀医生聊，问他如果整合全球所有同类型肝脏手术数据，有没有可能训练出一台能全自动完成肝脏手术的AI？\n\n他给出的答案并不乐观，人体肝脏结构错综复杂，血管分布密集，每个人的器官形态差异极大，就算汇总全世界所有病例，数据量也很难支撑算法达到稳定可靠的水平。\n\n这也印证了一个关键点，**AI的判断全部依托数据里总结出的规律，一旦对应场景的样本稀少，我们就要理性看待AI的能力**，分清哪些场景适合使用，哪些场景还无法依靠它。\n\n像这种复杂外科手术，医生操控机器人操作，效果远比机器人自主执刀要好得多。但外科医生的经验，又会受自己实操手术数量的限制，**这正是人机协作可以大放异彩的地方。**\n\n未来还有很多可能性。我们能不能搭建肝脏器官的虚拟仿真模型，让AI无限次模拟手术训练？这也是现在还在探索的科研方向。\n\n但像你之前遇到的低血压、眩晕鉴别诊断，**这类病症积累了海量病例，数据库样本充足，AI就能充分发挥作用，给那些没法及时线下就医的人提供初步参考。**\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGEnmEZkBtrLYyOic0zOAsiaGyaEcIEMdPEW1TtVoAjenyVnUEUTMoFutCmLYpYqIOCqLdlQ42Y5sF0wQnmaLoKeXG3yAl9HTicRibA/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**主持人：**很高兴听到你父亲手术一切顺利。\n\n**李飞飞：**谢谢，手术很成功。得益于腹腔镜机器人技术，**术中出血量比传统手术少了十倍。**\n\n## 技术应服务于人的真实需求\n\n**主持人：**有时候我觉得机器反而能展现出人时常缺失的善意，比如Waymo的车每次看到我，还有我六个月大的小狗，都会主动避让，可现实里不少人类司机反倒做不到hhh。\n\n把时间拉长到两三年，放在我们这一生里来看，大批机器人走进日常生活、走进社会，会是什么模样？\n\n### 机器人分担繁琐费力的杂事\n\n**李飞飞：**首先我想说，**Waymo这套模型，还是必须得把现实里所有的交通规则全都学透才行。**\n\n其次我觉得，**硬件类产品落地见效会慢很多。**\n\n我是独生女，家里两位长辈年纪大、身体都不好，还不会英语，平日里照料的担子很重。我特别希望能有机器人分担体力活，当然**它绝对替代不了亲情陪伴和家人间的谈心，只是帮我们扛下繁琐费力的杂事。**\n\n加州常年有山火，人类消防员冲进火场风险极高，这种**高危作业完全可以交给机器人。**\n\n再比如**独居老人**，买菜、取药、出门散步都不方便，现在只有快递配送能解决一小部分需求；\n\n**医疗护理行业更是常年缺人，护士永远超负荷连轴转。**我父亲住院那段时间我亲眼看到，护士一个班次要来回跑无数趟取药、搬运物资。\n\n只要让机器人接手这类工作，**能造福社会的场景实在太多了。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFClclMH5KDPrjczlA3ibmOGlJHRcBWk63M56shMsCungR3ibeB9IIbicgnibErG00Zagw7aVricOzHThe1HicvlB6gH7OeZJRiaFAR10/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**主持人：**听你说完，我脑海里已经浮现出不少机器人帮忙送货上门、疏导交通的画面了哈哈，**我觉得大众对机器人、AI的恐惧，很大一部分来源于它是实体的。**\n\n我觉得人和实体机器共处，跟人与人之间相处完全是两回事。我倒不奢求能和机器人产生什么情感羁绊，只希望它能帮我叠衣服、扫地、打理花草、喂鱼……当然喂鱼我还是更喜欢自己来，亲手照料的过程很治愈。\n\n**李飞飞：**你的小狗会帮你喂鱼吗？\n\n**主持人：**哈哈那倒不会，它是只不太聪明但性格很好的斗牛犬，它只会趴在鱼缸边上盯着，完全不懂怎么照料鱼儿。\n\n**李飞飞：**你知道**大白（Baymax）**吗？迪士尼**《超能陆战队》电影**里的医疗机器人，外形像巨大的充气软气球，没有坚硬外壳，这种形态大家接受度会高很多。\n\n**![Image](https://mmbiz.qpic.cn/sz_mmbiz_jpg/A6fTew8FFGHfPGuaFcByyQrPhYIxCh9CZsOudqPV7nXibJUJIXTY0MWLNicc6myU4a0sV6Dh3kwHZL1vkH3x2TAw6ouQgyq0eAXicVjS1g07KY/640?wx_fmt=jpeg\u0026from=appmsg\u0026watermark=1)△**来源迪士尼动画电影《超能陆战队》\n\n**主持人：**确实呢，也更容易适应。\n\n**李飞飞：**我们再说回自主技术这件事吧。\n\n我觉得**未来的生活图景，不该由某一家企业、一群投资人单方面定义，全社会都该主动参与、一起构想。**\n\n现在关于AI的舆论有个很大的问题，**普通人永远只能被动接受技术带来的结果，却没办法参与到前期设计规划里。**\n\n**主持人：**就像之前你父亲做手术，医生操控机器人配合操作，人机协同才能发挥最好的效果。我也想到不少场景。\n\n小孩子独自上下学是很好的锻炼，但家长总放心不下安全，如果有陪护机器人一路随行，遇到危险可以立刻报警，甚至简单防护，就能给孩子更多独立活动的空间；\n\n线上网络环境复杂，家长很难全方位看管，或许可以做一个线上守护虚拟形象，自动识别不良风险、隔绝有害信息。\n\n**李飞飞：**这个思路完全能做成一个很不错的创业项目。\n\n**主持人：**但眼下现实条件还差得很远。\n\n我读博的时候常在帕洛阿尔托街头碰到**乔布斯**，他经常光脚出门，打扮得像个嬉皮士，对待员工脾气也直，放在现在公司HR肯定很难接纳。\n\n但他很懂，计算机不能只是冰冷机器，要做出圆润便携的外观、能轻松揣进口袋，开机界面放上鲍勃・迪伦（传奇民谣音乐人），一点点消弭人和科技之间的隔阂。\n\n有人会说这是**变相的“特洛伊木马”**，但我不这么看。\n\n**想要实现人和机器人良性共存、互相协作，就需要这种懂技术、更懂人性的人。**\n\n很多顶尖技术天才专业能力无可挑剔，可大众始终难以接纳他们的理念，根源就是不懂如何与人沟通、传递技术价值，**他们需要擅长人文表达的合作者配合。**\n\n另外**不少媒体总刻意制造对立**，大肆渲染“科技从业者抢走普通人的一切”，大多只是为了博取流量牟利。\n\n我们去哪里才能找到这种兼顾技术能力与人文共情的人才？\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGEZ7DX1NC13Sevm3Ycb129wSappKSASr9MeVkcBTdgz6icjypqicZb3M0AaIo0W4cchBcDAQTs7CWrVK7FNw0VHCOehpUYvDphLk/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**李飞飞：**其实有不少这样的人，你就是其中之一。\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGiapmPQpibf8Ks2shnQsJzQibnf47pAjZRc0suUTNPLLcnmj2hjaJhDvg7QjK1e9oD0fRIxq69NW5meqZiaicHoUcIYA3iaNKeTSbTs/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**主持人：**可惜他们太正常，导致获得的流量和关注度太低了。\n\n**李飞飞：** **不少创业者都在做极具社会价值的事**，比如用AI研发新药、辅助诊疗、研究衰老、打造心理健康工具；还有大批设计师、产品经理在为此努力。\n\n**但舆论的话语权，总是给到了那些一味鼓吹技术万能的人。**\n\n这期播客就是想**多传递人文视角**，把普通人的真实需求、人类长远的未来纳入AI讨论。\n\n我并不悲观，我本身是教育从业者、技术建设者。我见过很多优秀年轻人，明明能去大厂拿高薪，却选择加入World Labs，想用技术实实在在帮到普通人，只是这类声音太少，很难被大众听见。\n\n**如今公共舆论两极分化严重**，一部分人忙着散播末日恐慌，另一部分人忙着鼓吹技术无所不能，两种声音都太过极端，很容易让普通人觉得**“你们掌握技术的人当然站着说话不腰疼”**。\n\n我们需要回归客观中立的视角，理性看待技术本身，重点讨论该如何合理运用，**让全社会一起掌握塑造未来的主动权。**\n\n**主持人：**我一位同行说过一句很简单、却总被大家忽略的话：“大众不爱听冷冰冰的技术故事，更容易共情充满人情味的真人经历。”\n\n比如AI协助兽医治好宠物癌症；孩子病症罕见、多位医生找不到病因，AI帮忙锁定病灶……这类故事才动人、容易引发共鸣.\n\n可流量和曝光，远远比不上博眼球的极端内容。传统媒体只追逐一两天的短期热点，很少深耕长期行业趋势。\n\n还有无数人一直在推动AI向善、探索人机协作，我们应该多看见、多传播他们的声音。\n\n这个话题先告一段落，我们来谈谈**AI与影视创作的关系吧。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFE9YCfrxZ4MyFDPDjWicg6aJIVgqYIGFzfFgPzZlp6icvuZqsHln4oEavZrkwX0VGSjtUSjULiaq6ZID0Mneia9WWvTZxgd1n4J0E/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n### AI与影视创作的关系\n\n**李飞飞：**Ok，这个话题其实很复杂，也牵扯着很多创作者的顾虑，因为**大家害怕AI夺走编剧和其他创作工作。**\n\n我们可以把**技术现状**和**就业冲击**分开讨论，虽然两者密不可分，但单从技术层面来说，把剧本自动转换成镜头片段的能力已经十分成熟，市面上已经出现AI生成短片，甚至接近长片规模的作品，海内外不少企业都在研发配套工具。\n\n**但一部作品的核心内核永远属于人类**，那些独一无二的细腻情绪、叙事角度、镜头表达、人物塑造，都是编剧和作家不可替代的核心价值。\n\n**如何用好AI工具，更好地承载人类的故事表达，放大表达者的能力，是我们当下要解决的关键难题。**\n\n好莱坞业内普遍充满焦虑，**技术带来的冲击真实存在**，但我们更要思考如何积极应对、良性转型。\n\n电影产业不是我的主营领域，但我期待行业能开展更多细致、深入的探讨。\n\nAI正在彻底改写影视叙事的创作模式，我的联合创始人Ben之前和**本・阿弗莱克（好莱坞知名编剧，代表作有《心灵捕手》等）**深入交流过，他也在用全新视角看待 AI 工具给电影制作带来的改变。\n\n**技术从业者和影视创作者多多对话交流，在当下尤为关键。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFGzOoU2xKicNzBonpjxMq5vpUFWGRfq3FxRIWNdqriclGbPTbda3uItJjwW19a6f1IU1svbN5egiaNSGNSOpJuFpGjPgJZwfvWw8/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**主持人：**技术变革好像总会迎来这样的转折点，只有行业内部从业者主动接纳、参与改造，新技术才能真正普及落地。\n\n这让我想起来小时候，大家都去店里冲洗胶卷、租赁长焦镜头。\n\n后来数码时代到来，冲印、胶片相关岗位大幅消失，**但摄影这个行业并没有彻底消亡。**\n\n**李飞飞：** **行业只会转型迭代**，从业者可以通过学习新技能完成自我升级。\n\n现在已经有很多创作者主动钻研AI工具，主动跟上技术趋势、强化自身不可替代的能力。\n\n**技术变革时代，机遇和阵痛同时存在，我们需要理性、审慎地面对。**\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGXbU5o15ib9w2iboMfrD7fPGDjWaH8MvUbUcm2icuwFeeIK1w3DCptHWrCswwgZgnJShQCdHmtK4T3HWhZoI2cibT0Ixj5vRrcgWY/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n## 该怎么教孩子用好AI？\n\n**主持人：**现在不少家长都有同一个顾虑，AI这么方便，要是以后孩子一碰到难题就直接找AI解答，他们就不愿意主动动脑学习了。\n\n其实当年计算器、电脑、打字机刚问世的时候，社会上也掀起过完全一样的担忧。\n\n乔纳森・海特（美国社会心理学家、纽约大学教授）提出：\n\n\u003e **人们在享受便捷的同时，也在失去一些东西，青少年更是容易深陷技术带来的负面影响。**\n\n你能结合当下AI发展的现状，分乐观、中立、悲观三个角度谈谈未来会是一个什么样的走向吗？\n\n**AI究竟会拓展青少年的思维、对他们几乎没有影响，还是会造成伤害？**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGEyhdtlic84ib930SFGubAFtaKsSTApPwbKcpQhZKJGALicOks00NZDxJ3CuxfAXia0aAUPKpYWVNmDKMDt5QUfTKtMnA5mm6nIQns/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**李飞飞：**这个问题问得特别好。我们之前聊过人的内在驱动力、自主意识，答案其实就能顺着这些话题延伸出来。\n\n**最糟糕的情况，就是AI会夺走年轻一代的自主学习和生活能力。**\n\n不管是无休止地刷短视频、还是被动接收推送信息流，都会一点点消磨人的主观能动性。\n\n人脑的生理运转逻辑不会因为晶体管技术发生改变，神经元、体内化学物质、各类激素的运作自有固定规律。\n\n人的成长，尤其是青少年阶段的成长，学习本就需要投入时间、付出努力，过程里难免会遭遇挫折。\n\n不管未来社会、职场如何变迁，人的大脑和身体都需要完整发育。\n\n**学习的内生动力、自主思考的能力，不能被任何人、任何机器剥夺**，这也是我最担心的一点。\n\n**如果滥用AI，消磨掉孩子的主观能动性，下一代的大脑就没法得到充分发育。**\n\n但还有另一种极端误区也很危险。\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGFeDWIicvYUxXpPAm0ibWHNGOugATF45wfNV4QY542Xr5a1r1zianRCzmW2zvrwiaibibTGOiar0lbsEYZBqCxZQYlHA6FGyTMguibQNJs/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n因为担心学生作弊、直接用ChatGPT生成作业答案，就**一刀切完全禁止学生接触AI工具，这同样是不可取的。**\n\n只要学生保有主动求知的内在动力，掌握正确的使用方式，**AI能把学习的深度提升到从前难以想象的地步。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFPzVcjC0vKIShMOvV3MgmQxjC8wkSNFM3Ng1I3xfxcPpKbibJtVFzQau3D8kWJicPia4Yca0iaPebcX44VbxudCVULQGu3icl3um5A/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n我本科时原本打算走医学预科路线，有机化学的难度很高，我当时想吃透分子的空间结构，但助教答疑时间很短，还总跟我的课程冲突，教授能答疑的时间也十分有限，学习处处受阻。\n\n如果当年能有AI学习助手，我就能针对自己卡壳的知识点反复提问；\n\n**只要自身有学习的意愿，AI就是极强的辅助工具，我们不该剥夺学生拥有这种助力的机会。**\n\n### 两种风险都需要我们警惕\n\n这**两种风险**都需要我们警惕。\n\n一是**过度依赖AI**，磨灭独立思考的能动性；\n\n二是**全盘封禁AI工具。**\n\n反过来，**最理想的局面就是守护好孩子们的求知欲与自主思考能力**，同时**引导他们合理运用AI**，这一代以及往后的年轻人会比我们更有智慧，**AI会成为放大他们个人能力的工具。**\n\n**主持人：**我非常认同这个看法，我对大脑的神经可塑性、对年轻一代都抱有十足的信心。\n\n**李飞飞：** **就算是成年人，大脑也依旧具备可塑性，别觉得年纪大了就没法进步，我们同样能借助工具提升学习效率。**\n\n**主持人：**这段对话**刷新了我对AI能力的很多认知。**\n\n面对完全陌生的领域，我会以普通使用者的身份向AI提问；\n\n等自己积累了一定知识储备后，再以创作者的身份和AI协作共创。\n\n**李飞飞：** **去年学校一名本科生点醒了我。**\n\nChatGPT推出之后，我遇到不懂的问题时，原本会直接去请教身边专业能力强的同事，但现在我意识到，**不该拿着毫无准备的基础问题浪费别人的时间，可以先靠AI梳理基础信息**。\n\n这么看来，**AI反倒是在推着我们改掉偷懒和不愿提前思考的习惯。**\n\n### 给孩子们的新必修课：学会向AI提问\n\n**主持人：**最后一个问题，你觉得**7-20岁的青少年**应当以什么样的心态看待AI？\n\n**李飞飞：**巧了，正好是我家孩子所处的年龄段。\n\n**主持人：**我之所以专门问这个问题，是有现实考量的。\n\n现在的年轻人对AI大多满怀新鲜感、十分兴奋。回望过去，计算机刚问世那会儿，书法老师就忧心，大家以后全都打字，手写能力会持续退步。\n\n**每一次新技术诞生，都会出现类似的论调，总有人担心人类会被技术毁掉。**\n\n我始终觉得，传统根基和未来发展需要兼顾，那现在孩子们内心真实的想法究竟是什么？\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGczW2zI3Et6IXpiax326tsZAfQpd56sbfMInnPCl4HdWMu8W9u6GPpKb3I8knNhT6ibpGq0SWO2yfoQcMobZXaDg2rRGWvudyjk/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**李飞飞：**作为一名教育者和技术从业者，无论去到哪里，我都希望能主动和学生、家长以及一线老师交流沟通。\n\n**可政策制定者、投资人、科技行业从业者们，往往会忽略老师、家长与青少年这群核心人群。**\n\n不少业内人自己也有子女，却很少静下心倾听他们的真实诉求。\n\n**我始终对年轻一代抱有期待。**纵观人类发展史，这样的场景不断重复：\n\n\u003e 老一辈总会感慨今不如昔，觉得年轻人不懂规矩、丢掉过往的传统。但**拉长时间线来看，人类社会整体始终在向好的方向前进。**\n\n我不否认发展路上会有冲突、磨难，但对人类整体的未来保持乐观。\n\n孩子天生带着旺盛的好奇心，AI固然能带给他们丰富的娱乐体验，但**他们也会慢慢学会合理驾驭这项技术。**\n\n真正让我放心不下的，其实是**一线教师与部分家长**。\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGHXzzGicGOAlwqwyib3RuA5SErGVT5qbAUOX7H7xvFnqNc2WOqQmcCubkY2Wj7572kXmoedYxzPyd7HVwjiaoibfZrWB87PXRic0DjE/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n整个社会，尤其是硅谷，**没能给他们充足的配套支持**，大多只会站在高处说教、一味指责。\n\n**教师和家长是支撑社会运转至关重要的群体，我们要做的是倾听他们的难处、提供帮扶与配套资源。**\n\n从基础教育到高等教育阶段，**老师们扛着整个社会最沉重的育人压力。**\n\n我说一件亲身经历的事，2022年ChatGPT刚上线，身处行业内的我第一时间给孩子小学的校长发邮件，主动提出**希望能入校做一场分享**，给老师和学生们科普新技术。\n\n不是因为我自认专业上高人一等，而是**希望一线教育者能第一时间了解这场技术变革。**\n\n硅谷的投资人、体量千亿的科技巨头，几乎没有人第一时间想到周边学校的授课老师，但这件事恰恰至关重要。\n\n老师们常会提出顾虑：**“学生用AI抄袭作弊该如何管控？”**\n\n这是非常合理的疑问，**我们需要走进校园，向老师们完整展示技术、赋能教育工作者，和他们一同摸索可行的解决办法。**\n\n**老师们学习能力强、也愿意主动改变，只是常常被外界忽略。**\n\n我看好孩子们的未来，但不会盲目乐观；\n\n想要守护下一代，**一定要看见教师群体，帮扶老师与家长**，才能真正引导青少年正确使用AI。\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGF5WqSLJycXC8ymqWjeF8PPR00WWmt84jian6gK9p11m99P4Mwey0uacicWRaKJRz0SvtSYMZ8AxSt71soIWNicG4ia8yHibpFY8Nck/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**主持人：**我十分认同你的这番话，相信很多人听到都会深有感触。\n\n**教师理应被善待，他们需要充足的资讯与全方位的支持。**\n\n**李飞飞：**如今大部分播客聊到教育与AI，只会走向两个极端；要么大肆渲染末日恐慌，要么一味鼓吹乌托邦式的美好，两种论调都没法真正帮到老师和学生。\n\n## 提示词的撰写质量有多重要？\n\n**主持人：**不好意思，我还想再追问一点，想要AI输出精准、高质量的内容，**提示词的撰写质量有多重要？**\n\n**李飞飞：**提示词是重中之重，起到**决定性作用。**\n\n**主持人：**可见**精准提问、撰写优质提示词，本身就是一项需要学习的核心能力。**\n\n**李飞飞：**没错，这也是我们开展AI科普、校园教学的核心意义。我特别希望中小学能把提示词思维纳入常规课程。举个有意思的例子，**你觉得人类历史上最顶尖的“提示工程师”是谁？**\n\n**主持人：**这个问题我恐怕答不上来。\n\n**李飞飞：**是**苏格拉底。**\n\n**倘若他生活在当下，绝对是顶尖高手。**他标志性的诘问法，本质就是层层递进、不断追问，顺着线索挖掘事物本质、探寻真理。\n\n这套思维方式，完全可以教给孩子们。\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFoI1RkTRtkvRLTYJeh2mJwG3RxORkicdlZwSU1RfqVEKZNGP85Qwv9b8k432BB1Le7nZPqibSCeYIqh31h9sQPOjuDg6AaT1AjM/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n此外我认为，**具身交互不只局限于人类康复领域，具身AI同样延伸到机器人赛道。**\n\n**AI的下一轮技术革新，早已不再局限于语言模型。**\n\n人类演化数亿年，在漫长岁月里都没有依靠语言交流；而具备实体的机器人能够辅助人类生活，让整个社会变得更好。\n\n## 技术洪流中，人才是最终的锚点\n\n**主持人：**我们讨论AI，核心一定要抓住一点，即**技术本该拉近人与人的距离，而不是制造隔阂。**\n\n现在不少AI领域的领军人物，也还在学着如何面对公众。一旦站到聚光灯下，身上一丁点不足都会被无限放大。\n\n我期待他们能更快成长，向大众传递客观、真实的技术全貌。\n\n学术界、医学界还存在一种不成文的隐性风气，那就是掌握技术核心逻辑的人，会刻意回避向大众讲清底层原理，**这种靠信息差守住话语权的做法，对任何人都没有好处。**\n\n只有撕开技术的神秘外衣，**让大众看懂背后的真相，大家才能真正放下顾虑、获得更充足的安全感。**\n\n![Image](https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGEJPRywtBKRKutffBhUFWiaWIviaM3efRpDsDykc0uNibj7hX5k9uwloriaOslt7t7qQaYwfRJdPKQZmECNcsEFVsoltKkUL92eSMc/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n**李飞飞：**垄断信息的确能攥住话语权，一句“听我的就好，我直接给你结论”也能建立权威，但教育者绝不会选择这种方式。\n\n课堂上，我们不会只简单告知学生二加二等于四，而是拆解演算逻辑，教会他们自主推导、独立思考。\n\n除此之外，我们还**需要听见来自更多视角的声音。**\n\n**有无数学者、技术研发者、创作者，一直在钻研如何合理地运用AI造福大众，这些珍贵的声音，值得被更多人看见。**\n\n![Image](https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGFQyoPBia4fAoMhRLtqbvic1M06Ih7RQTibKacmkecrLfygjlyicAqHcib3cz1UmVjLCQWAUTFEb4okicWpHqvSTwnBwuH7GTFxZyNL8/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1)\n\n*完整访谈：https://x.com/hubermanlab/status/2086814834213925013?s=20*\n\n\n— **完** —\n","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"2e37249a76c2afbf76d38d3d5a75186a9077b034ddb5cb6009c3ba3427fb9829","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderPro \u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"10,11","tag":"h3"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e技术应服务于人的真实需求\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:9e97b5ab1531747ea6e0ef222e9771608930c3004d2d7a694b677483670579ed\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"8,9","tag":"h2"}},{"children":[{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e两种风险都需要我们警惕\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:f3d3b162a093ffcffdf49199688500334239db2a99c71285b800ea9aabed3a2b\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"12,13","tag":"h3"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e给孩子们的新必修课：学会向AI提问\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:e686ccaca6bdaed938223b9ea5445 \"note:sha256:482f623dfef513cf2e8465312cffb44434fdf78e97fb364867d3fba38a224bfa\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"15,16","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e李飞飞最新访谈：AI咋能代替人呢？\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"李飞飞最新访谈：AI咋能代替人呢？\" data-note-id=\"note:sha256:ed61a11c372b5ac73d1d5db7ddc161b4ec95207b4326ae4e719a5f13f962a00d\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"李飞飞最新访谈ai咋能代替人呢\"\u003e李飞飞最新访谈：AI咋能代替人呢？\u003c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003ca href=\"https://mp.weixin.qq.com/s/mjYarBmoETYTcj3husF4Hg\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e量子位\u003c/a\u003e · 关注前沿科技 · 2026-08-16 18:30\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e文婷 发自 凹非寺\u003cbr\u003e量子位 | 公众号 QbitAI\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI咋能代替人呢？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGFv7xcZjz2kbjicibYe6Ovd5J7d93FlfDTNoYibhTcGOq8klzN0IjsvjLf9TCD1ibxqqLjwXjdicuVSiczgCibhRQNXibAIytPy6jtgP0M/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\u0026amp;tp=webp\u0026amp;wxfrom=5\u0026amp;wx_lazy=1\"\u003e\u003c/p\u003e\n\u003cp\u003e不错，这话是李飞飞说的。\u003c/p\u003e\n\u003cp\u003e在Huberman Lab最新一期访谈中，李飞飞还讨论了“为什么苏格拉底是人类历史上最顶尖的‘提示词工程师’”、“为什么不能一刀切地禁止学生们用AI”等非常有趣的话题，并给出了一个笃定的答案：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e无论是在医疗、影视、还是教育等领域，AI都不是人类的替代者，而是个人能力的放大镜。\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e全程高能，重点笔记如下：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e我觉得人类一直没吸取的一大教训，就是老一辈总爱哀叹下一代，仿佛年轻人什么都不懂，说他们没规矩、遗忘历史。但\u003cstrong\u003e纵观人类历史大脉络，我们整体其实是在向着更好的方向发展。\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e不能只让少数科技企业替整个社会做决定\u003c/strong\u003e，单纯追逐市场收益的逻辑，绝不能凌驾于社会伦理与大众文化之上。\u003c/li\u003e\n\u003cli\u003e学术界和医学界有个不成文的潜规则，即掌握技术核心逻辑的人，会刻意回避向大众讲清底层原理，靠信息差守住话语权，可这种做法对任何人都没有好处。\u003cstrong\u003e只有让人们了解真相，大家才会更有安全感。\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e想要守护下一代，\u003cstrong\u003e一定要看见教师群体，帮扶老师与家长\u003c/strong\u003e，才能真正引导青少年正确使用 AI。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e技术变革时代，机遇和阵痛同时存在，我们需要理性、审慎地面对。\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGmdHsCFWEUgBH9PrmoX6nHph73r2RictEdy8Pqrxkgd7vfr7sGIQ7LdLVp0VBqhz1tgtuNp7iaub600jVriaK1aW32foMPBDfLAk/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e本文在不改变原意的基础上，由AI对访谈内容文字实录进行了精校。\u003c/p\u003e\n\u003cp\u003e看得开心！\u003c/p\u003e\n\u003ch2 id=\"ai还缺什么\"\u003eAI还缺什么？\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e主持人（Andrew Huberman）：\u003c/strong\u003e飞飞，我们今天先从\u003cstrong\u003e视觉\u003c/strong\u003e开始聊聊AI吧。很多人觉得光线感知和AI离得很远，但它其实是AI发展的一大起点？\u003c/p\u003e\n\u003ch3 id=\"视觉是智能的基石\"\u003e视觉是智能的基石\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e没错，\u003cstrong\u003e视觉是智能的基石。\u003c/strong\u003e我们可以沿着生物演化和计算机视觉两条脉络来理解它。\u003c/p\u003e\n\u003cp\u003e从生物演化来看，5.4亿年前，远古海洋生物第一次“看见”光，感光细胞的出现直接催生了寒武纪物种大爆发。对人类而言同样如此，我们大脑皮层一半的神经活动都与视觉相关，婴幼儿也是先学会“看”，再学会“说”。\u003c/p\u003e\n\u003cp\u003e对AI而言，视觉对它的贡献主要体现在\u003cstrong\u003e提供算法灵感\u003c/strong\u003e和\u003cstrong\u003e促进数据觉醒\u003c/strong\u003e两方面。\u003c/p\u003e\n\u003cp\u003e第一是\u003cstrong\u003e算法灵感\u003c/strong\u003e。上世纪50年代，科学家们发现哺乳动物的视觉系统具有层级神经结构，这直接启发了早期神经网络的设计。\u003c/p\u003e\n\u003cp\u003e如今，模型参数的规模虽已暴涨，但其根源仍可追溯至生物视觉研究。\u003c/p\u003e\n\u003cp\u003e第二是\u003cstrong\u003e数据觉醒\u003c/strong\u003e。本世纪初，算法效果始终不太理想，2006年我在普林斯顿做研究时才意识到，\u003cstrong\u003e卡脖子的可能并不是算法，而是训练数据太少了。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e你想想看，一个孩子到6岁便能认出桌子、椅子、花等几万样东西，靠的就是成长过程中看过的海量画面。\u003c/p\u003e\n\u003cp\u003e受这个启发，我们才不再死磕算法，转而发起ImageNet项目，攒出了千万级的图片数据集。\u003c/p\u003e\n\u003cp\u003e等到2012年，\u003cstrong\u003e大数据集、深度神经网络和GPU算力三者碰头，现代AI才算真正迎来了转折点。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGNrG1HgWcrQfVbp4TiaeZAxHkOWWw97WAZPdiaqiaPicGs9Zg1ibSdypBaCQgiclfo9gW424RqJfYkhymN4rIbJic5FrVTiczL3lmfTib4/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e2012年前后，AI的图像识别能力突然上了一个大台阶。以前连相似的人脸都分不清，2012年之后一下子就能精准认出谁是谁，这背后到底发生了什么？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e就是刚才所说的**“GPU并行算力提升、神经网络技术成熟、互联网带来海量数据”三要素集齐了。**\u003c/p\u003e\n\u003cp\u003e拿ImageNet图像识别竞赛举个例子，\u003cstrong\u003e人去分辨一千种物品，识别错误率大概只有4%\u003c/strong\u003e，且我们认错大多不是看得太仓促，纯粹是东西长得太像，或是记混了品类。\u003c/p\u003e\n\u003cp\u003e而早年神经网络的错误率虽然下降了一大截，但始终比不上人类；一直到2016年，算法识别准确度才第一次超过人。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e语音、听觉方向的发展路径，和图像识别几乎一模一样。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e2016到2017年，Transformer架构出现之后，性能很快就甩开了图像领域最早的经典模型AlexNet；\u003c/p\u003e\n\u003cp\u003e随后，靠着更完善的网络结构、海量文本素材，再加上GPU算力支撑，经过整整五年的迭代优化，ChatGPT才在2022年正式问世。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我觉得人身上有个特别厉害的天赋，叫\u003cstrong\u003e物体恒存。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e好比我们只看见一截猫尾巴，结合房间里的环境，便能立刻判断这是一只家里养的猫，而不是狐狸。\u003c/p\u003e\n\u003cp\u003e你觉得AI什么时候才能拥有这种结合场景自主推理的能力呢？\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGKAPw5r0rROCQuxFka6fucr8r3h0d7sic02U8HTNiajv70xTdYxzvtiaicuBmHwO7ojfHKicj4WBekIRqM0QOrp2nlaBia8K8xpPS4U/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e现在的大模型依靠海量数据，确实能做出差不多的判断，但\u003cstrong\u003e底层逻辑和人脑完全是两码事。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e小孩子只见过几只猫，就能举一反三认出所有猫；可AI得刷完网上几乎所有猫咪图片，依靠数据里的统计规律去分辨。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e两者的学习逻辑天差地别\u003c/strong\u003e，背后还有一大堆待破解的科学难题。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e后来AI还能让静态图动起来，比如让图片里的猫追着老鼠跑，这又是怎么实现的？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e关键就是\u003cstrong\u003e往训练数据里加入大量新的视频素材\u003c/strong\u003e，一个标志性的节点就是\u003cstrong\u003e2024年Sora发布。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e不过，\u003cstrong\u003e当时的算法仍建立在神经网络框架之上，尚未出现颠覆性的技术革新。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e所以模型还是看不懂猫的肌肉构造及身体结构\u003c/strong\u003e，只能靠着海量的视频摸透了物体运动的统计规律，并生成看着符合常识的动作；\u003c/p\u003e\n\u003cp\u003e这也就解释了为什么AI生成的画面会经常出现别扭或不合理的bug了。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGHcHBve6TOXWz0XFzbzOeZic0WU2kiaSRGRQeasnW931NNctBemVORQRfc7VvgVHIrhPrtow0sbHFt3lXSnVrN7EhH0ETmxz7e3U/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003ch3 id=\"私人又主观的情感体验\"\u003e私人又主观的情感体验\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e那往更深一层说，像自主创造力、独属于个人的内心感受呢？\u003c/p\u003e\n\u003cp\u003eAI所有训练素材都来源于网络，但人有太多私密的内心体验根本不会发到网上。就像欣赏抽象画作时独有的情绪、想起小时候老家那种专属自己的感触，\u003cstrong\u003eAI是不是永远都欠缺这部分感知？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e你问到了最核心的一点。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e互联网汇集了人类图文、影像等各式各样的行为数据，这也是AI之所以强大的根本。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e但那些高度私人化的思绪、情绪与心底的感触，没有任何形式的记录，网上自然找不到相关数据，\u003cstrong\u003eAI根本没办法学习和体会。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e举个例子，AlphaGo下出的第37手，看着好像具备了创造力，可围棋有一套完整严谨的数学规则；\u003c/p\u003e\n\u003cp\u003e反观不少\u003cstrong\u003e顶尖数学难题\u003c/strong\u003e，需要人类跳出固有框架想出全新解法，\u003cstrong\u003e这类问题我更看好人和AI配合协作攻克。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e至于看到一只杯子，瞬间勾起只属于自己的童年往事，这种\u003cstrong\u003e私人又主观的情感体验，是现阶段AI完全触碰不到的局限。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGHGgX30stJj221DPyjbr8cMe1YP3Jv2Ip5yZjs5q7fCMu3t4uMKplic0b55icnaTqCXJT4mkvZfc419YPjA4SgUYqh2olmsnYOl0/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e那将来如果用上无创脑机设备，直接读取大脑里的信号，能不能补上这块短板？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e单从理论技术层面来讲有实现的可能，但有一个硬性前提是“人内心的心理活动信号，得能被传感器捕捉识别。”\u003c/p\u003e\n\u003cp\u003e要是连我们自己都没办法用语言或者动作把内心细腻的感受表达出来，机器自然也就获取不到对应的信息。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e那直觉、内心诉求、紧迫感这类发自本能的内在状态呢？AI有可能产生真正属于自己的内在驱动力吗？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e现在我们能通过设定目标函数，让AI模仿出近似的效果，像是深度思考模式、快速应答模式等等。\u003c/p\u003e\n\u003cp\u003e可这些说到底也\u003cstrong\u003e只是调整数学参数而已\u003c/strong\u003e，\u003cstrong\u003eAI不会生出真实的恐惧、喜爱，更不存在发自本心的共情。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e它说出那些安抚人的话语，只是套用学到的语言表达模式（learned language patterns），和人类发自心底的共情完全是两回事，\u003cstrong\u003e这一点很有必要跟大众好好科普清楚。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGHr5iawoYNjeEGNdX5EMf3rdk5Biaia37RLTicviaJ6nzbqH0sftVuODqEibkDXssPgr7xo4eT1ZTtTia4rgFjibrLRKJbhstL5vf7lFlo/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003ch3 id=\"技术创新和潜在风险\"\u003e技术创新和潜在风险\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e那如今，AI技术迭代得这么快，监管部门、普通大众还有行业从业者，要怎么把握分寸，平衡技术创新和潜在风险？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e这也是我在斯坦福大学创办\u003cstrong\u003eHAI（以人为本人工智能研究院）\u003c/strong\u003e的初衷。\u003c/p\u003e\n\u003cp\u003eAI行业的发展可以参考汽车、生物科技过往的发展治理经验，让所有相关方都参与进来共同把控。\u003c/p\u003e\n\u003cp\u003e一方面我们要\u003cstrong\u003e制定完善的行业伦理准则\u003c/strong\u003e、\u003cstrong\u003e在高校开设AI伦理相关课程\u003c/strong\u003e，\u003cstrong\u003e配套落地对应的监管条例\u003c/strong\u003e；\u003c/p\u003e\n\u003cp\u003e像医疗AI这类高风险应用，还需要类似FDA的\u003cstrong\u003e权威机构设立安全红线。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不能只让少数科技企业替整个社会做决定，单纯追逐市场收益的逻辑，绝不能凌驾于社会伦理与大众文化之上。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGUVpLJAJA3o7HU3iaXuiadicGOpVB4TEV84AG0CXGI2NoKg4xJoorY79JvjoNvkXSicAoedOh0XWJzdSzpeO1icntRTuyJ7KtHTia6Q/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003ch2 id=\"ai不是替代者而是个人能力的放大镜\"\u003eAI不是替代者，而是个人能力的放大镜\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e这个回答非常切中当下。那我们接着聊一个大家都很期待、而且现在已经初见成效的方向——\u003cstrong\u003eAI在疾病发现和治疗上的应用。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我们都知道，生物医学本身还在不断迭代更新。这不是说现在的皮肤科、神经外科、肿瘤科医生的专业知识不靠谱，他们一直都是在成熟的知识体系里开展工作，只是\u003cstrong\u003e这套体系本身一直在更新。\u003c/strong\u003e几乎每个月，都会有新的研究成果推翻过去的固有认知。\u003c/p\u003e\n\u003cp\u003e就拿教科书里的知识点来说，我们一直学的是神经元的动作电位遵循“全或无”原则，要么完全触发，要么完全不触发。\u003c/p\u003e\n\u003cp\u003e但多年前，《Nature》上就有论文证实，同一个神经元产生的动作电位，波形其实可以千差万别。\u003cstrong\u003e业内几乎所有人都看过这项研究，却很少有人真正愿意接纳这种颠覆传统的结论。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e但\u003cstrong\u003eAI不一样\u003c/strong\u003e，\u003cstrong\u003e它可以毫无负担地全盘接受新设定\u003c/strong\u003e，处理海量数据、吸收新知的效率，\u003cstrong\u003e甚至超过斯坦福、MIT、加州理工等全球顶尖高校的研究生。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e所以我想听听你的看法，\u003cstrong\u003e未来医生、患者要怎么和AI协同配合、一起攻克疾病呢？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我们能不能借此建立一套\u003cstrong\u003e全新的科研发现和诊疗模式\u003c/strong\u003e，从根本上提升医疗效果、改善人类的健康状态？\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGEmOiaw5OC3xSAQ0YkTWTLgfOYFd0n9vAUXAACqcplkQwicL371sE3FRkbE8jPqiaCForSoSeuj0x7DuRSxULR6ps2SibLm2bdhVKM/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003ch3 id=\"辅助前沿科学研究\"\u003e辅助前沿科学研究\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e你说到了AI最有价值、也最让人期待的落地场景：\u003cstrong\u003e辅助前沿科学研究。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e放到生物医学领域，更是直接关乎所有人的疾病与健康。\u003c/p\u003e\n\u003cp\u003e长久以来，科研突破几乎完全依靠人类研究者，靠着一代代积累的理论知识，耗费大量时间精力反复做实验。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e虽然现在有各类大型科研仪器，但研究的核心始终是人，而AI相当于一款全新工具\u003c/strong\u003e，它能储存海量资料、打通不同学科的知识壁垒，做到人类很难实现的跨领域融合。\u003c/p\u003e\n\u003cp\u003e拿我自己举例，我深耕视觉神经科学和人工智能，但对嗅觉相关领域一窍不通，很多专业术语我都不熟悉，\u003cstrong\u003e人脑很难同时吃透这么多细分方向，AI却没有这种局限。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这就像数百年前电力问世，彻底重塑人类社会，既是巨大机遇，也难免让人产生顾虑。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e用AI助力医学研究、临床诊疗，就是当下最值得深耕的机遇。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e怎么整合各类医学信息、怎么把分析结果清晰给到医生和患者，怎么让患者全程参与诊疗过程，这里面还有非常大的探索空间。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGD3AiadKoT7chd5TCOO2uhhxgfDrSlDQoEKYCr0aeturzX3UgwPbibsgdM0j2ic4o6gnx4hqy4UH12Oia3iaafVDuQVOY4pCibolkow/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我先叠个甲，我不是说AI能胜过所有医生，但我前段时间亲身经历了眩晕的问题，是AI帮我分清了根源到底是眩晕症，还是血压过低。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e当时就连一位专攻前庭问题的耳鼻喉专科医生，一开始都判断失误了。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e你当时输入了哪些信息？只输入了自己身体的主观感受，没有其他检查数据吗？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e就只描述了一两天里身体的异样感受。\u003c/p\u003e\n\u003cp\u003e后来我发现是医生开的药产生副作用，那种感受特别难受，整个人天旋地转，总觉得身体在往下坠。\u003c/p\u003e\n\u003cp\u003e我自己能分清单纯头晕和病理性眩晕，梳理完线索才确定，是药物让我的血压降得太低。我当时咨询了好几位业内不错的医生，当然都不是斯坦福这边的。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e那我们单纯从学术、客观的角度聊聊这件事。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e这件事非常有意思。我后来和那位复诊的医生聊，他坦言如果我当时直接到诊室，他能安排全套检查排查病因。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e但我靠AI没花一分钱，一上午就锁定了问题根源\u003c/strong\u003e，补充电解质之后，短短两小时身体不适感就完全消退了。\u003c/p\u003e\n\u003cp\u003e当然不能完全排除心理安慰剂的作用，但我的症状确实好转。我也不是建议大家生病不去看医生，只是\u003cstrong\u003eAI展现出的辅助能力，实在让人惊叹。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGggUY85eyoyGD2ibibLQx53MnicoZ8vB1UiatmmkGVDoL5iaTm8quic15p9zj2VQMIxNn5ia5nGKibxEAETtibGBCYHPqmIgEDkZbkswGw/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e我觉得医生完全可以把这类工具当成\u003cstrong\u003e诊疗帮手。\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"人机协作可以大放异彩\"\u003e人机协作可以大放异彩\u003c/h3\u003e\n\u003cp\u003e我说一件我自己亲身经历的事吧，就是咱们这次访谈原本要延期，因为前段时间我父亲在斯坦福做肝脏手术。\u003c/p\u003e\n\u003cp\u003e这场手术依靠\u003cstrong\u003e达芬奇手术机器人\u003c/strong\u003e完成，并由外科主刀医生全程操控，这就是很典型的人机深度协作。\u003c/p\u003e\n\u003cp\u003e术后我和主刀医生聊，问他如果整合全球所有同类型肝脏手术数据，有没有可能训练出一台能全自动完成肝脏手术的AI？\u003c/p\u003e\n\u003cp\u003e他给出的答案并不乐观，人体肝脏结构错综复杂，血管分布密集，每个人的器官形态差异极大，就算汇总全世界所有病例，数据量也很难支撑算法达到稳定可靠的水平。\u003c/p\u003e\n\u003cp\u003e这也印证了一个关键点，\u003cstrong\u003eAI的判断全部依托数据里总结出的规律，一旦对应场景的样本稀少，我们就要理性看待AI的能力\u003c/strong\u003e，分清哪些场景适合使用，哪些场景还无法依靠它。\u003c/p\u003e\n\u003cp\u003e像这种复杂外科手术，医生操控机器人操作，效果远比机器人自主执刀要好得多。但外科医生的经验，又会受自己实操手术数量的限制，\u003cstrong\u003e这正是人机协作可以大放异彩的地方。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e未来还有很多可能性。我们能不能搭建肝脏器官的虚拟仿真模型，让AI无限次模拟手术训练？这也是现在还在探索的科研方向。\u003c/p\u003e\n\u003cp\u003e但像你之前遇到的低血压、眩晕鉴别诊断，\u003cstrong\u003e这类病症积累了海量病例，数据库样本充足，AI就能充分发挥作用，给那些没法及时线下就医的人提供初步参考。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGEnmEZkBtrLYyOic0zOAsiaGyaEcIEMdPEW1TtVoAjenyVnUEUTMoFutCmLYpYqIOCqLdlQ42Y5sF0wQnmaLoKeXG3yAl9HTicRibA/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e很高兴听到你父亲手术一切顺利。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e谢谢，手术很成功。得益于腹腔镜机器人技术，\u003cstrong\u003e术中出血量比传统手术少了十倍。\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"技术应服务于人的真实需求\"\u003e技术应服务于人的真实需求\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e有时候我觉得机器反而能展现出人时常缺失的善意，比如Waymo的车每次看到我，还有我六个月大的小狗，都会主动避让，可现实里不少人类司机反倒做不到hhh。\u003c/p\u003e\n\u003cp\u003e把时间拉长到两三年，放在我们这一生里来看，大批机器人走进日常生活、走进社会，会是什么模样？\u003c/p\u003e\n\u003ch3 id=\"机器人分担繁琐费力的杂事\"\u003e机器人分担繁琐费力的杂事\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e首先我想说，\u003cstrong\u003eWaymo这套模型，还是必须得把现实里所有的交通规则全都学透才行。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e其次我觉得，\u003cstrong\u003e硬件类产品落地见效会慢很多。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我是独生女，家里两位长辈年纪大、身体都不好，还不会英语，平日里照料的担子很重。我特别希望能有机器人分担体力活，当然\u003cstrong\u003e它绝对替代不了亲情陪伴和家人间的谈心，只是帮我们扛下繁琐费力的杂事。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e加州常年有山火，人类消防员冲进火场风险极高，这种\u003cstrong\u003e高危作业完全可以交给机器人。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e再比如\u003cstrong\u003e独居老人\u003c/strong\u003e，买菜、取药、出门散步都不方便，现在只有快递配送能解决一小部分需求；\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e医疗护理行业更是常年缺人，护士永远超负荷连轴转。\u003c/strong\u003e我父亲住院那段时间我亲眼看到，护士一个班次要来回跑无数趟取药、搬运物资。\u003c/p\u003e\n\u003cp\u003e只要让机器人接手这类工作，\u003cstrong\u003e能造福社会的场景实在太多了。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFClclMH5KDPrjczlA3ibmOGlJHRcBWk63M56shMsCungR3ibeB9IIbicgnibErG00Zagw7aVricOzHThe1HicvlB6gH7OeZJRiaFAR10/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e听你说完，我脑海里已经浮现出不少机器人帮忙送货上门、疏导交通的画面了哈哈，\u003cstrong\u003e我觉得大众对机器人、AI的恐惧，很大一部分来源于它是实体的。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我觉得人和实体机器共处，跟人与人之间相处完全是两回事。我倒不奢求能和机器人产生什么情感羁绊，只希望它能帮我叠衣服、扫地、打理花草、喂鱼……当然喂鱼我还是更喜欢自己来，亲手照料的过程很治愈。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e你的小狗会帮你喂鱼吗？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e哈哈那倒不会，它是只不太聪明但性格很好的斗牛犬，它只会趴在鱼缸边上盯着，完全不懂怎么照料鱼儿。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e你知道\u003cstrong\u003e大白（Baymax）\u003c/strong\u003e吗？迪士尼**《超能陆战队》电影**里的医疗机器人，外形像巨大的充气软气球，没有坚硬外壳，这种形态大家接受度会高很多。\u003c/p\u003e\n\u003cp\u003e**\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_jpg/A6fTew8FFGHfPGuaFcByyQrPhYIxCh9CZsOudqPV7nXibJUJIXTY0MWLNicc6myU4a0sV6Dh3kwHZL1vkH3x2TAw6ouQgyq0eAXicVjS1g07KY/640?wx_fmt=jpeg\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e△**来源迪士尼动画电影《超能陆战队》\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e确实呢，也更容易适应。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e我们再说回自主技术这件事吧。\u003c/p\u003e\n\u003cp\u003e我觉得\u003cstrong\u003e未来的生活图景，不该由某一家企业、一群投资人单方面定义，全社会都该主动参与、一起构想。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e现在关于AI的舆论有个很大的问题，\u003cstrong\u003e普通人永远只能被动接受技术带来的结果，却没办法参与到前期设计规划里。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e就像之前你父亲做手术，医生操控机器人配合操作，人机协同才能发挥最好的效果。我也想到不少场景。\u003c/p\u003e\n\u003cp\u003e小孩子独自上下学是很好的锻炼，但家长总放心不下安全，如果有陪护机器人一路随行，遇到危险可以立刻报警，甚至简单防护，就能给孩子更多独立活动的空间；\u003c/p\u003e\n\u003cp\u003e线上网络环境复杂，家长很难全方位看管，或许可以做一个线上守护虚拟形象，自动识别不良风险、隔绝有害信息。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e这个思路完全能做成一个很不错的创业项目。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e但眼下现实条件还差得很远。\u003c/p\u003e\n\u003cp\u003e我读博的时候常在帕洛阿尔托街头碰到\u003cstrong\u003e乔布斯\u003c/strong\u003e，他经常光脚出门，打扮得像个嬉皮士，对待员工脾气也直，放在现在公司HR肯定很难接纳。\u003c/p\u003e\n\u003cp\u003e但他很懂，计算机不能只是冰冷机器，要做出圆润便携的外观、能轻松揣进口袋，开机界面放上鲍勃・迪伦（传奇民谣音乐人），一点点消弭人和科技之间的隔阂。\u003c/p\u003e\n\u003cp\u003e有人会说这是\u003cstrong\u003e变相的“特洛伊木马”\u003c/strong\u003e，但我不这么看。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e想要实现人和机器人良性共存、互相协作，就需要这种懂技术、更懂人性的人。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e很多顶尖技术天才专业能力无可挑剔，可大众始终难以接纳他们的理念，根源就是不懂如何与人沟通、传递技术价值，\u003cstrong\u003e他们需要擅长人文表达的合作者配合。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e另外\u003cstrong\u003e不少媒体总刻意制造对立\u003c/strong\u003e，大肆渲染“科技从业者抢走普通人的一切”，大多只是为了博取流量牟利。\u003c/p\u003e\n\u003cp\u003e我们去哪里才能找到这种兼顾技术能力与人文共情的人才？\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGEZ7DX1NC13Sevm3Ycb129wSappKSASr9MeVkcBTdgz6icjypqicZb3M0AaIo0W4cchBcDAQTs7CWrVK7FNw0VHCOehpUYvDphLk/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e其实有不少这样的人，你就是其中之一。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGiapmPQpibf8Ks2shnQsJzQibnf47pAjZRc0suUTNPLLcnmj2hjaJhDvg7QjK1e9oD0fRIxq69NW5meqZiaicHoUcIYA3iaNKeTSbTs/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e可惜他们太正常，导致获得的流量和关注度太低了。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e \u003cstrong\u003e不少创业者都在做极具社会价值的事\u003c/strong\u003e，比如用AI研发新药、辅助诊疗、研究衰老、打造心理健康工具；还有大批设计师、产品经理在为此努力。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e但舆论的话语权，总是给到了那些一味鼓吹技术万能的人。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这期播客就是想\u003cstrong\u003e多传递人文视角\u003c/strong\u003e，把普通人的真实需求、人类长远的未来纳入AI讨论。\u003c/p\u003e\n\u003cp\u003e我并不悲观，我本身是教育从业者、技术建设者。我见过很多优秀年轻人，明明能去大厂拿高薪，却选择加入World Labs，想用技术实实在在帮到普通人，只是这类声音太少，很难被大众听见。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e如今公共舆论两极分化严重\u003c/strong\u003e，一部分人忙着散播末日恐慌，另一部分人忙着鼓吹技术无所不能，两种声音都太过极端，很容易让普通人觉得**“你们掌握技术的人当然站着说话不腰疼”**。\u003c/p\u003e\n\u003cp\u003e我们需要回归客观中立的视角，理性看待技术本身，重点讨论该如何合理运用，\u003cstrong\u003e让全社会一起掌握塑造未来的主动权。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我一位同行说过一句很简单、却总被大家忽略的话：“大众不爱听冷冰冰的技术故事，更容易共情充满人情味的真人经历。”\u003c/p\u003e\n\u003cp\u003e比如AI协助兽医治好宠物癌症；孩子病症罕见、多位医生找不到病因，AI帮忙锁定病灶……这类故事才动人、容易引发共鸣.\u003c/p\u003e\n\u003cp\u003e可流量和曝光，远远比不上博眼球的极端内容。传统媒体只追逐一两天的短期热点，很少深耕长期行业趋势。\u003c/p\u003e\n\u003cp\u003e还有无数人一直在推动AI向善、探索人机协作，我们应该多看见、多传播他们的声音。\u003c/p\u003e\n\u003cp\u003e这个话题先告一段落，我们来谈谈\u003cstrong\u003eAI与影视创作的关系吧。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFE9YCfrxZ4MyFDPDjWicg6aJIVgqYIGFzfFgPzZlp6icvuZqsHln4oEavZrkwX0VGSjtUSjULiaq6ZID0Mneia9WWvTZxgd1n4J0E/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003ch3 id=\"ai与影视创作的关系\"\u003eAI与影视创作的关系\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003eOk，这个话题其实很复杂，也牵扯着很多创作者的顾虑，因为\u003cstrong\u003e大家害怕AI夺走编剧和其他创作工作。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我们可以把\u003cstrong\u003e技术现状\u003c/strong\u003e和\u003cstrong\u003e就业冲击\u003c/strong\u003e分开讨论，虽然两者密不可分，但单从技术层面来说，把剧本自动转换成镜头片段的能力已经十分成熟，市面上已经出现AI生成短片，甚至接近长片规模的作品，海内外不少企业都在研发配套工具。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e但一部作品的核心内核永远属于人类\u003c/strong\u003e，那些独一无二的细腻情绪、叙事角度、镜头表达、人物塑造，都是编剧和作家不可替代的核心价值。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e如何用好AI工具，更好地承载人类的故事表达，放大表达者的能力，是我们当下要解决的关键难题。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e好莱坞业内普遍充满焦虑，\u003cstrong\u003e技术带来的冲击真实存在\u003c/strong\u003e，但我们更要思考如何积极应对、良性转型。\u003c/p\u003e\n\u003cp\u003e电影产业不是我的主营领域，但我期待行业能开展更多细致、深入的探讨。\u003c/p\u003e\n\u003cp\u003eAI正在彻底改写影视叙事的创作模式，我的联合创始人Ben之前和\u003cstrong\u003e本・阿弗莱克（好莱坞知名编剧，代表作有《心灵捕手》等）\u003c/strong\u003e深入交流过，他也在用全新视角看待 AI 工具给电影制作带来的改变。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e技术从业者和影视创作者多多对话交流，在当下尤为关键。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFGzOoU2xKicNzBonpjxMq5vpUFWGRfq3FxRIWNdqriclGbPTbda3uItJjwW19a6f1IU1svbN5egiaNSGNSOpJuFpGjPgJZwfvWw8/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e技术变革好像总会迎来这样的转折点，只有行业内部从业者主动接纳、参与改造，新技术才能真正普及落地。\u003c/p\u003e\n\u003cp\u003e这让我想起来小时候，大家都去店里冲洗胶卷、租赁长焦镜头。\u003c/p\u003e\n\u003cp\u003e后来数码时代到来，冲印、胶片相关岗位大幅消失，\u003cstrong\u003e但摄影这个行业并没有彻底消亡。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e \u003cstrong\u003e行业只会转型迭代\u003c/strong\u003e，从业者可以通过学习新技能完成自我升级。\u003c/p\u003e\n\u003cp\u003e现在已经有很多创作者主动钻研AI工具，主动跟上技术趋势、强化自身不可替代的能力。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e技术变革时代，机遇和阵痛同时存在，我们需要理性、审慎地面对。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGXbU5o15ib9w2iboMfrD7fPGDjWaH8MvUbUcm2icuwFeeIK1w3DCptHWrCswwgZgnJShQCdHmtK4T3HWhZoI2cibT0Ixj5vRrcgWY/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003ch2 id=\"该怎么教孩子用好ai\"\u003e该怎么教孩子用好AI？\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e现在不少家长都有同一个顾虑，AI这么方便，要是以后孩子一碰到难题就直接找AI解答，他们就不愿意主动动脑学习了。\u003c/p\u003e\n\u003cp\u003e其实当年计算器、电脑、打字机刚问世的时候，社会上也掀起过完全一样的担忧。\u003c/p\u003e\n\u003cp\u003e乔纳森・海特（美国社会心理学家、纽约大学教授）提出：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e人们在享受便捷的同时，也在失去一些东西，青少年更是容易深陷技术带来的负面影响。\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e你能结合当下AI发展的现状，分乐观、中立、悲观三个角度谈谈未来会是一个什么样的走向吗？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI究竟会拓展青少年的思维、对他们几乎没有影响，还是会造成伤害？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGEyhdtlic84ib930SFGubAFtaKsSTApPwbKcpQhZKJGALicOks00NZDxJ3CuxfAXia0aAUPKpYWVNmDKMDt5QUfTKtMnA5mm6nIQns/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e这个问题问得特别好。我们之前聊过人的内在驱动力、自主意识，答案其实就能顺着这些话题延伸出来。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e最糟糕的情况，就是AI会夺走年轻一代的自主学习和生活能力。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e不管是无休止地刷短视频、还是被动接收推送信息流，都会一点点消磨人的主观能动性。\u003c/p\u003e\n\u003cp\u003e人脑的生理运转逻辑不会因为晶体管技术发生改变，神经元、体内化学物质、各类激素的运作自有固定规律。\u003c/p\u003e\n\u003cp\u003e人的成长，尤其是青少年阶段的成长，学习本就需要投入时间、付出努力，过程里难免会遭遇挫折。\u003c/p\u003e\n\u003cp\u003e不管未来社会、职场如何变迁，人的大脑和身体都需要完整发育。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e学习的内生动力、自主思考的能力，不能被任何人、任何机器剥夺\u003c/strong\u003e，这也是我最担心的一点。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e如果滥用AI，消磨掉孩子的主观能动性，下一代的大脑就没法得到充分发育。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e但还有另一种极端误区也很危险。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGFeDWIicvYUxXpPAm0ibWHNGOugATF45wfNV4QY542Xr5a1r1zianRCzmW2zvrwiaibibTGOiar0lbsEYZBqCxZQYlHA6FGyTMguibQNJs/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e因为担心学生作弊、直接用ChatGPT生成作业答案，就\u003cstrong\u003e一刀切完全禁止学生接触AI工具，这同样是不可取的。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e只要学生保有主动求知的内在动力，掌握正确的使用方式，\u003cstrong\u003eAI能把学习的深度提升到从前难以想象的地步。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFPzVcjC0vKIShMOvV3MgmQxjC8wkSNFM3Ng1I3xfxcPpKbibJtVFzQau3D8kWJicPia4Yca0iaPebcX44VbxudCVULQGu3icl3um5A/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e我本科时原本打算走医学预科路线，有机化学的难度很高，我当时想吃透分子的空间结构，但助教答疑时间很短，还总跟我的课程冲突，教授能答疑的时间也十分有限，学习处处受阻。\u003c/p\u003e\n\u003cp\u003e如果当年能有AI学习助手，我就能针对自己卡壳的知识点反复提问；\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e只要自身有学习的意愿，AI就是极强的辅助工具，我们不该剥夺学生拥有这种助力的机会。\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"两种风险都需要我们警惕\"\u003e两种风险都需要我们警惕\u003c/h3\u003e\n\u003cp\u003e这\u003cstrong\u003e两种风险\u003c/strong\u003e都需要我们警惕。\u003c/p\u003e\n\u003cp\u003e一是\u003cstrong\u003e过度依赖AI\u003c/strong\u003e，磨灭独立思考的能动性；\u003c/p\u003e\n\u003cp\u003e二是\u003cstrong\u003e全盘封禁AI工具。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e反过来，\u003cstrong\u003e最理想的局面就是守护好孩子们的求知欲与自主思考能力\u003c/strong\u003e，同时\u003cstrong\u003e引导他们合理运用AI\u003c/strong\u003e，这一代以及往后的年轻人会比我们更有智慧，\u003cstrong\u003eAI会成为放大他们个人能力的工具。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我非常认同这个看法，我对大脑的神经可塑性、对年轻一代都抱有十足的信心。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e \u003cstrong\u003e就算是成年人，大脑也依旧具备可塑性，别觉得年纪大了就没法进步，我们同样能借助工具提升学习效率。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e这段对话\u003cstrong\u003e刷新了我对AI能力的很多认知。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e面对完全陌生的领域，我会以普通使用者的身份向AI提问；\u003c/p\u003e\n\u003cp\u003e等自己积累了一定知识储备后，再以创作者的身份和AI协作共创。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e \u003cstrong\u003e去年学校一名本科生点醒了我。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eChatGPT推出之后，我遇到不懂的问题时，原本会直接去请教身边专业能力强的同事，但现在我意识到，\u003cstrong\u003e不该拿着毫无准备的基础问题浪费别人的时间，可以先靠AI梳理基础信息\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e这么看来，\u003cstrong\u003eAI反倒是在推着我们改掉偷懒和不愿提前思考的习惯。\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"给孩子们的新必修课学会向ai提问\"\u003e给孩子们的新必修课：学会向AI提问\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e最后一个问题，你觉得\u003cstrong\u003e7-20岁的青少年\u003c/strong\u003e应当以什么样的心态看待AI？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e巧了，正好是我家孩子所处的年龄段。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我之所以专门问这个问题，是有现实考量的。\u003c/p\u003e\n\u003cp\u003e现在的年轻人对AI大多满怀新鲜感、十分兴奋。回望过去，计算机刚问世那会儿，书法老师就忧心，大家以后全都打字，手写能力会持续退步。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e每一次新技术诞生，都会出现类似的论调，总有人担心人类会被技术毁掉。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我始终觉得，传统根基和未来发展需要兼顾，那现在孩子们内心真实的想法究竟是什么？\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGczW2zI3Et6IXpiax326tsZAfQpd56sbfMInnPCl4HdWMu8W9u6GPpKb3I8knNhT6ibpGq0SWO2yfoQcMobZXaDg2rRGWvudyjk/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e作为一名教育者和技术从业者，无论去到哪里，我都希望能主动和学生、家长以及一线老师交流沟通。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e可政策制定者、投资人、科技行业从业者们，往往会忽略老师、家长与青少年这群核心人群。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e不少业内人自己也有子女，却很少静下心倾听他们的真实诉求。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e我始终对年轻一代抱有期待。\u003c/strong\u003e纵观人类发展史，这样的场景不断重复：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e老一辈总会感慨今不如昔，觉得年轻人不懂规矩、丢掉过往的传统。但\u003cstrong\u003e拉长时间线来看，人类社会整体始终在向好的方向前进。\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e我不否认发展路上会有冲突、磨难，但对人类整体的未来保持乐观。\u003c/p\u003e\n\u003cp\u003e孩子天生带着旺盛的好奇心，AI固然能带给他们丰富的娱乐体验，但\u003cstrong\u003e他们也会慢慢学会合理驾驭这项技术。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e真正让我放心不下的，其实是\u003cstrong\u003e一线教师与部分家长\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGHXzzGicGOAlwqwyib3RuA5SErGVT5qbAUOX7H7xvFnqNc2WOqQmcCubkY2Wj7572kXmoedYxzPyd7HVwjiaoibfZrWB87PXRic0DjE/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e整个社会，尤其是硅谷，\u003cstrong\u003e没能给他们充足的配套支持\u003c/strong\u003e，大多只会站在高处说教、一味指责。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e教师和家长是支撑社会运转至关重要的群体，我们要做的是倾听他们的难处、提供帮扶与配套资源。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从基础教育到高等教育阶段，\u003cstrong\u003e老师们扛着整个社会最沉重的育人压力。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我说一件亲身经历的事，2022年ChatGPT刚上线，身处行业内的我第一时间给孩子小学的校长发邮件，主动提出\u003cstrong\u003e希望能入校做一场分享\u003c/strong\u003e，给老师和学生们科普新技术。\u003c/p\u003e\n\u003cp\u003e不是因为我自认专业上高人一等，而是\u003cstrong\u003e希望一线教育者能第一时间了解这场技术变革。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e硅谷的投资人、体量千亿的科技巨头，几乎没有人第一时间想到周边学校的授课老师，但这件事恰恰至关重要。\u003c/p\u003e\n\u003cp\u003e老师们常会提出顾虑：\u003cstrong\u003e“学生用AI抄袭作弊该如何管控？”\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这是非常合理的疑问，\u003cstrong\u003e我们需要走进校园，向老师们完整展示技术、赋能教育工作者，和他们一同摸索可行的解决办法。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e老师们学习能力强、也愿意主动改变，只是常常被外界忽略。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我看好孩子们的未来，但不会盲目乐观；\u003c/p\u003e\n\u003cp\u003e想要守护下一代，\u003cstrong\u003e一定要看见教师群体，帮扶老师与家长\u003c/strong\u003e，才能真正引导青少年正确使用AI。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGF5WqSLJycXC8ymqWjeF8PPR00WWmt84jian6gK9p11m99P4Mwey0uacicWRaKJRz0SvtSYMZ8AxSt71soIWNicG4ia8yHibpFY8Nck/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我十分认同你的这番话，相信很多人听到都会深有感触。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e教师理应被善待，他们需要充足的资讯与全方位的支持。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e如今大部分播客聊到教育与AI，只会走向两个极端；要么大肆渲染末日恐慌，要么一味鼓吹乌托邦式的美好，两种论调都没法真正帮到老师和学生。\u003c/p\u003e\n\u003ch2 id=\"提示词的撰写质量有多重要\"\u003e提示词的撰写质量有多重要？\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e不好意思，我还想再追问一点，想要AI输出精准、高质量的内容，\u003cstrong\u003e提示词的撰写质量有多重要？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e提示词是重中之重，起到\u003cstrong\u003e决定性作用。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e可见\u003cstrong\u003e精准提问、撰写优质提示词，本身就是一项需要学习的核心能力。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e没错，这也是我们开展AI科普、校园教学的核心意义。我特别希望中小学能把提示词思维纳入常规课程。举个有意思的例子，\u003cstrong\u003e你觉得人类历史上最顶尖的“提示工程师”是谁？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e这个问题我恐怕答不上来。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e是\u003cstrong\u003e苏格拉底。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e倘若他生活在当下，绝对是顶尖高手。\u003c/strong\u003e他标志性的诘问法，本质就是层层递进、不断追问，顺着线索挖掘事物本质、探寻真理。\u003c/p\u003e\n\u003cp\u003e这套思维方式，完全可以教给孩子们。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFoI1RkTRtkvRLTYJeh2mJwG3RxORkicdlZwSU1RfqVEKZNGP85Qwv9b8k432BB1Le7nZPqibSCeYIqh31h9sQPOjuDg6AaT1AjM/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e此外我认为，\u003cstrong\u003e具身交互不只局限于人类康复领域，具身AI同样延伸到机器人赛道。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAI的下一轮技术革新，早已不再局限于语言模型。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e人类演化数亿年，在漫长岁月里都没有依靠语言交流；而具备实体的机器人能够辅助人类生活，让整个社会变得更好。\u003c/p\u003e\n\u003ch2 id=\"技术洪流中人才是最终的锚点\"\u003e技术洪流中，人才是最终的锚点\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我们讨论AI，核心一定要抓住一点，即\u003cstrong\u003e技术本该拉近人与人的距离，而不是制造隔阂。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e现在不少AI领域的领军人物，也还在学着如何面对公众。一旦站到聚光灯下，身上一丁点不足都会被无限放大。\u003c/p\u003e\n\u003cp\u003e我期待他们能更快成长，向大众传递客观、真实的技术全貌。\u003c/p\u003e\n\u003cp\u003e学术界、医学界还存在一种不成文的隐性风气，那就是掌握技术核心逻辑的人，会刻意回避向大众讲清底层原理，\u003cstrong\u003e这种靠信息差守住话语权的做法，对任何人都没有好处。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e只有撕开技术的神秘外衣，\u003cstrong\u003e让大众看懂背后的真相，大家才能真正放下顾虑、获得更充足的安全感。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGEJPRywtBKRKutffBhUFWiaWIviaM3efRpDsDykc0uNibj7hX5k9uwloriaOslt7t7qQaYwfRJdPKQZmECNcsEFVsoltKkUL92eSMc/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e垄断信息的确能攥住话语权，一句“听我的就好，我直接给你结论”也能建立权威，但教育者绝不会选择这种方式。\u003c/p\u003e\n\u003cp\u003e课堂上，我们不会只简单告知学生二加二等于四，而是拆解演算逻辑，教会他们自主推导、独立思考。\u003c/p\u003e\n\u003cp\u003e除此之外，我们还\u003cstrong\u003e需要听见来自更多视角的声音。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有无数学者、技术研发者、创作者，一直在钻研如何合理地运用AI造福大众，这些珍贵的声音，值得被更多人看见。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"Image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGFQyoPBia4fAoMhRLtqbvic1M06Ih7RQTibKacmkecrLfygjlyicAqHcib3cz1UmVjLCQWAUTFEb4okicWpHqvSTwnBwuH7GTFxZyNL8/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e完整访谈：\u003ca href=\"https://x.com/hubermanlab/status/2086814834213925013?s=20\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://x.com/hubermanlab/status/2086814834213925013?s=20\u003c/a\u003e\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e— \u003cstrong\u003e完\u003c/strong\u003e —\u003c/p\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:03eb157baab54ed4baddf1ba35dfce380eab8dc12d47267f7eabe89350b8956e":{"html":"\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e首先我想说，\u003cstrong\u003eWaymo这套模型，还是必须得把现实里所有的交通规则全都学透才行。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e其次我觉得，\u003cstrong\u003e硬件类产品落地见效会慢很多。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我是独生女，家里两位长辈年纪大、身体都不好，还不会英语，平日里照料的担子很重。我特别希望能有机器人分担体力活，当然\u003cstrong\u003e它绝对替代不了亲情陪伴和家人间的谈心，只是帮我们扛下繁琐费力的杂事。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e加州常年有山火，人类消防员冲进火场风险极高，这种\u003cstrong\u003e高危作业完全可以交给机器人。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e再比如\u003cstrong\u003e独居老人\u003c/strong\u003e，买菜、取药、出门散步都不方便，现在只有快递配送能解决一小部分需求；\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e医疗护理行业更是常年缺人，护士永远超负荷连轴转。\u003c/strong\u003e我父亲住院那段时间我亲眼看到，护士一个班次要来回跑无数趟取药、搬运物资。\u003c/p\u003e\n\u003cp\u003e只要让机器人接手这类工作，\u003cstrong\u003e能造福社会的场景实在太多了。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFClclMH5KDPrjczlA3ibmOGlJHRcBWk63M56shMsCungR3ibeB9IIbicgnibErG00Zagw7aVricOzHThe1HicvlB6gH7OeZJRiaFAR10/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e听你说完，我脑海里已经浮现出不少机器人帮忙送货上门、疏导交通的画面了哈哈，\u003cstrong\u003e我觉得大众对机器人、AI的恐惧，很大一部分来源于它是实体的。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e我觉得人和实体机器共处，跟人与人之间相处完全是两回事。我倒不奢求能和机器人产生什么情感羁绊，只希望它能帮我叠衣服、扫地、打理花草、喂鱼……当然喂鱼我还是更喜欢自己来，亲手照料的过程很治愈。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e你的小狗会帮你喂鱼吗？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e哈哈那倒不会，它是只不太聪明但性格很好的斗牛犬，它只会趴在鱼缸边上盯着，完全不懂怎么照料鱼儿。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e你知道\u003cstrong\u003e大白（Baymax）\u003c/strong\u003e吗？迪士尼**《超能陆战队》电影**里的医疗机器人，外形像巨大的充气软气球，没有坚硬外壳，这种形态大家接受度会高很多。\u003c/p\u003e\n\u003cp\u003e**\u003c/p\u003e\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_jpg/A6fTew8FFGHfPGuaFcByyQrPhYIxCh9CZsOudqPV7nXibJUJIXTY0MWLNicc6myU4a0sV6Dh3kwHZL1vkH3x2TAw6ouQgyq0eAXicVjS1g07KY/640?wx_fmt=jpeg\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e△**来源迪士尼动画电影《超能陆战队》\u003cp\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e确实呢，也更容易适应。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e我们再说回自主技术这件事吧。\u003c/p\u003e\n\u003cp\u003e我觉得\u003cstrong\u003e未来的生活图景，不该由某一家企业、一群投资人单方面定义，全社会都该主动参与、一起构想。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e现在关于AI的舆论有个很大的问题，\u003cstrong\u003e普通人永远只能被动接受技术带来的结果，却没办法参与到前期设计规划里。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e就像之前你父亲做手术，医生操控机器人配合操作，人机协同才能发挥最好的效果。我也想到不少场景。\u003c/p\u003e\n\u003cp\u003e小孩子独自上下学是很好的锻炼，但家长总放心不下安全，如果有陪护机器人一路随行，遇到危险可以立刻报警，甚至简单防护，就能给孩子更多独立活动的空间；\u003c/p\u003e\n\u003cp\u003e线上网络环境复杂，家长很难全方位看管，或许可以做一个线上守护虚拟形象，自动识别不良风险、隔绝有害信息。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e这个思路完全能做成一个很不错的创业项目。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e但眼下现实条件还差得很远。\u003c/p\u003e\n\u003cp\u003e我读博的时候常在帕洛阿尔托街头碰到\u003cstrong\u003e乔布斯\u003c/strong\u003e，他经常光脚出门，打扮得像个嬉皮士，对待员工脾气也直，放在现在公司HR肯定很难接纳。\u003c/p\u003e\n\u003cp\u003e但他很懂，计算机不能只是冰冷机器，要做出圆润便携的外观、能轻松揣进口袋，开机界面放上鲍勃・迪伦（传奇民谣音乐人），一点点消弭人和科技之间的隔阂。\u003c/p\u003e\n\u003cp\u003e有人会说这是\u003cstrong\u003e变相的“特洛伊木马”\u003c/strong\u003e，但我不这么看。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e想要实现人和机器人良性共存、互相协作，就需要这种懂技术、更懂人性的人。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e很多顶尖技术天才专业能力无可挑剔，可大众始终难以接纳他们的理念，根源就是不懂如何与人沟通、传递技术价值，\u003cstrong\u003e他们需要擅长人文表达的合作者配合。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e另外\u003cstrong\u003e不少媒体总刻意制造对立\u003c/strong\u003e，大肆渲染“科技从业者抢走普通人的一切”，大多只是为了博取流量牟利。\u003c/p\u003e\n\u003cp\u003e我们去哪里才能找到这种兼顾技术能力与人文共情的人才？\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGEZ7DX1NC13Sevm3Ycb129wSappKSASr9MeVkcBTdgz6icjypqicZb3M0AaIo0W4cchBcDAQTs7CWrVK7FNw0VHCOehpUYvDphLk/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e其实有不少这样的人，你就是其中之一。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGiapmPQpibf8Ks2shnQsJzQibnf47pAjZRc0suUTNPLLcnmj2hjaJhDvg7QjK1e9oD0fRIxq69NW5meqZiaicHoUcIYA3iaNKeTSbTs/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e可惜他们太正常，导致获得的流量和关注度太低了。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e \u003cstrong\u003e不少创业者都在做极具社会价值的事\u003c/strong\u003e，比如用AI研发新药、辅助诊疗、研究衰老、打造心理健康工具；还有大批设计师、产品经理在为此努力。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e但舆论的话语权，总是给到了那些一味鼓吹技术万能的人。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这期播客就是想\u003cstrong\u003e多传递人文视角\u003c/strong\u003e，把普通人的真实需求、人类长远的未来纳入AI讨论。\u003c/p\u003e\n\u003cp\u003e我并不悲观，我本身是教育从业者、技术建设者。我见过很多优秀年轻人，明明能去大厂拿高薪，却选择加入World Labs，想用技术实实在在帮到普通人，只是这类声音太少，很难被大众听见。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e如今公共舆论两极分化严重\u003c/strong\u003e，一部分人忙着散播末日恐慌，另一部分人忙着鼓吹技术无所不能，两种声音都太过极端，很容易让普通人觉得**“你们掌握技术的人当然站着说话不腰疼”**。\u003c/p\u003e\n\u003cp\u003e我们需要回归客观中立的视角，理性看待技术本身，重点讨论该如何合理运用，\u003cstrong\u003e让全社会一起掌握塑造未来的主动权。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我一位同行说过一句很简单、却总被大家忽略的话：“大众不爱听冷冰冰的技术故事，更容易共情充满人情味的真人经历。”\u003c/p\u003e\n\u003cp\u003e比如AI协助兽医治好宠物癌症；孩子病症罕见、多位医生找不到病因，AI帮忙锁定病灶……这类故事才动人、容易引发共鸣.\u003c/p\u003e\n\u003cp\u003e可流量和曝光，远远比不上博眼球的极端内容。传统媒体只追逐一两天的短期热点，很少深耕长期行业趋势。\u003c/p\u003e\n\u003cp\u003e还有无数人一直在推动AI向善、探索人机协作，我们应该多看见、多传播他们的声音。\u003c/p\u003e\n\u003cp\u003e这个话题先告一段落，我们来谈谈\u003cstrong\u003eAI与影视创作的关系吧。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFE9YCfrxZ4MyFDPDjWicg6aJIVgqYIGFzfFgPzZlp6icvuZqsHln4oEavZrkwX0VGSjtUSjULiaq6ZID0Mneia9WWvTZxgd1n4J0E/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"**李飞飞：**首先我想说，**Waymo这套模型，还是必须得把现实里所有的交通规则全都学透才行。**\n\n其次我觉得，**硬件类产品落地见效会慢很多。**\n\n我是独生女，家里两位长辈年纪大、身体都不好，还不会英语，平日里照料的担子很重。我特别希望能有机器人分担体力活，当然**它绝对替代不了亲情陪伴和家人间的谈心，只是帮我们扛下繁琐费力的杂事。**\n\n加州常年有山火，人类消防员冲进火场风险极高，这种**高危作业完全可以交给机器人。**\n\n再比如**独居老人**，买菜、取药、出门散步都不方便，现在只有快递配送能解决一小部分需求；\n\n**医疗护理行业更是常年缺人，护士永远超负荷连轴转。**我父亲住院那段时间我亲眼看到，护士一个班次要来回跑无数趟取药、搬运物资。\n\n只要让机器人接手这类工作，**能造福社会的场景实在太多了。**\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFClclMH5KDPrjczlA3ibmOGlJHRcBWk63M56shMsCungR3ibeB9IIbicgnibErG00Zagw7aVricOzHThe1HicvlB6gH7OeZJRiaFAR10/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n**主持人：**听你说完，我脑海里已经浮现出不少机器人帮忙送货上门、疏导交通的画面了哈哈，**我觉得大众对机器人、AI的恐惧，很大一部分来源于它是实体的。**\n\n我觉得人和实体机器共处，跟人与人之间相处完全是两回事。我倒不奢求能和机器人产生什么情感羁绊，只希望它能帮我叠衣服、扫地、打理花草、喂鱼……当然喂鱼我还是更喜欢自己来，亲手照料的过程很治愈。\n\n**李飞飞：**你的小狗会帮你喂鱼吗？\n\n**主持人：**哈哈那倒不会，它是只不太聪明但性格很好的斗牛犬，它只会趴在鱼缸边上盯着，完全不懂怎么照料鱼儿。\n\n**李飞飞：**你知道**大白（Baymax）**吗？迪士尼**《超能陆战队》电影**里的医疗机器人，外形像巨大的充气软气球，没有坚硬外壳，这种形态大家接受度会高很多。\n\n**\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/sz_mmbiz_jpg/A6fTew8FFGHfPGuaFcByyQrPhYIxCh9CZsOudqPV7nXibJUJIXTY0MWLNicc6myU4a0sV6Dh3kwHZL1vkH3x2TAw6ouQgyq0eAXicVjS1g07KY/640?wx_fmt=jpeg\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e△**来源迪士尼动画电影《超能陆战队》\n\n**主持人：**确实呢，也更容易适应。\n\n**李飞飞：**我们再说回自主技术这件事吧。\n\n我觉得**未来的生活图景，不该由某一家企业、一群投资人单方面定义，全社会都该主动参与、一起构想。**\n\n现在关于AI的舆论有个很大的问题，**普通人永远只能被动接受技术带来的结果，却没办法参与到前期设计规划里。**\n\n**主持人：**就像之前你父亲做手术，医生操控机器人配合操作，人机协同才能发挥最好的效果。我也想到不少场景。\n\n小孩子独自上下学是很好的锻炼，但家长总放心不下安全，如果有陪护机器人一路随行，遇到危险可以立刻报警，甚至简单防护，就能给孩子更多独立活动的空间；\n\n线上网络环境复杂，家长很难全方位看管，或许可以做一个线上守护虚拟形象，自动识别不良风险、隔绝有害信息。\n\n**李飞飞：**这个思路完全能做成一个很不错的创业项目。\n\n**主持人：**但眼下现实条件还差得很远。\n\n我读博的时候常在帕洛阿尔托街头碰到**乔布斯**，他经常光脚出门，打扮得像个嬉皮士，对待员工脾气也直，放在现在公司HR肯定很难接纳。\n\n但他很懂，计算机不能只是冰冷机器，要做出圆润便携的外观、能轻松揣进口袋，开机界面放上鲍勃・迪伦（传奇民谣音乐人），一点点消弭人和科技之间的隔阂。\n\n有人会说这是**变相的“特洛伊木马”**，但我不这么看。\n\n**想要实现人和机器人良性共存、互相协作，就需要这种懂技术、更懂人性的人。**\n\n很多顶尖技术天才专业能力无可挑剔，可大众始终难以接纳他们的理念，根源就是不懂如何与人沟通、传递技术价值，**他们需要擅长人文表达的合作者配合。**\n\n另外**不少媒体总刻意制造对立**，大肆渲染“科技从业者抢走普通人的一切”，大多只是为了博取流量牟利。\n\n我们去哪里才能找到这种兼顾技术能力与人文共情的人才？\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGEZ7DX1NC13Sevm3Ycb129wSappKSASr9MeVkcBTdgz6icjypqicZb3M0AaIo0W4cchBcDAQTs7CWrVK7FNw0VHCOehpUYvDphLk/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n**李飞飞：**其实有不少这样的人，你就是其中之一。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGGiapmPQpibf8Ks2shnQsJzQibnf47pAjZRc0suUTNPLLcnmj2hjaJhDvg7QjK1e9oD0fRIxq69NW5meqZiaicHoUcIYA3iaNKeTSbTs/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n**主持人：**可惜他们太正常，导致获得的流量和关注度太低了。\n\n**李飞飞：** **不少创业者都在做极具社会价值的事**，比如用AI研发新药、辅助诊疗、研究衰老、打造心理健康工具；还有大批设计师、产品经理在为此努力。\n\n**但舆论的话语权，总是给到了那些一味鼓吹技术万能的人。**\n\n这期播客就是想**多传递人文视角**，把普通人的真实需求、人类长远的未来纳入AI讨论。\n\n我并不悲观，我本身是教育从业者、技术建设者。我见过很多优秀年轻人，明明能去大厂拿高薪，却选择加入World Labs，想用技术实实在在帮到普通人，只是这类声音太少，很难被大众听见。\n\n**如今公共舆论两极分化严重**，一部分人忙着散播末日恐慌，另一部分人忙着鼓吹技术无所不能，两种声音都太过极端，很容易让普通人觉得**“你们掌握技术的人当然站着说话不腰疼”**。\n\n我们需要回归客观中立的视角，理性看待技术本身，重点讨论该如何合理运用，**让全社会一起掌握塑造未来的主动权。**\n\n**主持人：**我一位同行说过一句很简单、却总被大家忽略的话：“大众不爱听冷冰冰的技术故事，更容易共情充满人情味的真人经历。”\n\n比如AI协助兽医治好宠物癌症；孩子病症罕见、多位医生找不到病因，AI帮忙锁定病灶……这类故事才动人、容易引发共鸣.\n\n可流量和曝光，远远比不上博眼球的极端内容。传统媒体只追逐一两天的短期热点，很少深耕长期行业趋势。\n\n还有无数人一直在推动AI向善、探索人机协作，我们应该多看见、多传播他们的声音。\n\n这个话题先告一段落，我们来谈谈**AI与影视创作的关系吧。**\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGFE9YCfrxZ4MyFDPDjWicg6aJIVgqYIGFzfFgPzZlp6icvuZqsHln4oEavZrkwX0VGSjtUSjULiaq6ZID0Mneia9WWvTZxgd1n4J0E/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:113db9f0db9dc77ebf9addd1365387c559df9fcb84e6454f2dfd92ac9bb11e7a":{"html":"\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e那如今，AI技术迭代得这么快，监管部门、普通大众还有行业从业者，要怎么把握分寸，平衡技术创新和潜在风险？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e这也是我在斯坦福大学创办\u003cstrong\u003eHAI（以人为本人工智能研究院）\u003c/strong\u003e的初衷。\u003c/p\u003e\n\u003cp\u003eAI行业的发展可以参考汽车、生物科技过往的发展治理经验，让所有相关方都参与进来共同把控。\u003c/p\u003e\n\u003cp\u003e一方面我们要\u003cstrong\u003e制定完善的行业伦理准则\u003c/strong\u003e、\u003cstrong\u003e在高校开设AI伦理相关课程\u003c/strong\u003e，\u003cstrong\u003e配套落地对应的监管条例\u003c/strong\u003e；\u003c/p\u003e\n\u003cp\u003e像医疗AI这类高风险应用，还需要类似FDA的\u003cstrong\u003e权威机构设立安全红线。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不能只让少数科技企业替整个社会做决定，单纯追逐市场收益的逻辑，绝不能凌驾于社会伦理与大众文化之上。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGUVpLJAJA3o7HU3iaXuiadicGOpVB4TEV84AG0CXGI2NoKg4xJoorY79JvjoNvkXSicAoedOh0XWJzdSzpeO1icntRTuyJ7KtHTia6Q/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"**主持人：**那如今，AI技术迭代得这么快，监管部门、普通大众还有行业从业者，要怎么把握分寸，平衡技术创新和潜在风险？\n\n**李飞飞：**这也是我在斯坦福大学创办**HAI（以人为本人工智能研究院）**的初衷。\n\nAI行业的发展可以参考汽车、生物科技过往的发展治理经验，让所有相关方都参与进来共同把控。\n\n一方面我们要**制定完善的行业伦理准则**、**在高校开设AI伦理相关课程**，**配套落地对应的监管条例**；\n\n像医疗AI这类高风险应用，还需要类似FDA的**权威机构设立安全红线。**\n\n**不能只让少数科技企业替整个社会做决定，单纯追逐市场收益的逻辑，绝不能凌驾于社会伦理与大众文化之上。**\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGGUVpLJAJA3o7HU3iaXuiadicGOpVB4TEV84AG0CXGI2NoKg4xJoorY79JvjoNvkXSicAoedOh0XWJzdSzpeO1icntRTuyJ7KtHTia6Q/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:120bb428972998cf6174838c75e701b76c0cd796bdf90865a9b12cb813e5b8ee":{"html":"\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e那往更深一层说，像自主创造力、独属于个人的内心感受呢？\u003c/p\u003e\n\u003cp\u003eAI所有训练素材都来源于网络，但人有太多私密的内心体验根本不会发到网上。就像欣赏抽象画作时独有的情绪、想起小时候老家那种专属自己的感触，\u003cstrong\u003eAI是不是永远都欠缺这部分感知？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e你问到了最核心的一点。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e互联网汇集了人类图文、影像等各式各样的行为数据，这也是AI之所以强大的根本。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e但那些高度私人化的思绪、情绪与心底的感触，没有任何形式的记录，网上自然找不到相关数据，\u003cstrong\u003eAI根本没办法学习和体会。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e举个例子，AlphaGo下出的第37手，看着好像具备了创造力，可围棋有一套完整严谨的数学规则；\u003c/p\u003e\n\u003cp\u003e反观不少\u003cstrong\u003e顶尖数学难题\u003c/strong\u003e，需要人类跳出固有框架想出全新解法，\u003cstrong\u003e这类问题我更看好人和AI配合协作攻克。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e至于看到一只杯子，瞬间勾起只属于自己的童年往事，这种\u003cstrong\u003e私人又主观的情感体验，是现阶段AI完全触碰不到的局限。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGHGgX30stJj221DPyjbr8cMe1YP3Jv2Ip5yZjs5q7fCMu3t4uMKplic0b55icnaTqCXJT4mkvZfc419YPjA4SgUYqh2olmsnYOl0/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e那将来如果用上无创脑机设备，直接读取大脑里的信号，能不能补上这块短板？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e单从理论技术层面来讲有实现的可能，但有一个硬性前提是“人内心的心理活动信号，得能被传感器捕捉识别。”\u003c/p\u003e\n\u003cp\u003e要是连我们自己都没办法用语言或者动作把内心细腻的感受表达出来，机器自然也就获取不到对应的信息。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e那直觉、内心诉求、紧迫感这类发自本能的内在状态呢？AI有可能产生真正属于自己的内在驱动力吗？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e现在我们能通过设定目标函数，让AI模仿出近似的效果，像是深度思考模式、快速应答模式等等。\u003c/p\u003e\n\u003cp\u003e可这些说到底也\u003cstrong\u003e只是调整数学参数而已\u003c/strong\u003e，\u003cstrong\u003eAI不会生出真实的恐惧、喜爱，更不存在发自本心的共情。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e它说出那些安抚人的话语，只是套用学到的语言表达模式（learned language patterns），和人类发自心底的共情完全是两回事，\u003cstrong\u003e这一点很有必要跟大众好好科普清楚。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGHr5iawoYNjeEGNdX5EMf3rdk5Biaia37RLTicviaJ6nzbqH0sftVuODqEibkDXssPgr7xo4eT1ZTtTia4rgFjibrLRKJbhstL5vf7lFlo/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"**主持人：**那往更深一层说，像自主创造力、独属于个人的内心感受呢？\n\nAI所有训练素材都来源于网络，但人有太多私密的内心体验根本不会发到网上。就像欣赏抽象画作时独有的情绪、想起小时候老家那种专属自己的感触，**AI是不是永远都欠缺这部分感知？**\n\n**李飞飞：**你问到了最核心的一点。\n\n**互联网汇集了人类图文、影像等各式各样的行为数据，这也是AI之所以强大的根本。**\n\n但那些高度私人化的思绪、情绪与心底的感触，没有任何形式的记录，网上自然找不到相关数据，**AI根本没办法学习和体会。**\n\n举个例子，AlphaGo下出的第37手，看着好像具备了创造力，可围棋有一套完整严谨的数学规则；\n\n反观不少**顶尖数学难题**，需要人类跳出固有框架想出全新解法，**这类问题我更看好人和AI配合协作攻克。**\n\n至于看到一只杯子，瞬间勾起只属于自己的童年往事，这种**私人又主观的情感体验，是现阶段AI完全触碰不到的局限。**\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGHGgX30stJj221DPyjbr8cMe1YP3Jv2Ip5yZjs5q7fCMu3t4uMKplic0b55icnaTqCXJT4mkvZfc419YPjA4SgUYqh2olmsnYOl0/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n**主持人：**那将来如果用上无创脑机设备，直接读取大脑里的信号，能不能补上这块短板？\n\n**李飞飞：**单从理论技术层面来讲有实现的可能，但有一个硬性前提是“人内心的心理活动信号，得能被传感器捕捉识别。”\n\n要是连我们自己都没办法用语言或者动作把内心细腻的感受表达出来，机器自然也就获取不到对应的信息。\n\n**主持人：**那直觉、内心诉求、紧迫感这类发自本能的内在状态呢？AI有可能产生真正属于自己的内在驱动力吗？\n\n**李飞飞：**现在我们能通过设定目标函数，让AI模仿出近似的效果，像是深度思考模式、快速应答模式等等。\n\n可这些说到底也**只是调整数学参数而已**，**AI不会生出真实的恐惧、喜爱，更不存在发自本心的共情。**\n\n它说出那些安抚人的话语，只是套用学到的语言表达模式（learned language patterns），和人类发自心底的共情完全是两回事，**这一点很有必要跟大众好好科普清楚。**\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGHr5iawoYNjeEGNdX5EMf3rdk5Biaia37RLTicviaJ6nzbqH0sftVuODqEibkDXssPgr7xo4eT1ZTtTia4rgFjibrLRKJbhstL5vf7lFlo/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:2299dcc6d3b1badd3b8d7ad8ac1fbddf2662d17ef1b2dc55c20ac12aa54212b2":{"html":"\u003cp\u003e我说一件我自己亲身经历的事吧，就是咱们这次访谈原本要延期，因为前段时间我父亲在斯坦福做肝脏手术。\u003c/p\u003e\n\u003cp\u003e这场手术依靠\u003cstrong\u003e达芬奇手术机器人\u003c/strong\u003e完成，并由外科主刀医生全程操控，这就是很典型的人机深度协作。\u003c/p\u003e\n\u003cp\u003e术后我和主刀医生聊，问他如果整合全球所有同类型肝脏手术数据，有没有可能训练出一台能全自动完成肝脏手术的AI？\u003c/p\u003e\n\u003cp\u003e他给出的答案并不乐观，人体肝脏结构错综复杂，血管分布密集，每个人的器官形态差异极大，就算汇总全世界所有病例，数据量也很难支撑算法达到稳定可靠的水平。\u003c/p\u003e\n\u003cp\u003e这也印证了一个关键点，\u003cstrong\u003eAI的判断全部依托数据里总结出的规律，一旦对应场景的样本稀少，我们就要理性看待AI的能力\u003c/strong\u003e，分清哪些场景适合使用，哪些场景还无法依靠它。\u003c/p\u003e\n\u003cp\u003e像这种复杂外科手术，医生操控机器人操作，效果远比机器人自主执刀要好得多。但外科医生的经验，又会受自己实操手术数量的限制，\u003cstrong\u003e这正是人机协作可以大放异彩的地方。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e未来还有很多可能性。我们能不能搭建肝脏器官的虚拟仿真模型，让AI无限次模拟手术训练？这也是现在还在探索的科研方向。\u003c/p\u003e\n\u003cp\u003e但像你之前遇到的低血压、眩晕鉴别诊断，\u003cstrong\u003e这类病症积累了海量病例，数据库样本充足，AI就能充分发挥作用，给那些没法及时线下就医的人提供初步参考。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGEnmEZkBtrLYyOic0zOAsiaGyaEcIEMdPEW1TtVoAjenyVnUEUTMoFutCmLYpYqIOCqLdlQ42Y5sF0wQnmaLoKeXG3yAl9HTicRibA/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e很高兴听到你父亲手术一切顺利。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e谢谢，手术很成功。得益于腹腔镜机器人技术，\u003cstrong\u003e术中出血量比传统手术少了十倍。\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"我说一件我自己亲身经历的事吧，就是咱们这次访谈原本要延期，因为前段时间我父亲在斯坦福做肝脏手术。\n\n这场手术依靠**达芬奇手术机器人**完成，并由外科主刀医生全程操控，这就是很典型的人机深度协作。\n\n术后我和主刀医生聊，问他如果整合全球所有同类型肝脏手术数据，有没有可能训练出一台能全自动完成肝脏手术的AI？\n\n他给出的答案并不乐观，人体肝脏结构错综复杂，血管分布密集，每个人的器官形态差异极大，就算汇总全世界所有病例，数据量也很难支撑算法达到稳定可靠的水平。\n\n这也印证了一个关键点，**AI的判断全部依托数据里总结出的规律，一旦对应场景的样本稀少，我们就要理性看待AI的能力**，分清哪些场景适合使用，哪些场景还无法依靠它。\n\n像这种复杂外科手术，医生操控机器人操作，效果远比机器人自主执刀要好得多。但外科医生的经验，又会受自己实操手术数量的限制，**这正是人机协作可以大放异彩的地方。**\n\n未来还有很多可能性。我们能不能搭建肝脏器官的虚拟仿真模型，让AI无限次模拟手术训练？这也是现在还在探索的科研方向。\n\n但像你之前遇到的低血压、眩晕鉴别诊断，**这类病症积累了海量病例，数据库样本充足，AI就能充分发挥作用，给那些没法及时线下就医的人提供初步参考。**\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGEnmEZkBtrLYyOic0zOAsiaGyaEcIEMdPEW1TtVoAjenyVnUEUTMoFutCmLYpYqIOCqLdlQ42Y5sF0wQnmaLoKeXG3yAl9HTicRibA/640?wx_fmt=png\u0026from=appmsg\u0026watermark=1\" alt=\"Image\" /\u003e\u003c/div\u003e\n\n**主持人：**很高兴听到你父亲手术一切顺利。\n\n**李飞飞：**谢谢，手术很成功。得益于腹腔镜机器人技术，**术中出血量比传统手术少了十倍。**","sourceFormat":"markdown"},"note:sha256:2380e8358490e2d6024b1e352b493ea0c8c13d74dbc8f7642aa189cf26ae5c92":{"html":"\u003cp\u003e\u003cstrong\u003e主持人（Andrew Huberman）：\u003c/strong\u003e飞飞，我们今天先从\u003cstrong\u003e视觉\u003c/strong\u003e开始聊聊AI吧。很多人觉得光线感知和AI离得很远，但它其实是AI发展的一大起点？\u003c/p\u003e\n","kind":"html","rawMarkdown":"**主持人（Andrew Huberman）：**飞飞，我们今天先从**视觉**开始聊聊AI吧。很多人觉得光线感知和AI离得很远，但它其实是AI发展的一大起点？","sourceFormat":"markdown"},"note:sha256:482f623dfef513cf2e8465312cffb44434fdf78e97fb364867d3fba38a224bfa":{"html":"\u003cp\u003e\u003cstrong\u003e主持人：\u003c/strong\u003e我们讨论AI，核心一定要抓住一点，即\u003cstrong\u003e技术本该拉近人与人的距离，而不是制造隔阂。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e现在不少AI领域的领军人物，也还在学着如何面对公众。一旦站到聚光灯下，身上一丁点不足都会被无限放大。\u003c/p\u003e\n\u003cp\u003e我期待他们能更快成长，向大众传递客观、真实的技术全貌。\u003c/p\u003e\n\u003cp\u003e学术界、医学界还存在一种不成文的隐性风气，那就是掌握技术核心逻辑的人，会刻意回避向大众讲清底层原理，\u003cstrong\u003e这种靠信息差守住话语权的做法，对任何人都没有好处。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e只有撕开技术的神秘外衣，\u003cstrong\u003e让大众看懂背后的真相，大家才能真正放下顾虑、获得更充足的安全感。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/sz_mmbiz_png/A6fTew8FFGEJPRywtBKRKutffBhUFWiaWIviaM3efRpDsDykc0uNibj7hX5k9uwloriaOslt7t7qQaYwfRJdPKQZmECNcsEFVsoltKkUL92eSMc/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003e李飞飞：\u003c/strong\u003e垄断信息的确能攥住话语权，一句“听我的就好，我直接给你结论”也能建立权威，但教育者绝不会选择这种方式。\u003c/p\u003e\n\u003cp\u003e课堂上，我们不会只简单告知学生二加二等于四，而是拆解演算逻辑，教会他们自主推导、独立思考。\u003c/p\u003e\n\u003cp\u003e除此之外，我们还\u003cstrong\u003e需要听见来自更多视角的声音。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e有无数学者、技术研发者、创作者，一直在钻研如何合理地运用AI造福大众，这些珍贵的声音，值得被更多人看见。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://mmbiz.qpic.cn/mmbiz_png/A6fTew8FFGFQyoPBia4fAoMhRLtqbvic1M06Ih7RQTibKacmkecrLfygjlyicAqHcib3cz1UmVjLCQWAUTFEb4okicWpHqvSTwnBwuH7GTFxZyNL8/640?wx_fmt=png\u0026amp;from=appmsg\u0026amp;watermark=1\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cem\u003e完整访谈：\u003ca href=\"https://x.com/hubermanlab/status/2086814834213925013?s=20\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://x.com/hubermanlab/status/2086814834213925013?s=20\u003c/a\u003e\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e— \u003cstrong\u003e完\u003c/strong\u003e —\u003c/p\u003e\n","kind":"html","rawMarkdown":"**主持人：**我们讨论AI，核心一定要抓住一点，即**技术本该拉近人与人的距离，而不是制造隔阂。**\n\n现在不少AI领域的领军人物，也还在学着如何面对公
