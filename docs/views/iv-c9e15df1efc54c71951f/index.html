</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-08-22T06:24:19.757Z","language":"zh-CN","name":"DeMinds","version":"1.0.26"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"创造性机器智能（CMI）","outlineVersion":1},"sourceRevision":"sha256:6f9fe21bcad42f3b626a959e34086b8bf293772cce01c87ecb9e3ded6f807639","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"创造性机器智能CMI.docx","title":"创造性机器智能（CMI）"},"files":[{"byteLength":19381,"content":"# 创造性机器智能（CMI）\n\n*【最终投稿修订稿】*\n*稿件编号：CMI-2026-0821*\n\n### **摘要**\n\n本文提出创造性机器智能（Creative Machine Intelligence, CMI），一套用于形式化与系统化自动化创造性探究的理论框架。CMI的核心范式转变在于：人类定义初始目标与最终价值判断，机器主导全部中间环节的推理、迭代、验证与生成。机器创造性产出沿“客观约束强度”谱系分为四类——工程发明、科学发现、新颖分析、文学艺术创作——并可扩展至其他形式。本文厘清CMI与传统机器学习、独立大语言模型及现有智能体系统的边界，并通过与Google Co-Scientist、AI Scientist-v2等代表性系统做多维度对比，明确CMI的增量贡献在于将逻辑校验、跨域约束管理、双通道新颖性核验与多类型成果分类整合为统一的十一模块闭环架构。此外，本文定义机器创造力可量化演化路径，使用人类干预频次、中间修正比例与目标模糊度阈值作为理论指标，论证标准化创造任务下机器自主性持续提升的趋势，同时保留人类在方向定义与规范性价值判断上的位置。\n\n**关键词：**创造性机器智能；机器主导创造力；十一模块闭环架构；自动化创造性探究；机器主导的中间流程自动化\n\n## **1 引言**\n\n当前人工智能研究主要聚焦模式拟合、文本生成以及面向特定任务的智能体助手。现有的AI创造能力呈碎片化分布，缺少统一的定义框架、标准化创造流程、完备的验证机制，也缺少对不同类型创造性产出的统一分类体系。\n\n传统人工智能范式遵循人类主导、机器辅助模式，整个创造流程需要人类频繁提示、中间修正与持续交互。各类现有智能体大多执行外部给定目标，并不以完整、可核验的创造性探究闭环作为自身底层架构。\n\n计算创造力（Computational Creativity）领域自20世纪90年代以来积累了大量研究成果，Wiggins（2006）提出的FACE框架从熟悉度、新颖性、评价与表达维度对创造系统进行刻画，为机器创造力评估提供早期理论基础。在自动化科学发现方向，自King等人（2004）的Robot Scientist开始，该领域历经二十余年发展，已经实现实验闭环、假设自动生成等能力。近年来，Google Co-Scientist（Gottweis et al., 2026）与AI Scientist-v2（Yamada et al., 2025）实现端到端的科学发现流水线，标志该领域由概念验证走向工程集成阶段。\n\n然而，现有系统仍存在三方面突出局限：（1）验证机制单一，多数系统仅依靠文献检索评估新颖性，缺少独立显式逻辑校验与多模态实证验证链路；（2）创造能力碎片化，科学发现、工程发明、文艺创作分属不同系统，缺少统一的理论框架；（3）自主性缺少标准化度量，“自动化”“自主创造”缺少可操作定义，难以横向对比不同系统。CMI正是针对上述缺口提出。\n\n目前尚无理论系统阐述机器如何完成严谨、可核验的完整创造性探究，同时覆盖分析、发现、发明、文艺创作。为弥补该空白，本文建立创造性机器智能CMI框架，将分散的AI创造能力整合为自洽的创造闭环，形式化完整探究流程，并定义朝向更高机器自主性、更低人工介入的演化路径。\n\n## **2 CMI的核心定义**\n\n### **2.1 创造性机器智能的定义**\n\n创造性机器智能（CMI）是一套以机器为主体的创造性探究过程系统，在人类初始约束与最终监督之下执行标准化、可验证、可追溯、可演化的创造流程。\n\nCMI实现范式层级划分：\n\n- L1：方向定义层级，创造任务的根本出发点，该层级始终由人类掌握；\n- L2：中间推理与迭代层级，机器主导完成生成、批判、校验、迭代；当前状态为机器主导的中间流程自动化，部分节点仍需要人工反馈介入；\n- L3：最终判断层级，规范性、价值敏感类判断保留人类裁决；事实性判断可逐步移交机器处理。\n\n定义1：“机器主导”特指L2中间推理迭代层级的控制权归属，并不否定L1与L3层级的人工参与。\n\nCMI的创造性探究过程是动态连续过程，而非二元开关。机器自主占比逐步提升，人类介入频次逐步下降。\n\n### **2.2 CMI的创造性输出功能域**\n\nCMI的创造性产出沿客观约束强度单一谱系排布，从约束最强到约束最弱，下面为四类典型示例，同时可扩展至其他创造形式：\n\n#### **1. 工程发明（约束最强）**\n\n受物理定律、材料属性、工程规范、法规标准及成本约束形成的全新人工解决方案，包含技术方案、机械设计、工艺设计与建筑设计。验证方式：物理仿真+专利-现有技术校验+工程合规检查。\n\n#### **2. 科学发现**\n\n受自然规律约束的客观知识增量，包含尚未被观测的机制、因果关系、结构属性以及数学定理。本体论上，科学发现回答“世界是怎样的”；工程发明回答“世界可以如何被改造”。验证方式：实验检验或形式化证明。\n\n#### **3. 新颖分析**\n\n针对已有现象、理论或数据集提出全新解释框架、分类体系或者关联关系。新颖分析属于跨域元能力，可以服务于科学发现或者工程发明，但本身不强制实证，仅要求逻辑自洽，解释力优于已有框架。\n\n#### **4. 文学艺术创作（约束最弱）**\n\n受体裁惯例、叙事逻辑、审美传统引导的主观表达产出，包括诗歌、小说、戏剧剧本、音乐文本。艺术创作经常出现突破体裁惯例的规则打破行为；该行为由模块5异构双智能体批判控制器识别，最终接纳与否交由人类规范性判断。艺术产出不接入模块9严格验证网关，仅执行内部风格一致性检查。\n\n四类为典型示例，类别之间不存在绝对割裂边界。例如科幻作品同时属于艺术创作与新颖分析，建筑设计处于发明与艺术交叉地带。CMI成果分类器依据客观约束-主观表达权重做连续谱系归类，而非非此即彼二元划分。\n\n## **3 CMI与现有人工智能体系的对比**\n\n### **3.1 与机器学习的对比**\n\n机器学习本质执行非线性拟合与模式归纳，复现已有数据分布，无法原生生成经过多环节校验的全新创造性产出，缺少探究闭环、批判迭代与多层级新颖性核验链路。\n\nCMI不以模式拟合为目标，目标是编排完整的创造性探究过程，完成构想生成、多层校验、迭代演化到产出。\n\n### **3.2 与独立大语言模型的对比**\n\n大语言模型仅作为CMI内部组件（模块2学习基座）。独立大语言模型缺少如下关键组件：\n\n- 独立的显式逻辑校验链路\n- 跨领域约束管理机制\n- 文献、专利双通道新颖性核验\n- 双智能体批判迭代回路\n- 完整可追溯记忆系统\n- 分层的多类型产出分类\n\n大语言模型输出仅为文本生成；CMI输出经过多层校验的创造性产出。\n\n### **3.3 与现有智能体Agent系统的对比**\n\n现有大模型智能体系统以完成外部指定任务为核心，任务目标、边界大多来自人类外部输入。智能体侧重规划、工具调用、任务达成，并不把完整创造性探究闭环作为底层原生架构。\n\n多数通用智能体缺少专门新颖性核验链路、独立形式逻辑校验、双智能体批判迭代，也缺少面向多类型创造产出的统一分类框架。智能体可以嵌入CMI作为内部组件，但通用任务智能体不等同CMI。\n\nCMI核心不是完成外部指派任务，而是运行完整创造性探究过程；创造方向可以在迭代中发生演化，不完全锁死人类预先给定任务目标。\n\n### **3.4 与代表性创造性系统的对比**\n\n为明确CMI定位及其增量贡献，表1将CMI与五类代表性系统做多维度对比：传统机器学习、独立大语言模型、通用智能体AutoGPT、Google Co-Scientist、AI Scientist-v2。\n\n*表1 CMI与代表性系统多维度对比*\n\n| **维度** | **传统ML** | **独立LLM** | **通用Agent** | **Co-Scientist** | **AI Scientist-v2** | **CMI（本文框架）** |\n| --- | --- | --- | --- | --- | --- | --- |\n| 完整创造性探究闭环 | ✗ | ✗ | ✗ | ✓ | ✓ | ✓ |\n| 机器主导中间推理 | ✗ | ✗ | 部分 | ✓ | ✓ | ✓ |\n| 独立显式逻辑校验模块 | ✗ | ✗ | ✗ | ✗ | ✗ | ✓ |\n| 跨领域约束管理 | ✗ | ✗ | ✗ | 部分 | ✗ | ✓ |\n| 多类型创造产出分类 | ✗ | ✗ | ✗ | ✗（仅限科学） | ✗（仅限科学） | ✓ |\n| 双通道新颖性核验（文献+专利） | ✗ | ✗ | ✗ | ✗（仅文献） | 部分 | ✓ |\n| 完整可追溯记忆 | ✗ | ✗ | 部分 | ✓ | ✓ | ✓ |\n| 异构双智能体批判迭代机制 | ✗ | ✗ | 部分 | ✓ | ✓ | ✓ |\n| 标准化多模态输出生成 | ✗ | 部分 | 部分 | ✓ | ✓ | ✓ |\n\n*注：本表格中CMI列代表理论框架设计能力，不代表已工程实现。*\n\n由表1可见，已有系统已经实现部分闭环能力。CMI增量贡献并非创造某一个全新底层技术，而是把分散存在的各类能力，系统化组织进一套统一闭环理论架构。\n\n## **4 CMI十一模块架构**\n\n### **4.1 系统高层数据流**\n\nCMI十一模块遵循：方向输入 → 构想生成 → 逻辑约束校验 → 批判迭代 → 新颖性核验 → 记忆留存 → 分层验证 → 成果归类 → 多模态输出主数据流，包含两条反馈回路：\n\n- 内反馈回路：模块5批判控制器驱动模块2-4完成构想修订迭代；\n- 外反馈回路：模块6、7新颖性核验失败结果回传给模块5，触发新一轮批判重生成。\n\n![image](assets/docx-image-97939cfb73296517.png)\n\n*图1 CMI十一模块架构数据流示意图*\n\n虚线人工介入点：模块1初始输入；模块10之后可插入人类最终判断环节。\n\n### **4.2 模块间接口数据规范**\n\n模块之间传递三类标准化结构化对象：\n\n- 候选构想对象：{内容文本，可选形式化表示，时间戳，来源模块标记}\n- 校验回执对象：{通过 / 部分通过 / 不通过；失败原因；修订建议；置信度评分}\n- 记忆条目对象：{时间戳，触发模块，操作类型，输入快照，输出快照，可选人类反馈记录}\n\n说明：本文为立场论文，给出高层接口定义；底层序列化协议、完整工程实现属于后续研究工作。\n\n### **4.3 各模块功能描述**\n\n#### **1. 人类约束与方向交互接口**\n\n接收人类初始创造目标、约束条件、边界，同时提供人类最终判断的接入入口。\n\n#### **2. 学习基座模块**\n\n生成候选构想、关联领域素材；可基于大语言模型等现有技术实现，是CMI的生成组件。\n\n#### **3. 显式逻辑引擎**\n\n完成形式逻辑一致性检查、充分必要条件核验。候选实现方案包含Lean/Coq证明助手、SAT求解器、各类神经符号推理系统。\n\n#### **4. 结构化领域知识与跨域约束管理器**\n\n存储各领域公理、规范、边界条件，管控跨领域迁移过程中的约束传递。\n\n#### **5. 异构双智能体批判控制器**\n\n核心迭代单元；对候选构想做批判、识别矛盾、识别规则突破，输出修订建议，驱动循环迭代。艺术创作中体裁规则打破行为由本模块识别。\n\n#### **6. 科学文献前沿解析模块**\n\n检索、解析已有学术文献，做科学层面新颖性评估。\n\n#### **7. 专利-现有技术校验模块**\n\n针对技术类产出，检索已有专利与公开技术方案，完成工程层面新颖性评估。\n\n#### **8. 可追溯探究记忆模块**\n\n完整记录全部构想、校验回执、迭代过程，保存记忆条目对象，留存完整探究历史。\n\n#### **9. 形式化与实证验证网关**\n\n分层执行验证，不同功能域采用差异化验证策略：\n\n- 数学/逻辑发现：对接Lean、Coq等形式证明工具，生成证明脚本或定位反例；\n- 科学假设：生成实验方案，对接仿真或自动化实验环境，接收结果判定；\n- 工程发明：调用有限元、CFD等仿真工具完成性能、安全仿真；\n- 新颖分析：不强制实证，直接流转至6-7新颖性核验链路；\n- 文学艺术创作：跳过本网关，直接流向模块11输出。\n\nCMI定位为验证流程编排器，不替代各领域专用验证工具。部分产出暂无自动化验证手段时，保留人类验证备用通道。\n\n#### **10. 成果分类器**\n\n依据客观约束-主观表达权重，将经过校验的产出归入约束强度谱系，兼容非典型交叉类创造产出。\n\n#### **11. 结构化多模态文稿生成模块**\n\n输出标准化交付物：论文、专利文本、设计文档、文学文本等。本模块仅做表达格式化，不产生新的创造性构想。\n\n## **5 CMI系统演化路径**\n\n### **5.1 自主性度量指标**\n\n本文定义三组理论度量指标，用于刻画CMI演化阶段；指标的实测标定属于未来研究工作。\n\n*表2 CMI自主性度量指标*\n\n| **指标** | **定义** | **半自动阶段参考值** | **远期演化目标** |\n| --- | --- | --- | --- |\n| 人类干预频次 HIF | 每千字创造性产出对应的人工输入次数 | 5-10次 | \u003c1次 |\n| 中间节点人工修正比例 HCR | 关键迭代节点中人工介入修正占比 | 30%-50% | \u003c5% |\n| 目标模糊度阈值 FAT | 初始输入可接受的模糊等级（1-10） | 3级（需要较清晰方向） | 8级（仅提供宽泛领域） |\n\n演化过程区分两类判断：\n\n- 规范性判断：伦理、审美、社会价值，保留人类裁决；\n- 事实性判断：假设证伪、方案合规性等，可逐步向机器移交。\n\n### **5.2 过去：人类主导创造范式**\n\n全部分析、构想、校验、迭代高度依赖人类；AI仅承担辅助工具角色，人机交互频次高。\n\n### **5.3 当前：机器主导中间流程自动化**\n\n人类给出初始方向，机器完成大部分生成、批判、校验迭代；关键节点仍然保留人工介入。\n\n### **5.4 未来：标准化创造任务的高度自主**\n\n在可形式化的标准化创造任务下，机器自主性持续提升。但人类仍然保留L1层级方向定义，以及L3层级规范性价值判断。对于本论断存在对立哲学立场，本文采纳该立场，不宣称其为唯一结论，相关批评观点参见Anonymous（2026）[15]。\n\n## **6 讨论**\n\n本文把分散的机器创造能力整合进一套自洽理论体系，厘清纯生成输出、通用智能体任务执行与完整创造性探究过程之间的边界。以客观约束强度谱系，举例给出机器创造的四类典型功能域，同时承认还存在大量交叉、其他类型的创造产出。\n\n十一模块闭环架构，将CMI与模式生成模型、任务导向通用智能体区分开来。CMI增量不是提出全新底层算法，而是把已经分散出现的各类能力，组织成统一闭环框架，覆盖逻辑校验、双通道新颖性核验、多类型创造分类。\n\nCMI也存在明确边界：它是理论编排框架，不等于开箱即用工程系统；部分创造产出的全自动验证目前无法实现，保留人工备用通道。机器创造力不是简单生成文本，而是一整套人类监督之下完整、可校验、可追溯、可演化的探究过程，实现从机器辅助创造向机器主导中间流程创造的过渡，整个提升过程是渐进可控。\n\n## **参考文献**\n\n1. Boden, M. A. (2004). The Creative Mind: Myths and Mechanisms. Routledge.\n\n2. Wiggins, G. A. (2006). A Preliminary Framework for Description, Analysis and Comparison of Creative Systems. Knowledge-Based Systems, 19(7), 449–458. DOI:10.1016/j.knosys.2006.04.009.\n\n3. Wiggins, G. A. (2006). Searching for Computational Creativity. New Generation Computing, 24(3), 209–222. DOI:10.1007/BF03037332.\n\n4. Franceschelli, G., \u0026 Musolesi, M. (2024). Creativity and Machine Learning: A Survey. ACM Computing Surveys, 56(11), Article 283, 1–41. DOI:10.1145/3664595.\n\n5. Zhao, Y., Zhang, R., Li, W., \u0026 Li, L. (2025). Assessing and Understanding Creativity in Large Language Models. Machine Intelligence Researc verflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e\u003cstrong style=\"font-weight: 700;\"\u003e参考文献\u003c/strong\u003e\u003c/span\u003e","payload":{"fold":1,"lines":"36,37","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e创造性机器智能（CMI）\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"创造性机器智能（CMI）\" data-note-id=\"note:sha256:12ed57ed575240fd1fe1209f569a18e577601628007ff38fad2ca064dae4273a\" title=\"点击查看完整注释\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"创造性机器智能cmi\"\u003e创造性机器智能（CMI）\u003c/h1\u003e\n\u003cp\u003e\u003cem\u003e【最终投稿修订稿】\u003c/em\u003e\u003cbr\u003e\u003cem\u003e稿件编号：CMI-2026-0821\u003c/em\u003e\u003c/p\u003e\n\u003ch3 id=\"摘要\"\u003e\u003cstrong\u003e摘要\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e本文提出创造性机器智能（Creative Machine Intelligence, CMI），一套用于形式化与系统化自动化创造性探究的理论框架。CMI的核心范式转变在于：人类定义初始目标与最终价值判断，机器主导全部中间环节的推理、迭代、验证与生成。机器创造性产出沿“客观约束强度”谱系分为四类——工程发明、科学发现、新颖分析、文学艺术创作——并可扩展至其他形式。本文厘清CMI与传统机器学习、独立大语言模型及现有智能体系统的边界，并通过与Google Co-Scientist、AI Scientist-v2等代表性系统做多维度对比，明确CMI的增量贡献在于将逻辑校验、跨域约束管理、双通道新颖性核验与多类型成果分类整合为统一的十一模块闭环架构。此外，本文定义机器创造力可量化演化路径，使用人类干预频次、中间修正比例与目标模糊度阈值作为理论指标，论证标准化创造任务下机器自主性持续提升的趋势，同时保留人类在方向定义与规范性价值判断上的位置。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e关键词：\u003c/strong\u003e创造性机器智能；机器主导创造力；十一模块闭环架构；自动化创造性探究；机器主导的中间流程自动化\u003c/p\u003e\n\u003ch2 id=\"1-引言\"\u003e\u003cstrong\u003e1 引言\u003c/strong\u003e\u003c/h2\u003e\n\u003cp\u003e当前人工智能研究主要聚焦模式拟合、文本生成以及面向特定任务的智能体助手。现有的AI创造能力呈碎片化分布，缺少统一的定义框架、标准化创造流程、完备的验证机制，也缺少对不同类型创造性产出的统一分类体系。\u003c/p\u003e\n\u003cp\u003e传统人工智能范式遵循人类主导、机器辅助模式，整个创造流程需要人类频繁提示、中间修正与持续交互。各类现有智能体大多执行外部给定目标，并不以完整、可核验的创造性探究闭环作为自身底层架构。\u003c/p\u003e\n\u003cp\u003e计算创造力（Computational Creativity）领域自20世纪90年代以来积累了大量研究成果，Wiggins（2006）提出的FACE框架从熟悉度、新颖性、评价与表达维度对创造系统进行刻画，为机器创造力评估提供早期理论基础。在自动化科学发现方向，自King等人（2004）的Robot Scientist开始，该领域历经二十余年发展，已经实现实验闭环、假设自动生成等能力。近年来，Google Co-Scientist（Gottweis et al., 2026）与AI Scientist-v2（Yamada et al., 2025）实现端到端的科学发现流水线，标志该领域由概念验证走向工程集成阶段。\u003c/p\u003e\n\u003cp\u003e然而，现有系统仍存在三方面突出局限：（1）验证机制单一，多数系统仅依靠文献检索评估新颖性，缺少独立显式逻辑校验与多模态实证验证链路；（2）创造能力碎片化，科学发现、工程发明、文艺创作分属不同系统，缺少统一的理论框架；（3）自主性缺少标准化度量，“自动化”“自主创造”缺少可操作定义，难以横向对比不同系统。CMI正是针对上述缺口提出。\u003c/p\u003e\n\u003cp\u003e目前尚无理论系统阐述机器如何完成严谨、可核验的完整创造性探究，同时覆盖分析、发现、发明、文艺创作。为弥补该空白，本文建立创造性机器智能CMI框架，将分散的AI创造能力整合为自洽的创造闭环，形式化完整探究流程，并定义朝向更高机器自主性、更低人工介入的演化路径。\u003c/p\u003e\n\u003ch2 id=\"2-cmi的核心定义\"\u003e\u003cstrong\u003e2 CMI的核心定义\u003c/strong\u003e\u003c/h2\u003e\n\u003ch3 id=\"21-创造性机器智能的定义\"\u003e\u003cstrong\u003e2.1 创造性机器智能的定义\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e创造性机器智能（CMI）是一套以机器为主体的创造性探究过程系统，在人类初始约束与最终监督之下执行标准化、可验证、可追溯、可演化的创造流程。\u003c/p\u003e\n\u003cp\u003eCMI实现范式层级划分：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eL1：方向定义层级，创造任务的根本出发点，该层级始终由人类掌握；\u003c/li\u003e\n\u003cli\u003eL2：中间推理与迭代层级，机器主导完成生成、批判、校验、迭代；当前状态为机器主导的中间流程自动化，部分节点仍需要人工反馈介入；\u003c/li\u003e\n\u003cli\u003eL3：最终判断层级，规范性、价值敏感类判断保留人类裁决；事实性判断可逐步移交机器处理。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e定义1：“机器主导”特指L2中间推理迭代层级的控制权归属，并不否定L1与L3层级的人工参与。\u003c/p\u003e\n\u003cp\u003eCMI的创造性探究过程是动态连续过程，而非二元开关。机器自主占比逐步提升，人类介入频次逐步下降。\u003c/p\u003e\n\u003ch3 id=\"22-cmi的创造性输出功能域\"\u003e\u003cstrong\u003e2.2 CMI的创造性输出功能域\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003eCMI的创造性产出沿客观约束强度单一谱系排布，从约束最强到约束最弱，下面为四类典型示例，同时可扩展至其他创造形式：\u003c/p\u003e\n\u003ch4 id=\"1-工程发明约束最强\"\u003e\u003cstrong\u003e1. 工程发明（约束最强）\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e受物理定律、材料属性、工程规范、法规标准及成本约束形成的全新人工解决方案，包含技术方案、机械设计、工艺设计与建筑设计。验证方式：物理仿真+专利-现有技术校验+工程合规检查。\u003c/p\u003e\n\u003ch4 id=\"2-科学发现\"\u003e\u003cstrong\u003e2. 科学发现\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e受自然规律约束的客观知识增量，包含尚未被观测的机制、因果关系、结构属性以及数学定理。本体论上，科学发现回答“世界是怎样的”；工程发明回答“世界可以如何被改造”。验证方式：实验检验或形式化证明。\u003c/p\u003e\n\u003ch4 id=\"3-新颖分析\"\u003e\u003cstrong\u003e3. 新颖分析\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e针对已有现象、理论或数据集提出全新解释框架、分类体系或者关联关系。新颖分析属于跨域元能力，可以服务于科学发现或者工程发明，但本身不强制实证，仅要求逻辑自洽，解释力优于已有框架。\u003c/p\u003e\n\u003ch4 id=\"4-文学艺术创作约束最弱\"\u003e\u003cstrong\u003e4. 文学艺术创作（约束最弱）\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e受体裁惯例、叙事逻辑、审美传统引导的主观表达产出，包括诗歌、小说、戏剧剧本、音乐文本。艺术创作经常出现突破体裁惯例的规则打破行为；该行为由模块5异构双智能体批判控制器识别，最终接纳与否交由人类规范性判断。艺术产出不接入模块9严格验证网关，仅执行内部风格一致性检查。\u003c/p\u003e\n\u003cp\u003e四类为典型示例，类别之间不存在绝对割裂边界。例如科幻作品同时属于艺术创作与新颖分析，建筑设计处于发明与艺术交叉地带。CMI成果分类器依据客观约束-主观表达权重做连续谱系归类，而非非此即彼二元划分。\u003c/p\u003e\n\u003ch2 id=\"3-cmi与现有人工智能体系的对比\"\u003e\u003cstrong\u003e3 CMI与现有人工智能体系的对比\u003c/strong\u003e\u003c/h2\u003e\n\u003ch3 id=\"31-与机器学习的对比\"\u003e\u003cstrong\u003e3.1 与机器学习的对比\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e机器学习本质执行非线性拟合与模式归纳，复现已有数据分布，无法原生生成经过多环节校验的全新创造性产出，缺少探究闭环、批判迭代与多层级新颖性核验链路。\u003c/p\u003e\n\u003cp\u003eCMI不以模式拟合为目标，目标是编排完整的创造性探究过程，完成构想生成、多层校验、迭代演化到产出。\u003c/p\u003e\n\u003ch3 id=\"32-与独立大语言模型的对比\"\u003e\u003cstrong\u003e3.2 与独立大语言模型的对比\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e大语言模型仅作为CMI内部组件（模块2学习基座）。独立大语言模型缺少如下关键组件：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e独立的显式逻辑校验链路\u003c/li\u003e\n\u003cli\u003e跨领域约束管理机制\u003c/li\u003e\n\u003cli\u003e文献、专利双通道新颖性核验\u003c/li\u003e\n\u003cli\u003e双智能体批判迭代回路\u003c/li\u003e\n\u003cli\u003e完整可追溯记忆系统\u003c/li\u003e\n\u003cli\u003e分层的多类型产出分类\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e大语言模型输出仅为文本生成；CMI输出经过多层校验的创造性产出。\u003c/p\u003e\n\u003ch3 id=\"33-与现有智能体agent系统的对比\"\u003e\u003cstrong\u003e3.3 与现有智能体Agent系统的对比\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e现有大模型智能体系统以完成外部指定任务为核心，任务目标、边界大多来自人类外部输入。智能体侧重规划、工具调用、任务达成，并不把完整创造性探究闭环作为底层原生架构。\u003c/p\u003e\n\u003cp\u003e多数通用智能体缺少专门新颖性核验链路、独立形式逻辑校验、双智能体批判迭代，也缺少面向多类型创造产出的统一分类框架。智能体可以嵌入CMI作为内部组件，但通用任务智能体不等同CMI。\u003c/p\u003e\n\u003cp\u003eCMI核心不是完成外部指派任务，而是运行完整创造性探究过程；创造方向可以在迭代中发生演化，不完全锁死人类预先给定任务目标。\u003c/p\u003e\n\u003ch3 id=\"34-与代表性创造性系统的对比\"\u003e\u003cstrong\u003e3.4 与代表性创造性系统的对比\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e为明确CMI定位及其增量贡献，表1将CMI与五类代表性系统做多维度对比：传统机器学习、独立大语言模型、通用智能体AutoGPT、Google Co-Scientist、AI Scientist-v2。\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e表1 CMI与代表性系统多维度对比\u003c/em\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e维度\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e传统ML\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e独立LLM\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e通用Agent\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eCo-Scientist\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eAI Scientist-v2\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eCMI（本文框架）\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e完整创造性探究闭环\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e机器主导中间推理\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e独立显式逻辑校验模块\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e跨领域约束管理\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多类型创造产出分类\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗（仅限科学）\u003c/td\u003e\n\u003ctd\u003e✗（仅限科学）\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e双通道新颖性核验（文献+专利）\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗（仅文献）\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e完整可追溯记忆\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e异构双智能体批判迭代机制\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e标准化多模态输出生成\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cem\u003e注：本表格中CMI列代表理论框架设计能力，不代表已工程实现。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e由表1可见，已有系统已经实现部分闭环能力。CMI增量贡献并非创造某一个全新底层技术，而是把分散存在的各类能力，系统化组织进一套统一闭环理论架构。\u003c/p\u003e\n\u003ch2 id=\"4-cmi十一模块架构\"\u003e\u003cstrong\u003e4 CMI十一模块架构\u003c/strong\u003e\u003c/h2\u003e\n\u003ch3 id=\"41-系统高层数据流\"\u003e\u003cstrong\u003e4.1 系统高层数据流\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003eCMI十一模块遵循：方向输入 → 构想生成 → 逻辑约束校验 → 批判迭代 → 新颖性核验 → 记忆留存 → 分层验证 → 成果归类 → 多模态输出主数据流，包含两条反馈回路：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e内反馈回路：模块5批判控制器驱动模块2-4完成构想修订迭代；\u003c/li\u003e\n\u003cli\u003e外反馈回路：模块6、7新颖性核验失败结果回传给模块5，触发新一轮批判重生成。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg alt=\"image\" data-dmnd-asset-id=\"asset:sha256:97939cfb732965171430d513c22032b3ad55a657a17d179e7911d4793e3ba58b\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e图1 CMI十一模块架构数据流示意图\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e虚线人工介入点：模块1初始输入；模块10之后可插入人类最终判断环节。\u003c/p\u003e\n\u003ch3 id=\"42-模块间接口数据规范\"\u003e\u003cstrong\u003e4.2 模块间接口数据规范\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e模块之间传递三类标准化结构化对象：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e候选构想对象：{内容文本，可选形式化表示，时间戳，来源模块标记}\u003c/li\u003e\n\u003cli\u003e校验回执对象：{通过 / 部分通过 / 不通过；失败原因；修订建议；置信度评分}\u003c/li\u003e\n\u003cli\u003e记忆条目对象：{时间戳，触发模块，操作类型，输入快照，输出快照，可选人类反馈记录}\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e说明：本文为立场论文，给出高层接口定义；底层序列化协议、完整工程实现属于后续研究工作。\u003c/p\u003e\n\u003ch3 id=\"43-各模块功能描述\"\u003e\u003cstrong\u003e4.3 各模块功能描述\u003c/strong\u003e\u003c/h3\u003e\n\u003ch4 id=\"1-人类约束与方向交互接口\"\u003e\u003cstrong\u003e1. 人类约束与方向交互接口\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e接收人类初始创造目标、约束条件、边界，同时提供人类最终判断的接入入口。\u003c/p\u003e\n\u003ch4 id=\"2-学习基座模块\"\u003e\u003cstrong\u003e2. 学习基座模块\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e生成候选构想、关联领域素材；可基于大语言模型等现有技术实现，是CMI的生成组件。\u003c/p\u003e\n\u003ch4 id=\"3-显式逻辑引擎\"\u003e\u003cstrong\u003e3. 显式逻辑引擎\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e完成形式逻辑一致性检查、充分必要条件核验。候选实现方案包含Lean/Coq证明助手、SAT求解器、各类神经符号推理系统。\u003c/p\u003e\n\u003ch4 id=\"4-结构化领域知识与跨域约束管理器\"\u003e\u003cstrong\u003e4. 结构化领域知识与跨域约束管理器\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e存储各领域公理、规范、边界条件，管控跨领域迁移过程中的约束传递。\u003c/p\u003e\n\u003ch4 id=\"5-异构双智能体批判控制器\"\u003e\u003cstrong\u003e5. 异构双智能体批判控制器\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e核心迭代单元；对候选构想做批判、识别矛盾、识别规则突破，输出修订建议，驱动循环迭代。艺术创作中体裁规则打破行为由本模块识别。\u003c/p\u003e\n\u003ch4 id=\"6-科学文献前沿解析模块\"\u003e\u003cstrong\u003e6. 科学文献前沿解析模块\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e检索、解析已有学术文献，做科学层面新颖性评估。\u003c/p\u003e\n\u003ch4 id=\"7-专利-现有技术校验模块\"\u003e\u003cstrong\u003e7. 专利-现有技术校验模块\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e针对技术类产出，检索已有专利与公开技术方案，完成工程层面新颖性评估。\u003c/p\u003e\n\u003ch4 id=\"8-可追溯探究记忆模块\"\u003e\u003cstrong\u003e8. 可追溯探究记忆模块\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e完整记录全部构想、校验回执、迭代过程，保存记忆条目对象，留存完整探究历史。\u003c/p\u003e\n\u003ch4 id=\"9-形式化与实证验证网关\"\u003e\u003cstrong\u003e9. 形式化与实证验证网关\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e分层执行验证，不同功能域采用差异化验证策略：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e数学/逻辑发现：对接Lean、Coq等形式证明工具，生成证明脚本或定位反例；\u003c/li\u003e\n\u003cli\u003e科学假设：生成实验方案，对接仿真或自动化实验环境，接收结果判定；\u003c/li\u003e\n\u003cli\u003e工程发明：调用有限元、CFD等仿真工具完成性能、安全仿真；\u003c/li\u003e\n\u003cli\u003e新颖分析：不强制实证，直接流转至6-7新颖性核验链路；\u003c/li\u003e\n\u003cli\u003e文学艺术创作：跳过本网关，直接流向模块11输出。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCMI定位为验证流程编排器，不替代各领域专用验证工具。部分产出暂无自动化验证手段时，保留人类验证备用通道。\u003c/p\u003e\n\u003ch4 id=\"10-成果分类器\"\u003e\u003cstrong\u003e10. 成果分类器\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e依据客观约束-主观表达权重，将经过校验的产出归入约束强度谱系，兼容非典型交叉类创造产出。\u003c/p\u003e\n\u003ch4 id=\"11-结构化多模态文稿生成模块\"\u003e\u003cstrong\u003e11. 结构化多模态文稿生成模块\u003c/strong\u003e\u003c/h4\u003e\n\u003cp\u003e输出标准化交付物：论文、专利文本、设计文档、文学文本等。本模块仅做表达格式化，不产生新的创造性构想。\u003c/p\u003e\n\u003ch2 id=\"5-cmi系统演化路径\"\u003e\u003cstrong\u003e5 CMI系统演化路径\u003c/strong\u003e\u003c/h2\u003e\n\u003ch3 id=\"51-自主性度量指标\"\u003e\u003cstrong\u003e5.1 自主性度量指标\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e本文定义三组理论度量指标，用于刻画CMI演化阶段；指标的实测标定属于未来研究工作。\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e表2 CMI自主性度量指标\u003c/em\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e定义\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e半自动阶段参考值\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e远期演化目标\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e人类干预频次 HIF\u003c/td\u003e\n\u003ctd\u003e每千字创造性产出对应的人工输入次数\u003c/td\u003e\n\u003ctd\u003e5-10次\u003c/td\u003e\n\u003ctd\u003e\u0026lt;1次\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e中间节点人工修正比例 HCR\u003c/td\u003e\n\u003ctd\u003e关键迭代节点中人工介入修正占比\u003c/td\u003e\n\u003ctd\u003e30%-50%\u003c/td\u003e\n\u003ctd\u003e\u0026lt;5%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e目标模糊度阈值 FAT\u003c/td\u003e\n\u003ctd\u003e初始输入可接受的模糊等级（1-10）\u003c/td\u003e\n\u003ctd\u003e3级（需要较清晰方向）\u003c/td\u003e\n\u003ctd\u003e8级（仅提供宽泛领域）\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e演化过程区分两类判断：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e规范性判断：伦理、审美、社会价值，保留人类裁决；\u003c/li\u003e\n\u003cli\u003e事实性判断：假设证伪、方案合规性等，可逐步向机器移交。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"52-过去人类主导创造范式\"\u003e\u003cstrong\u003e5.2 过去：人类主导创造范式\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e全部分析、构想、校验、迭代高度依赖人类；AI仅承担辅助工具角色，人机交互频次高。\u003c/p\u003e\n\u003ch3 id=\"53-当前机器主导中间流程自动化\"\u003e\u003cstrong\u003e5.3 当前：机器主导中间流程自动化\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e人类给出初始方向，机器完成大部分生成、批判、校验迭代；关键节点仍然保留人工介入。\u003c/p\u003e\n\u003ch3 id=\"54-未来标准化创造任务的高度自主\"\u003e\u003cstrong\u003e5.4 未来：标准化创造任务的高度自主\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e在可形式化的标准化创造任务下，机器自主性持续提升。但人类仍然保留L1层级方向定义，以及L3层级规范性价值判断。对于本论断存在对立哲学立场，本文采纳该立场，不宣称其为唯一结论，相关批评观点参见Anonymous（2026）[15]。\u003c/p\u003e\n\u003ch2 id=\"6-讨论\"\u003e\u003cstrong\u003e6 讨论\u003c/strong\u003e\u003c/h2\u003e\n\u003cp\u003e本文把分散的机器创造能力整合进一套自洽理论体系，厘清纯生成输出、通用智能体任务执行与完整创造性探究过程之间的边界。以客观约束强度谱系，举例给出机器创造的四类典型功能域，同时承认还存在大量交叉、其他类型的创造产出。\u003c/p\u003e\n\u003cp\u003e十一模块闭环架构，将CMI与模式生成模型、任务导向通用智能体区分开来。CMI增量不是提出全新底层算法，而是把已经分散出现的各类能力，组织成统一闭环框架，覆盖逻辑校验、双通道新颖性核验、多类型创造分类。\u003c/p\u003e\n\u003cp\u003eCMI也存在明确边界：它是理论编排框架，不等于开箱即用工程系统；部分创造产出的全自动验证目前无法实现，保留人工备用通道。机器创造力不是简单生成文本，而是一整套人类监督之下完整、可校验、可追溯、可演化的探究过程，实现从机器辅助创造向机器主导中间流程创造的过渡，整个提升过程是渐进可控。\u003c/p\u003e\n\u003ch2 id=\"参考文献\"\u003e\u003cstrong\u003e参考文献\u003c/strong\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eBoden, M. A. (2004). The Creative Mind: Myths and Mechanisms. Routledge.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eWiggins, G. A. (2006). A Preliminary Framework for Description, Analysis and Comparison of Creative Systems. Knowledge-Based Systems, 19(7), 449–458. DOI:10.1016/j.knosys.2006.04.009.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eWiggins, G. A. (2006). Searching for Computational Creativity. New Generation Computing, 24(3), 209–222. DOI:10.1007/BF03037332.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eFranceschelli, G., \u0026amp; Musolesi, M. (2024). Creativity and Machine Learning: A Survey. ACM Computing Surveys, 56(11), Article 283, 1–41. DOI:10.1145/3664595.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eZhao, Y., Zhang, R., Li, W., \u0026amp; Li, L. (2025). Assessing and Understanding Creativity in Large Language Models. Machine Intelligence Research, 22(3), 417–436. DOI:10.1007/s11633-025-1546-4.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eRuan, K., Wang, X., Hong, J., Wang, P., Liu, Y., \u0026amp; Sun, H. (2026). Evaluating LLMs' Divergent Thinking Capabilities for Scientific Idea Generation with Minimal Context. Nature Communications, 17, 3625. DOI:10.1038/s41467-026-70245-1.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eLin, Y-C., Chen, K-C., Li, Z-Y., Wu, Tzu-Heng, Wu, Tzu-Hsuan, Chen, K-Y., Lee, H-Y., \u0026amp; Chen, Y-N. (2025). Creativity in LLM-based Multi-Agent Systems: A Survey. arXiv:2505.21116.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eWang, L., Ma, C., Feng, X., Zhang, Z., Yang, H., Zhang, J., Chen, Z., Tang, J., Chen, X., Lin, Y., Zhao, W. X., Wei, Z., \u0026amp; Wen, J.-R. (2024). A Survey on Large Language Model based Autonomous Agents. Frontiers of Computer Science, 18(6), u003e\u003cp\u003eLu, C., Lu, C., Lange, R. T., Yamada, Y., Hu, S., Foerster, J., Ha, D., \u0026amp; Clune, J. (2026). Towards end-to-end automation of AI research. Nature, 651, 914–919. DOI:10.1038/s41586-026-10265-5.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eYamada, Y., Lange, R. T., Lu, C., Hu, S., Lu, C., Foerster, J., Clune, J., \u0026amp; Ha, D. (2025). The AI Scientist-v2: Workshop-Level Automated Scientific Discovery via Agentic Tree Search. arXiv:2504.08066.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eAnonymous. (2026). Why AI cannot do good science without humans. Nature, 653, 650. DOI:10.1038/d41586-026-01551-3.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:00783cc512bc7cf33f2179775c2b3bc2069bfa537cd29fb4e8091fe9537c4baa":{"html":"\u003cp\u003e接收人类初始创造目标、约束条件、边界，同时提供人类最终判断的接入入口。\u003c/p\u003e\n","kind":"html","rawMarkdown":"接收人类初始创造目标、约束条件、边界，同时提供人类最终判断的接入入口。","sourceFormat":"markdown"},"note:sha256:04672a6a2618e0d50cf98516fb0b28bc205238e3941ea06b5aa67d5759a9ffd7":{"html":"\u003cp\u003e存储各领域公理、规范、边界条件，管控跨领域迁移过程中的约束传递。\u003c/p\u003e\n","kind":"html","rawMarkdown":"存储各领域公理、规范、边界条件，管控跨领域迁移过程中的约束传递。","sourceFormat":"markdown"},"note:sha256:0fc9238bdd3fc275a33f45eff1446ddb9594beaec4492528d2e2e6de56683742":{"html":"\u003cp\u003eCMI的创造性产出沿客观约束强度单一谱系排布，从约束最强到约束最弱，下面为四类典型示例，同时可扩展至其他创造形式：\u003c/p\u003e\n","kind":"html","rawMarkdown":"CMI的创造性产出沿客观约束强度单一谱系排布，从约束最强到约束最弱，下面为四类典型示例，同时可扩展至其他创造形式：","sourceFormat":"markdown"},"note:sha256:12ed57ed575240fd1fe1209f569a18e577601628007ff38fad2ca064dae4273a":{"html":"\u003cp\u003e\u003cem\u003e【最终投稿修订稿】\u003c/em\u003e\u003cbr\u003e\u003cem\u003e稿件编号：CMI-2026-0821\u003c/em\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"*【最终投稿修订稿】*\n*稿件编号：CMI-2026-0821*","sourceFormat":"markdown"},"note:sha256:16dfa581e015e77153015ce28f8eb9ab2384069657b0e9ab845f35c687c79526":{"html":"\u003cp\u003e为明确CMI定位及其增量贡献，表1将CMI与五类代表性系统做多维度对比：传统机器学习、独立大语言模型、通用智能体AutoGPT、Google Co-Scientist、AI Scientist-v2。\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e表1 CMI与代表性系统多维度对比\u003c/em\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e维度\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e传统ML\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e独立LLM\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e通用Agent\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eCo-Scientist\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eAI Scientist-v2\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003eCMI（本文框架）\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e完整创造性探究闭环\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e机器主导中间推理\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e独立显式逻辑校验模块\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e跨领域约束管理\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多类型创造产出分类\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗（仅限科学）\u003c/td\u003e\n\u003ctd\u003e✗（仅限科学）\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e双通道新颖性核验（文献+专利）\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗（仅文献）\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e完整可追溯记忆\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e异构双智能体批判迭代机制\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e标准化多模态输出生成\u003c/td\u003e\n\u003ctd\u003e✗\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e部分\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003ctd\u003e✓\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cem\u003e注：本表格中CMI列代表理论框架设计能力，不代表已工程实现。\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e由表1可见，已有系统已经实现部分闭环能力。CMI增量贡献并非创造某一个全新底层技术，而是把分散存在的各类能力，系统化组织进一套统一闭环理论架构。\u003c/p\u003e\n","kind":"html","rawMarkdown":"为明确CMI定位及其增量贡献，表1将CMI与五类代表性系统做多维度对比：传统机器学习、独立大语言模型、通用智能体AutoGPT、Google Co-Scientist、AI Scientist-v2。\n\n*表1 CMI与代表性系统多维度对比*\n\n| **维度** | **传统ML** | **独立LLM** | **通用Agent** | **Co-Scientist** | **AI Scientist-v2** | **CMI（本文框架）** |\n| --- | --- | --- | --- | --- | --- | --- |\n| 完整创造性探究闭环 | ✗ | ✗ | ✗ | ✓ | ✓ | ✓ |\n| 机器主导中间推理 | ✗ | ✗ | 部分 | ✓ | ✓ | ✓ |\n| 独立显式逻辑校验模块 | ✗ | ✗ | ✗ | ✗ | ✗ | ✓ |\n| 跨领域约束管理 | ✗ | ✗ | ✗ | 部分 | ✗ | ✓ |\n| 多类型创造产出分类 | ✗ | ✗ | ✗ | ✗（仅限科学） | ✗（仅限科学） | ✓ |\n| 双通道新颖性核验（文献+专利） | ✗ | ✗ | ✗ | ✗（仅文献） | 部分 | ✓ |\n| 完整可追溯记忆 | ✗ | ✗ | 部分 | ✓ | ✓ | ✓ |\n| 异构双智能体批判迭代机制 | ✗ | ✗ | 部分 | ✓ | ✓ | ✓ |\n| 标准化多模态输出生成 | ✗ | 部分 | 部分 | ✓ | ✓ | ✓ |\n\n*注：本表格中CMI列代表理论框架设计能力，不代表已工程实现。*\n\n由表1可见，已有系统已经实现部分闭环能力。CMI增量贡献并非创造某一个全新底层技术，而是把分散存在的各类能力，系统化组织进一套统一闭环理论架构。","sourceFormat":"markdown"},"note:sha256:1879af507e1681ebab81ae3ea2d44e337a8d424238b2f234dd42f589f009c8e0":{"html":"\u003cp\u003e全部分析、构想、校验、迭代高度依赖人类；AI仅承担辅助工具角色，人机交互频次高。\u003c/p\u003e\n","kind":"html","rawMarkdown":"全部分析、构想、校验、迭代高度依赖人类；AI仅承担辅助工具角色，人机交互频次高。","sourceFormat":"markdown"},"note:sha256:24f8b6e16f398ca22bf7538c62d30245c19f7ca104e68569092b9e705a907714":{"html":"\u003cp\u003e当前人工智能研究主要聚焦模式拟合、文本生成以及面向特定任务的智能体助手。现有的AI创造能力呈碎片化分布，缺少统一的定义框架、标准化创造流程、完备的验证机制，也缺少对不同类型创造性产出的统一分类体系。\u003c/p\u003e\n\u003cp\u003e传统人工智能范式遵循人类主导、机器辅助模式，整个创造流程需要人类频繁提示、中间修正与持续交互。各类现有智能体大多执行外部给定目标，并不以完整、可核验的创造性探究闭环作为自身底层架构。\u003c/p\u003e\n\u003cp\u003e计算创造力（Computational Creativity）领域自20世纪90年代以来积累了大量研究成果，Wiggins（2006）提出的FACE框架从熟悉度、新颖性、评价与表达维度对创造系统进行刻画，为机器创造力评估提供早期理论基础。在自动化科学发现方向，自King等人（2004）的Robot Scientist开始，该领域历经二十余年发展，已经实现实验闭环、假设自动生成等能力。近年来，Google Co-Scientist（Gottweis et al., 2026）与AI Scientist-v2（Yamada et al., 2025）实现端到端的科学发现流水线，标志该领域由概念验证走向工程集成阶段。\u003c/p\u003e\n\u003cp\u003e然而，现有系统仍存在三方面突出局限：（1）验证机制单一，多数系统仅依靠文献检索评估新颖性，缺少独立显式逻辑校验与多模态实证验证链路；（2）创造能力碎片化，科学发现、工程发明、文艺创作分属不同系统，缺少统一的理论框架；（3）自主性缺少标准化度量，“自动化”“自主创造”缺少可操作定义，难以横向对比不同系统。CMI正是针对上述缺口提出。\u003c/p\u003e\n\u003cp\u003e目前尚无理论系统阐述机器如何完成严谨、可核验的完整创造性探究，同时覆盖分析、发现、发明、文艺创作。为弥补该空白，本文建立创造性机器智能CMI框架，将分散的AI创造能力整合为自洽的创造闭环，形式化完整探究流程，并定义朝向更高机器自主性、更低人工介入的演化路径。\u003c/p\u003e\n","kind":"html","rawMarkdown":"当前人工智能研究主要聚焦模式拟合、文本生成以及面向特定任务的智能体助手。现有的AI创造能力呈碎片化分布，缺少统一的定义框架、标准化创造流程、完备的验证机制，也缺少对不同类型创造性产出的统一分类体系。\n\n传统人工智能范式遵循人类主导、机器辅助模式，整个创造流程需要人类频繁提示、中间修正与持续交互。各类现有智能体大多执行外部给定目标，并不以完整、可核验的创造性探究闭环作为自身底层架构。\n\n计算创造力（Computational Creativity）领域自20世纪90年代以来积累了大量研究成果，Wiggins（2006）提出的FACE框架从熟悉度、新颖性、评价与表达维度对创造系统进行刻画，为机器创造力评估提供早期理论基础。在自动化科学发现方向，自King等人（2004）的Robot Scientist开始，该领域历经二十余年发展，已经实现实验闭环、假设自动生成等能力。近年来，Google Co-Scientist（Gottweis et al., 2026）与AI Scientist-v2（Yamada et al., 2025）实现端到端的科学发现流水线，标志该领域由概念验证走向工程集成阶段。\n\n然而，现有系统仍存在三方面突出局限：（1）验证机制单一，多数系统仅依靠文献检索评估新颖性，缺少独立显式逻辑校验与多模态实证验证链路；（2）创造能力碎片化，科学发现、工程发明、文艺创作分属不同系统，缺少统一的理论框架；（3）自主性缺少标准化度量，“自动化”“自主创造”缺少可操作定义，难以横向对比不同系统。CMI正是针对上述缺口提出。\n\n目前尚无理论系统阐述机器如何完成严谨、可核验的完整创造性探究，同时覆盖分析、发现、发明、文艺创作。为弥补该空白，本文建立创造性机器智能CMI框架，将分散的AI创造能力整合为自洽的创造闭环，形式化完整探究流程，并定义朝向更高机器自主性、更低人工介入的演化路径。","sourceFormat":"markdown"},"note:sha256:2b40fe0ac5180d0aa707adc95081de984a4b073e3740626d8335b866df94ffa6":{"html":"\u003cp\u003e输出标准化交付物：论文、专利文本、设计文档、文学文本等。本模块仅做表达格式化，不产生新的创造性构想。\u003c/p\u003e\n","kind":"html","rawMarkdown":"输出标准化交付物：论文、专利文本、设计文档、文学文本等。本模块仅做表达格式化，不产生新的创造性构想。","sourceFormat":"markdown"},"note:sha256:384b40114e3f2f07398b60c38702a5097e4d95ab83301bc63989e5af2b16c237":{"html":"\u003cp\u003e完成形式逻辑一致性检查、充分必要条件核验。候选实现方案包含Lean/Coq证明助手、SAT求解器、各类神经符号推理系统。\u003c/p\u003e\n","kind":"html","rawMarkdown":"完成形式逻辑一致性检查、充分必要条件核验。候选实现方案包含Lean/Coq证明助手、SAT求解器、各类神经符号推理系统。","sourceFormat":"markdown"},"note:sha256:43545c400064c2bb410ab8bd6fc6edc6afdfef050424d3ca4837a5ccbe102da7":{"blocks":[{"children":[],"kind":"leaf","title":"本文定义三组理论度量指标，用于刻画CMI演化阶段；指标的实测标定属于未来研究工作。"},{"children":[],"kind":"leaf","title":"表2 CMI自主性度量指标"},{"children":[],"kind":"leaf","title":"| 指标 | 定义 | 半自动阶段参考值 | 远期演化目标 | | --- | --- | --- | --- | | 人类干预频次 HIF | 每千字创造性产出对应的人工输入次数 | 5-10次 | \u003c1次 | | 中间节点人工修正比例 HCR | 关键迭代节点中人工介入修正占比 | 30%-50% | \u003c5% | | 目标模糊度阈值 FAT | 初始输入可接受的模糊等级（1-10） | 3级（需要较清晰方向） | 8级（仅提供宽泛领域） |"},{"children":[{"title":"规范性判断：伦理、审美、社会价值，保留人类裁决；"},{"title":"事实性判断：假设证伪、方案合规性等，可逐步向机器移交。"}],"kind":"section","title":"演化过程区分两类判断"}],"html":"\u003cp\u003e本文定义三组理论度量指标，用于刻画CMI演化阶段；指标的实测标定属于未来研究工作。\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e表2 CMI自主性度量指标\u003c/em\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003cstrong\u003e指标\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e定义\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e半自动阶段参考值\u003c/strong\u003e\u003c/th\u003e\n\u003cth\u003e\u003cstrong\u003e远期演化目标\u003c/strong\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e人类干预频次 HIF\u003c/td\u003e\n\u003ctd\u003e每千字创造性产出对应的人工输入次数\u003c/td\u003e\n\u003ctd\u003e5-10次\u003c/td\u003e\n\u003ctd\u003e\u0026lt;1次\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e中间节点人工修正比例 HCR\u003c/td\u003e\n\u003ctd\u003e关键迭代节点中人工介入修正占比\u003c/td\u003e\n\u003ctd\u003e30%-50%\u003c/td\u003e\n\u003ctd\u003e\u0026lt;5%\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e目标模糊度阈值 FAT\u003c/td\u003e\n\u003ctd\u003e初始输入可接受的模糊等级（1-10）\u003c/td\u003e\n\u003ctd\u003e3级（需要较清晰方向）\u003c/td\u003e\n\u003ctd\u003e8级（仅提供宽泛领域）\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e演化过程区分两类判断：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e规范性判断：伦理、审美、社会价值，保留人类裁决；\u003c/li\u003e\n\u003cli\u003e事实性判断：假设证伪、方案合规性等，可逐步向机器移交。\u003c/li\u003e\n\u003c/ul\u003e\n","kind":"structured","rawMarkdown":"本文定义三组理论度量指标，用于刻画CMI演化阶段；指标的实测标定属于未来研究工作。\n\n*表2 CMI自主性度量指标*\n\n| **指标** | **定义** | **半自动阶段参考值** | **远期演化目标** |\n| --- | --- | --- | --- |\n| 人类干预频次 HIF | 每千字创造性产出对应的人工输入次数 | 5-10次 | \u003c1次 |\n| 中间节点人工修正比例 HCR | 关键迭代节点中人工介入修正占比 | 30%-50% | \u003c5% |\n| 目标模糊度阈值 FAT | 初始输入可接受的模糊等级（1-10） | 3级（需要较清晰方向） | 8级（仅提供宽泛领域） |\n\n演化过程区分两类判断：\n\n- 规范性判断：伦理、审美、社会价值，保留人类裁决；\n- 事实性判断：假设证伪、方案合规性等，可逐步向机器移交。","sourceFormat":"markdown"},"note:sha256:490043d6ff0ec01d58f43a97bd271ba32c966ab00a8b0a5660bc0297cd95d370":{"html":"\u003cp\u003e生成候选构想、关联领域素材；可基于大语言模型等现有技术实现，是CMI的生成组件。\u003c/p\u003e\n","kind":"html","rawMarkdown":"生成候选构想、关联领域素材；可基于大语言模型等现有技术实现，是CMI的生成组件。","sourceFormat":"markdown"},"note:sha256:631c1246e7199a8cdf2842ae6c5be9ca1df2f3cf325493c02d1ce69313881c84":{"html":"\u003cp\u003e人类给出初始方向，机器完成大部分生成、批判、校验迭代；关键节点仍然保留人工介入。\u003c/p\u003e\n","kind":"html","rawMarkdown":"人类给出初始方向，机器完成大部分生成、批判、校验迭代；关键节点仍然保留人工介入。","sourceFormat":"markdown"},"note:sha256:6c1193a1ce43f55234964c284bd4cbc2d0be65429b292cef266d7f944fcb6273":{"html":"\u003cp\u003e受自然规律约束的客观知识增量，包含尚未被观测的机制、因果关系、结构属性以及数学定理。本体论上，科学发现回答“世界是怎样的”；工程发明回答“世界可以如何被改造”。验证方式：实验检验或形式化证明。\u003c/p\u003e\n","kind":"html","rawMarkdown":"受自然规律约束的客观知识增量，包含尚未被观测的机制、因果关系、结构属性以及数学定理。本体论上，科学发现回答“世界是怎样的”；工程发明回答“世界可以如何被改造”。验证方式：实验检验或形式化证明。","sourceFormat":"markdown"},"note:sha256:6e7f3e63a36a279ee6937195f69796a3ca35e80bacd01600d2141187fa8a1f81":{"html":"\u003cp\u003e检索、解析已有学术文献，做科学层面新颖性评估。\u003c/p\u003e\n","kind":"html","rawMarkdown":"检索、解析已有学术文献，做科学层面新颖性评估。","sourceFormat":"markdown"},"note:sha256:7d2a933ada30e554e1c5c13ebbd1355df4bc559014cb94e67e13953aa004fb07":{"html":"\u003cp\u003e完整记录全部构想、校验回执、迭代过程，保存记忆条目对象，留存完整探究历史。\u003c/p\u003e\n","kind":"html","rawMarkdown":"完整记录全部构想、校验回执、迭代过程，保存记忆条目对象，留存完整探究历史。","sourceFormat":"markdown"},"note:sha256:8f7c91c9e42f71ddc9c0b80c65c30ddc3902efcdb78540106168772b46f1b5b6":{"html":"\u003cp\u003e受体裁惯例、叙事逻辑、审美传统引导的主观表达产出，包括诗歌、小说、戏剧剧本、音乐文本。艺术创作经常出现突破体裁惯例的规则打破行为；该行为由模块5异构双智能体批判控制器识别，最终接纳与否交由人类规范性判断。艺术产出不接入模块9严格验证网关，仅执行内部风格一致性检查。\u003c/p\u003e\n\u003cp\u003e四类为典型示例，类别之间不存在绝对割裂边界。例如科幻作品同时属于艺术创作与新颖分析，建筑设计处于发明与艺术交叉地带。CMI成果分类器依据客观约束-主观表达权重做连续谱系归类，而非非此即彼二元划分。\u003c/p\u003e\n","kind":"html","rawMarkdown":"受体裁惯例、叙事逻辑、审美传统引导的主观表达产出，包括诗歌、小说、戏剧剧本、音乐文本。艺术创作经常出现突破体裁惯例的规则打破行为；该行为由模块5异构双智能体批判控制器识别，最终接纳与否交由人类规范性判断。艺术产出不接入模块9严格验证网关，仅执行内部风格一致性检查。\n\n四类为典型示例，类别之间不存在绝对割裂边界。例如科幻作品同时属于艺术创作与新颖分析，建筑设计处于发明与艺术交叉地带。CMI成果分类器依据客观约束-主观表达权重做连续谱系归类，而非非此即彼二元划分。","sourceFormat":"markdown"},"note:sha256:9069ccc61e067ae983101cc40bd97736d6606e70507f04096f3788d1be4382d4":{"blocks":[{"children":[],"kind":"leaf","title":"创造性机器智能（CMI）是一套以机器为主体的创造性探究过程系统，在人类初始约束与最终监督之下执行标准化、可验证、可追溯、可演化的创造流程。"},{"children":[{"title":"L1：方向定义层级，创造任务的根本出发点，该层级始终由人类掌握；"},{"title":"L2：中间推理与迭代层级，机器主导完成生成、批判、校验、迭代；当前状态为机器主导的中间流程自动化，部分节点仍需要人工反馈介入；"},{"title":"L3：最终判断层级，规范性、价值敏感类判断保留人类裁决；事实性判断可逐步移交机器处理。"}],"kind":"section","title":"CMI实现范式层级划分"},{"children":[],"kind":"leaf","title":"定义1：“机器主导”特指L2中间推理迭代层级的控制权归属，并不否定L1与L3层级的人工参与。"},{"children":[],"kind":"leaf","title":"CMI的创造性探究过程是动态连续过程，而非二元开关。机器自主占比逐步提升，人类介入频次逐步下降。"}],"html":"\u003cp\u003e创造性机器智能（CMI）是一套以机器为主体的创造性探究过程系统，在人类初始约束与最终监督之下执行标准化、可验证、可追溯、可演化的创造流程。\u003c/p\u003e\n\u003cp\u003eCMI实现范式层级划分：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eL1：方向定义层级，创造任务的根本出发点，该层级始终由人类掌握；\u003c/li\u003e\n\u003cli\u003eL2：中间推理与迭代层级，机器主导完成生成、批判、校验、迭代；当前状态为机器主导的中间流程自动化，部分节点仍需要人工反馈介入；\u003c/li\u003e\n\u003cli\u003eL3：最终判断层级，规范性、价值敏感类判断保留人类裁决；事实性判断可逐步移交机器处理。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e定义1：“机器主导”特指L2中间推理迭代层级的控制权归属，并不否定L1与L3层级的人工参与。\u003c/p\u003e\n\u003cp\u003eCMI的创造性探究过程是动态连续过程，而非二元开关。机器自主占比逐步提升，人类介入频次逐步下降。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"创造性机器智能（CMI）是一套以机器为主体的创造性探究过程系统，在人类初始约束与最终监督之下执行标准化、可验证、可追溯、可演化的创造流程。\n\nCMI实现范式层级划分：\n\n- L1：方向定义层级，创造任务的根本出发点，该层级始终由人类掌握；\n- L2：中间推理与迭代层级，机器主导完成生成、批判、校验、迭代；当前状态为机器主导的中间流程自动化，部分节点仍需要人工反馈介入；\n- L3：最终判断层级，规范性、价值敏感类判断保留人类裁决；事实性判断可逐步移交机器处理。\n\n定义1：“机器主导”特指L2中间推理迭代层级的控制权归属，并不否定L1与L3层级的人工参与。\n\nCMI的创造性探究过程是动态连续过程，而非二元开关。机器自主占比逐步提升，人类介入频次逐步下降。","sourceFormat":"markdown"},"note:sha256:90d441ea30923449b8672721ff1c2b87e8336eb85555ad1bd596dca0f42fda6d":{"blocks":[{"children":[{"title":"独立的显式逻辑校验链路"},{"title":"跨领域约束管理机制"},{"title":"文献、专利双通道新颖性核验"},{"title":"双智能体批判迭代回路"},{"title":"完整可追溯记忆系统"},{"title":"分层的多类型产出分类"}],"kind":"section","title":"大语言模型仅作为CMI内部组件（模块2学习基座）。独立大语言模型缺少如下关键组件"},{"children":[],"kind":"leaf","title":"大语言模型输出仅为文本生成；CMI输出经过多层校验的创造性产出。"}],"html":"\u003cp\u003e大语言模型仅作为CMI内部组件（模块2学习基座）。独立大语言模型缺少如下关键组件：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e独立的显式逻辑校验链路\u003c/li\u003e\n\u003cli\u003e跨领域约束管理机制\u003c/li\u003e\n\u003cli\u003e文献、专利双通道新颖性核验\u003c/li\u003e\n\u003cli\u003e双智能体批判迭代回路\u003c/li\u003e\n\u003cli\u003e完整可追溯记忆系统\u003c/li\u003e\n\u003cli\u003e分层的多类型产出分类\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e大语言模型输出仅为文本生成；CMI输出经过多层校验的创造性产出。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"大语言模型仅作为CMI内部组件（模块2学习基座）。独立大语言模型缺少如下关键组件：\n\n- 独立的显式逻辑校验链路\n- 跨领域约束管理机制\n- 文献、专利双通道新颖性核验\n- 双智能体批判迭代回路\n- 完整可追溯记忆系统\n- 分层的多类型产出分类\n\n大语言模型输出仅为文本生成；CMI输出经过多层校验的创造性产出。","sourceFormat":"markdown"},"note:sha256:9ce8c1ec681b795967871c58abb063da077ddd4007b7b2378496759a7aa2551a":{"html":"\u003cp\u003e针对技术类产出，检索已有专利与公开技术方案，完成工程层面新颖性评估。\u003c/p\u003e\n","kind":"html","rawMarkdown":"针对技术类产出，检索已有专利与公开技术方案，完成工程层面新颖性评估。","sourceFormat":"markdown"},"note:sha256:b4f1cb4e37ee5897ce1dc04be52ee7da1f06d7d944bb1a5ea36c8e9fdb292cd3":{"html":"\u003cp\u003e核心迭代单元；对候选构想做批判、识别矛盾、识别规则突破，输出修订建议，驱动循环迭代。艺术创作中体裁规则打破行为由本模块识别。\u003c/p\u003e\n","kind":"html","rawMarkdown":"核心迭代单元；对候选构想做批判、识别矛盾、识别规则突破，输出修订建议，驱动循环迭代。艺术创作中体裁规则打破行为由本模块识别。","sourceFormat":"markdown"},"note:sha256:b95523a0808f8e9d750e0dc58759aa64f363e07321c56c01034d02251ee34613":{"html":"\u003cp\u003e针对已有现象、理论或数据集提出全新解释框架、分类体系或者关联关系。新颖分析属于跨域元能力，可以服务于科学发现或者工程发明，但本身不强制实证，仅要求逻辑自洽，解释力优于已有框架。\u003c/p\u003e\n","kind":"html","rawMarkdown":"针对已有现象、理论或数据集提出全新解释框架、分类体系或者关联关系。新颖分析属于跨域元能力，可以服务于科学发现或者工程发明，但本身不强制实证，仅要求逻辑自洽，解释力优于已有框架。","sourceFormat":"markdown"},"note:sha256:bc0547d1ce8f23a4ddee5359c0ffa1666c5f21aee9e91ee1f3528e5405aa276a":{"blocks":[{"children":[{"title":"数学/逻辑发现：对接Lean、Coq等形式证明工具，生成证明脚本或定位反例；"},{"title":"科学假设：生成实验方案，对接仿真或自动化实验环境，接收结果判定；"},{"title":"工程发明：调用有限元、CFD等仿真工具完成性能、安全仿真；"},{"title":"新颖分析：不强制实证，直接流转至6-7新颖性核验链路；"},{"title":"文学艺术创作：跳过本网关，直接流向模块11输出。"}],"kind":"section","title":"分层执行验证，不同功能域采用差异化验证策略"},{"children":[],"kind":"leaf","title":"CMI定位为验证流程编排器，不替代各领域专用验证工具。部分产出暂无自动化验证手段时，保留人类验证备用通道。"}],"html":"\u003cp\u003e分层执行验证，不同功能域采用差异化验证策略：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e数学/逻辑发现：对接Lean、Coq等形式证明工具，生成证明脚本或定位反例；\u003c/li\u003e\n\u003cli\u003e科学假设：生成实验方案，对接仿真或自动化实验环境，接收结果判定；\u003c/li\u003e\n\u003cli\u003e工程发明：调用有限元、CFD等仿真工具完成性能、安全仿真；\u003c/li\u003e\n\u003cli\u003e新颖分析：不强制实证，直接流转至6-7新颖性核验链路；\u003c/li\u003e\n\u003cli\u003e文学艺术创作：跳过本网关，直接流向模块11输出。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCMI定位为验证流程编排器，不替代各领域专用验证工具。部分产出暂无自动化验证手段时，保留人类验证备用通道。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"分层执行验证，不同功能域采用差异化验证策略：\n\n- 数学/逻辑发现：对接Lean、Coq等形式证明工具，生成证明脚本或定位反例；\n- 科学假设：生成实验方案，对接仿真或自动化实验环境，接收结果判定；\n- 工程发明：调用有限元、CFD等仿真工具完成性能、安全仿真；\n- 新颖分析：不强制实证，直接流转至6-7新颖性核验链路；\n- 文学艺术创作：跳过本网关，直接流向模块11输出。\n\nCMI定位为验证流程编排器，不替代各领域专用验证工具。部分产出暂无自动化验证手段时，保留人类验证备用通道。","sourceFormat":"markdown"},"note:sha256:bfcb855520dc9f396a71bbe5d72b9fb2a94d8dd90d3f435b31f23bf858430bc1":{"html":"\u003cp\u003e受物理定律、材料属性、工程规范、法规标准及成本约束形成的全新人工解决方案，包含技术方案、机械设计、工艺设计与建筑设计。验证方式：物理仿真+专利-现有技术校验+工程合规检查。\u003c/p\u003e\n","kind":"html","rawMarkdown":"受物理定律、材料属性、工程规范、法规标准及成本约束形成的全新人工解决方案，包含技术方案、机械设计、工艺设计与建筑设计。验证方式：物理仿真+专利-现有技术校验+工程合规检查。","sourceFormat":"markdown"},"note:sha256:bfd477bc4c38ed9512e4c26e643b27903471f3ecdf83f1198b45c880558aa543":{"blocks":[{"children":[{"title":"候选构想对象：{内容文本，可选形式化表示，时间戳，来源模块标记}"},{"title":"校验回执对象：{通过 / 部分通过 / 不通过；失败原因；修订建议；置信度评分}"},{"title":"记忆条目对象：{时间戳，触发模块，操作类型，输入快照，输出快照，可选人类反馈记录}"}],"kind":"section","title":"模块之间传递三类标准化结构化对象"},{"children":[],"kind":"leaf","title":"说明：本文为立场论文，给出高层接口定义；底层序列化协议、完整工程实现属于后续研究工作。"}],"html":"\u003cp\u003e模块之间传递三类标准化结构化对象：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e候选构想对象：{内容文本，可选形式化表示，时间戳，来源模块标记}\u003c/li\u003e\n\u003cli\u003e校验回执对象：{通过 / 部分通过 / 不通过；失败原因；修订建议；置信度评分}\u003c/li\u003e\n\u003cli\u003e记忆条目对象：{时间戳，触发模块，操作类型，输入快照，输出快照，可选人类反馈记录}\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e说明：本文为立场论文，给出高层接口定义；底层序列化协议、完整工程实现属于后续研究工作。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"模块之间传递三类标准化结构化对象：\n\n- 候选构想对象：{内容文本，可选形式化表示，时间戳，来源模块标记}\n- 校验回执对象：{通过 / 部分通过 / 不通过；失败原因；修订建议；置信度评分}\n- 记忆条目对象：{时间戳，触发模块，操作类型，输入快照，输出快照，可选人类反馈记录}\n\n说明：本文为立场论文，给出高层接口定义；底层序列化协议、完整工程实现属于后续研究工作。","sourceFormat":"markdown"},"note:sha256:c56a3756402559a28b18002a2ef7270cbd6eb131acf5172c57aa4885323c3141":{"blocks":[{"bodyBlocks":[{"blockType":"image","kind":"markdown","raw":"\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"blob:capacitor://localhost/56847d6a-8ca4-4762-b17b-18fd1c86586a\" alt=\"image\" /\u003e\u003c/div\u003e"}],"children":[{"title":"内反馈回路：模块5批判控制器驱动模块2-4完成构想修订迭代；"},{"title":"外反馈回路：模块6、7新颖性核验失败结果回传给模块5，触发新一轮批判重生成。"}],"kind":"section","title":"CMI十一模块遵循：方向输入 → 构想生成 → 逻辑约束校验 → 批判迭代 → 新颖性核验 → 记忆留存 → 分层验证 → 成果归类 → 多模态输出主数据流，包含两条反馈回路"},{"children":[],"kind":"leaf","title":"图1 CMI十一模块架构数据流示意图"},{"children":[],"kind":"leaf","title":"虚线人工介入点：模块1初始输入；模块10之后可插入人类最终判断环节。"}],"html":"\u003cp\u003eCMI十一模块遵循：方向输入 → 构想生成 → 逻辑约束校验 → 批判迭代 → 新颖性核验 → 记忆留存 → 分层验证 → 成果归类 → 多模态输出主数据流，包含两条反馈回路：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e内反馈回路：模块5批判控制器驱动模块2-4完成构想修订迭代；\u003c/li\u003e\n\u003cli\u003e外反馈回路：模块6、7新颖性核验失败结果回传给模块5，触发新一轮批判重生成。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-id=\"asset:sha256:97939cfb732965171430d513c22032b3ad55a657a17d179e7911d4793e3ba58b\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cem\u003e图1 CMI十一模块架构数据流示意图\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e虚线人工介入点：模块1初始输入；模块10之后可插入人类最终判断环节。\u003c/p\u003e\n","kind":"structured","rawMarkdown":"CMI十一模块遵循：方向输入 → 构想生成 → 逻辑约束校验 → 批判迭代 → 新颖性核验 → 记忆留存 → 分层验证 → 成果归类 → 多模态输出主数据流，包含两条反馈回路：\n\n- 内反馈回路：模块5批判控制器驱动模块2-4完成构想修订迭代；\n- 外反馈回路：模块6、7新颖性核验失败结果回传给模块5，触发新一轮批判重生成。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"blob:capacitor://localhost/56847d6a-8ca4-4762-b17b-18fd1c86586a\" alt=\"image\" /\u003e\u003c/div\u003e\n\n*图1 CMI十一模块架构数据流示意图*\n\n虚线人工介入点：模块1初始输入；模块10之后可插入人类最终判断环节。","sourceFormat":"markdown"},"note:sha256:e0fb3e94e6fba103178d8b885999fea99d46cdd292b4cd4d9e3d614039bd8f02":{"html":"\u003cp\u003e机器学习本质执行非线性拟合与模式归纳，复现已有数据分布，无法原生生成经过多环节校验的全新创造性产出，缺少探究闭环、批判迭代与多层级新颖性核验链路。\u003c/p\u003e\n\u003cp\u003eCMI不以模式拟合为目标，目标是编排完整的创造性探究过程，完成构想生成、多层校验、迭代演化到产出。\u003c/p\u003e\n","kind":"html","rawMarkdown":"机器学习本质执行非线性拟合与模式归纳，复现已有数据分布，无法原生生成经过多环节校验的全新创造性产出，缺少探究闭环、批判迭代与多层级新颖性核验链路。\n\nCMI不以模式拟合为目标，目标是编排完整的创造性探究过程，完成构想生成、多层校验、迭代演化到产出。","sourceFormat":"markdown"},"note:sha256:e59eefa4b71cbe2b280b97b064c62f0768cf11e8c6a9bb61117b8ae45641e7f0":{"html":"\u003cp\u003e依据客观约束-主观表达权重，将经过校验的产出归入约束强度谱系，兼容非典型交叉类创造产出。\u003c/p\u003e\n","kind":"html","rawMarkdown":"依据客观约束-主观表达权重，将经过校验的产出归入约束强度谱系，兼容非典型交叉类创造产出。","sourceFormat":"markdown"},"note:sha256:e95bb7bce8dcce0bc5dfb382bd01bbde5bd1ce9c452d7abe085a397bd4912383":{"html":"\u003cp\u003e在可形式化的标准化创造任务下，机器自主性持续提升。但人类仍然保留L1层级方向定义，以及L3层级规范性价值判断。对于本论断存在对立哲学立场，本文采纳该立场，不宣称其为唯一结论，相关批评观点参见Anonymous（2026）[15]。\u003c/p\u003e\n","kind":"html","rawMarkdown":"在可形式化的标准化创造任务下，机器自主性持续提升。但人类仍然保留L1层级方向定义，以及L3层级规范性价值判断。对于本论断存在对立哲学立场，本文采纳该立场，不宣称其为唯一结论，相关批评观点参见Anonymous（2026）[15]。","sourceFormat":"markdown"},"note:sha256:eeaaaae83085a22bc1aded548fb1a0540c24a4a699b072095d971c5a69645631":{"html":"\u003cp\u003e现有大模型智能体系统以完成外部指定任务为核心，任务目标、边界大多来自人类外部输入。智能体侧重规划、工具调用、任务达成，并不把完整创造性探究闭环作为底层原生架构。\u003c/p\u003e\n\u003cp\u003e多数通用智能体缺少专门新颖性核验链路、独立形式逻辑校验、双智能体批判迭代，也缺少面向多类型创造产出的统一分类框架。智能体可以嵌入CMI作为内部组件，但通用任务智能体不等同CMI。\u003c/p\u003e\n\u003cp\u003eCMI核心不是完成外部指派任务，而是运行完整创造性探究过程；创造方向可以在迭代中发生演化，不完全锁死人类预先给定任务目标。\u003c/p\u003e\n","kind":"html","rawMarkdown":"现有大模型智能体系统以完成外部指定任务为核心，任务目标、边界大多来自人类外部输入。智能体侧重规划、工具调用、任务达成，并不把完整创造性探究闭环作为底层原生架构。\n\n多数通用智能体缺少专门新颖性核验链路、独立形式逻辑校验、双智能体批判迭代，也缺少面向多类型创造产出的统一分类框架。智能体可以嵌入CMI作为内部组件，但通用任务智能体不等同CMI。\n\nCMI核心不是完成外部指派任务，而是运行完整创造性探究过程；创造方向可以在迭代中发生演化，不完全锁死人类预先给定任务目标。","sourceFormat":"markdown"},"note:sha256:fdef021b72124463b0666f0239dd3e32fb0eedf4121d7ad09b7e06f38a58eebb":{"html":"\u003cp\u003e本文把分散的机器创造能力整合进一套自洽理论体系，厘清纯生成输出、通用智能体任务执行与完整创造性探究过程之间的边界。以客观约束强度谱系，举例给出机器创造的四类典型功能域，同时承认还存在大量交叉、其他类型的创造产出。\u003c/p\u003e\n\u003cp\u003e十一模块闭环架构，将CMI与模式生成模型、任务导向通用智能体区分开来。CMI增量不是提出全新底层算法，而是把已经分散出现的各类能力，组织成统一闭环框架，覆盖逻辑校验、双通道新颖性核验、多类型创造分类。\u003c/p\u003e\n\u003cp\u003eCMI也存在明确边界：它是理论编排框架，不等于开箱即用工程系统；部分创造产出的全自动验证目前无法实现，保留人工备用通道。机器创造力不是简单生成文本，而是一整套人类监督之下完整、可校验、可追溯、可演化的探究过程，实现从机器辅助创造向机器主导中间流程创造的过渡，整个提升过程是渐进可控。\u003c/p\u003e\n","kind":"html","rawMarkdown":"本文把分散的机器创造能力整合进一套自洽理论体系，厘清纯生成输出、通用智能体任务执行与完整创造性探究过程之间的边界。以客观约束强度谱系，举例给出机器创造的四类典型功能域，同时承认还存在大量交叉、其他类型的创造产出。\n\n十一模块闭环架构，将CMI与模式生成模型、任务导向通用智能体区分开来。CMI增量不是提出全新底层算法，而是把已经分散出现的各类能力，组织成统一闭环框架，覆盖逻辑校验、双通道新颖性核验、多类型创造分类。\n\nCMI也存在明确边界：它是理论编排框架，不等于开箱即用工程系统；部分创造产出的全自动验证目前无法实现，保留人工备用通道。机器创造力不是简单生成文本，而是一整套人类监督之下完整、可校验、可追溯、可演化的探究过程，实现从机器辅助创造向机器主导中间流程创造的过渡，整个提升过程是渐进可控。","sourceFormat":"markdown"}},"sourceRevision":"sha256:6f9fe21bcad42f3b626a959e34086b8bf293772cce01c87ecb9e3ded6f807639"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(t,e,n)=>e in t?__defProp(t,e,{enumerable:!0,configurable:!0,writable:!0,value:n}):t[e]=n,__publicField=(t,e,n)=>__defNormalProp(t,"symbol"!=typeof e?e+"":e,n);!function(){"use strict";const t="deminds-interactive",e=["reading","map","asset-ref-v1"];class n extends Error{constructor(t,e){super(e),__publicField(this,"code"),this.name="InteractiveCanonicalizationError",this.code=t}}function i(t,e){throw new n("invalid_path",`Invalid Interactive HTML virtual path "${t}": ${e}`)}function r(t){const e=String(t||"").normalize("NFC").trim().replace(/\\/g,"/");e||i(e,"empty"),e.includes("\0")&&i(e,"nul_byte"),e.startsWith("/")&&i(e,"absolute"),/^[A-Za-z]:/.test(e)&&i(e,"drive_absolute"),/^[A-Za-z][A-Za-z0-9+.-]*:/.test(e)&&i(e,"url_scheme"),e.endsWith("/")&&i(e,"directory");const n=e.split("/");return n.some(t=>!t||"."===t||".."===t)&&i(e,"unsafe_segment"),n.join("/")}function a(t){if(null===t||"string"==typeof t||"boolean"==typeof t)return JSON.stringify(t);if("number"==typeof t){if(!Number.isFinite(t))throw new n("unsupported_json_value","Canonical JSON does not allow non-finite numbers.");return JSON.stringify(t)}if(Array.isArray(t))return`[${t.map(t=>a(t)).join(",")}]`;if("object"==typeof t)return`{${Object.keys(t).sort().map(e=>`${JSON.stringify(e)}:${a(t[e])}`).join(",")}}`;throw new n("unsupported_json_value",`Canonical JSON does not support ${typeof t}.`)}function o(t){return a(t)}async function s(t){const e=globalThis.crypto?.subtle;if(!e)throw new n("crypto_unavailable","SHA-256 requires Web Crypto.");const i="string"==typeof t?(new TextEncoder).encode(t):t,r=new Uint8Array(await e.digest("SHA-256",function(t){return t.buffer.slice(t.byteOffset,t.byteOffset+t.byteLength)}(i)));return Array.from(r,t
