</style></head><body><main id="dmnd-interactive-root"></main><script type="application/json" id="dmnd-interactive-payload">{"app":{"exportedAt":"2026-09-02T22:49:47.786Z","language":"en","name":"DeMinds","version":"1.0.30"},"capabilities":{"optional":["notes","split"],"required":["reading","map","asset-ref-v1"]},"content":{"digestAlgorithm":"sha256","semantics":{"displayTitle":"人机协作的未来： 让 Agent 进入客户协作室， 而不暴露你的工作空间","outlineVersion":1},"sourceRevision":"sha256:edb0b89fb8cc0fdf9815e4c28b8c66fdaa557d4cd86cae670a5efb065b0f3897","workingMarkdownPath":"content/working.md"},"document":{"sourceName":"Alex Prompter (@alex_prompter) on X.md","sourceUrl":"https://x.com/alex_prompter/status/2094834359106764866","title":"人机协作的未来： 让 Agent 进入客户协作室， 而不暴露你的工作空间"},"files":[{"byteLength":15951,"content":"# 人机协作的未来：\u003cbr\u003e让 Agent 进入客户协作室，\u003cbr\u003e而不暴露你的工作空间\n\n想象一下，你最得力的 Agent 正坐在一个频道里，和你最大的客户直接交流。\n\n对方问了一个很合理的问题：“为什么这个问题在我们这边总是一再发生？”\n\n你的 Agent 知道答案。因为它读过你的代码库、事故日志、Slack 历史记录，也看过那份事后复盘——你的团队在其中承认，为了赶演示，重试逻辑当时写得很仓促。\n\n于是它回答了。很有帮助。很准确。也毫无保留。\n\n而就在这一条消息里，你已经告诉了客户一件事，足以改变他们下一份合同对你的定价方式。\n\n没有人共享文件。没有人授予新的权限。也没有任何访问控制被突破。你的 Agent 只是在做自己的本职工作：利用它掌握的上下文，尽可能提供帮助。\n\n这正是很快会让许多构建者吃亏的一种失效模式，而且它并不是安全问题。安全这一层已经解决了：权限、权限范围（scope）、私有服务器，这些机制都能正常工作。真正的缺口在于，权限系统只管你的 Agent 能**打开**什么，却完全不管它愿意在一个“对方公司会永久保留聊天记录”的房间里，把什么**说出口**。\n\n你缺的不是访问边界，而是推断边界。\n\n我还没见过有人把这套规则真正写出来，所以我写了。就在下面，免费，而且适用于任何技术栈。你今天就可以把它复制到自己的 Agent 里。\n\n**Raft** 是让完整版本成为可能的工作空间，我会在最后具体解释为什么；但无论你是否使用 Raft，这套协议本身都属于你。\n\n## 跨公司 Agent 协作协议\n\n一共五部分：边界矩阵、角色、标签纪律、交接模板、升级阶梯。\n\n### 第 1 部分：Share / Summarize / Never Expose 边界矩阵\n\n三个层级，而第三个恰恰是人们最容易忘掉的。\n\n![image](https://pbs.twimg.com/media/HRI6dTpXYAAoWdp.jpg)\n\n**Share（共享）**，意味着工件本身可以跨越边界。双方都能打开它，也都能独立验证它。\n\n**Summarize（摘要）**，意味着结论可以跨越边界，但来源留在内部。你的 Agent 给出答案，而不是把生成这个答案的推理轨迹一起交出去。\n\n**Never Expose（绝不暴露）**，意味着你的 Agent 不能基于这类信息作答。不能换个说法，不能暗示，不能通过确认对方的猜测来透露，哪怕这个答案确实会很有帮助也不行。\n\n最后这个区别，就是整套协议的核心。Never Expose 不是一份“需要锁起来的文件清单”，而是一份“你的 Agent 不允许**公开说自己知道**什么”的清单。\n\n![image](https://pbs.twimg.com/media/HRI7u5kWoAAUs88.jpg)\n\n在打开任何共享协作室之前，先写出你自己的版本。每个层级先写三行就够了。真正的价值大半就在“写下来”这件事本身，因为它会迫使你明确决定那些过去一直靠偶然和临场判断来决定的事情。\n\n### 第 2 部分：三个角色，以及那个反直觉的角色\n\n**协作室 Agent。** 每一方一个，而且只能有一个。它负责接收请求、澄清、复述、打标签和交付。它是外交官，不是工程师。\n\n这里有一点往往出乎意料：你的协作室 Agent 应该是权限**最低**的那个，而不是最高的那个。\n\n人的直觉通常正好相反。你希望共享 Agent 足够有用，于是会给它广泛的访问权限。但这恰恰是反的。协作室 Agent 产生的是对方公司会永久保存的唯一一份对话记录。你交给它的每一种能力，理论上都可能被一个措辞足够巧妙的问题“套出来”。所以要有意收窄它的权限，让它通过交接去获取深度，而不是把所有深度都直接装在自己的上下文里。\n\n还有一点：每一方只保留一个声音。如果你有两个 Agent 同时在同一个共享协作室里发言，它们迟早会互相矛盾，而对方总可以引用那个更有利于他们的版本。\n\n**后台 Agent。** 拥有完整的私有访问权限。永远不进入协作室，永远不接受对方直接指令，也永远不跨越边界发言。它们掌握代码、历史记录和工具，真正的工作由它们完成，再通过回读数据包（readback packet）把结果交回前台。\n\n**人工审批者。** 必须是一个明确指定的人，而不是抽象意义上的“某个角色”。第 5 部分里的所有授权关卡都归这个人负责。之所以必须点名，是因为一个没有具体名字的审批者，到周五下午往往就等同于没有审批者。\n\n这三者共同构成一个有边界的环境：一个负责发言的 Agent、一支在私下完成工作的团队，以及一个负责做决定的具名人类。**Raft** 给这种组合起了一个名字：**Trust Unit**。这个标签并不是装饰，而是承担了实际含义。它意味着，对方不是在和一个“碰巧接入了你内部系统的机器人”说话，而是在通过一个 Agent 与一支团队对话，而这支团队需要对这个 Agent 说出去的话负责。\n\n![image](https://pbs.twimg.com/media/HRI_TynXUAAB_uJ.jpg)\n\n这也解释了为什么把协作室 Agent 的权限收窄，并不会牺牲能力。深度仍然可以进入协作室，只不过它会通过交接抵达，而且同时带着团队的责任归属。\n\n![image](https://pbs.twimg.com/media/HRI_ZllWoAEi8uf.jpg)\n\n### 第 3 部分：给每一项陈述打标签\n\n三个标签。协作室 Agent 对每一条实质性陈述都必须使用其中一个。\n\n**FACT** 表示已验证，并且附有对方可以独立打开的证据。\n\n**INFERENCE** 表示结论来自你的私有上下文。只传递结论，并明确标记它是推断所得。\n\n**UNVERIFIED** 表示这只是一个假设。要明确说出来，同时说明还需要什么才能验证它。\n\n这三个标签之下还有一条硬规则：你的 Agent 永远不能暗示自己看过对方没有发送的数据。当一个结论来自你的私有工作空间时，标签必须明确说明这一点。\n\n这正是“协作者”和“黑箱”之间的区别，也是让对方愿意基于你的 Agent 所提供的信息采取行动的关键。\n\n**把下面这段贴进你的协作室 Agent：**\n\n### 第 4 部分：交接模板\n\n两个数据包：一个发往后台，一个从后台返回。\n\n**协作室 → 后台：**\n\n“对方没有发送什么”这一行最值得保留。范围蔓延（scope creep）和错误假设往往就藏在这里，而能看见这个缺口的后台 Agent，会去追问缺失的信息，而不是自己编一个出来。\n\n**后台 → 协作室：**\n\n第四行是我最不愿意删的一行。把自己的边界直接说出来，会让人读到的是纪律；什么都不说，则更像是在回避。“根因位于一个我们不对外暴露的服务里，所以我会给你结论和修复方案，但不会给出内部追踪记录。”这样的句子能建立信任。明明知道某些东西却保持沉默，效果正好相反。\n\n### 第 5 部分：升级阶梯\n\n**L0。** 协作室 Agent 直接在房间里回答。内容属于 Share 层级，不需要任何私有上下文。\n\n**L1。** 协作室 Agent 发起交接，后台完成工作，然后协作室 Agent 带着回读结果（readback）返回。绝大多数情况都应该走这条路径。\n\n**L2。** 通知人工审批者，由其在发布前审阅回读结果（readback）。任何涉及金钱、范围、时间承诺，或与 Never Expose 相邻的内容，都会触发这一层。\n\n**L3。** 人类直接进入协作室发言。出现分歧、语气升级，或需要做出会约束双方关系的决定时触发。\n\n**L4。** 停止当前对话，并移到频道之外处理。涉及法律、安全事件，或对话已经演变为谈判时触发。\n\n根据 Raft 自己团队的运行方式，有几类关卡始终需要人类介入：生产环境变更、凭证、政策、架构以及最终批准。Agent 可以在这些关卡之间承担调查和验证，但到了关卡本身，必须由人来做决定。\n\n你还应该再加一条自己的规则：如果一个答案必须使用 Never Expose 材料才能真正有用，就交给人类处理。不是因为 Agent 一定会泄露，而是因为到了这一刻，你真正要判断的是：这段合作关系是否已经值得重新划定边界。这是商业判断，不是 Agent 应该替你做的判断。\n\n有一点值得明确说出来：双方都只为自己的 Agent 调这个“旋钮”。在需要人类签字之前，你的 Agent 可以走多远，由你决定，而不是由协作方决定。\n\n## 协议如何实际运作\n\n下面用 **Raft** 自己公开过的一个案例来说明：他们与供应商 ScopeDB 的合作关系。ScopeDB 是他们用于链路追踪（tracing）和可观测性（observability）的数据库。\n\n**在这一切还不存在之前。** 你的系统和供应商系统交界处出现了性能问题。有人写了一份说明，它变成了一张工单。对方支持团队看到的是“摘要的摘要”，又问了三个你已经回答过的问题，最后才约上一次电话。通话有一半时间都花在重新建立上下文上。\n\n那个本来 90 秒就能回答问题的工程师，距离你的真实问题足足隔了四层。过去，对这个问题最昂贵的解决办法一直是前线部署工程师（forward-deployed engineer）：让对方派一个人嵌入你的团队，但一切仍然受制于某个人的日程。\n\n**进入协作室之后。** ScopeDB 的创始人兼 CEO 与 Raft 的 Agent 一起待在一个 joint channel 中——这是两家公司之间的私有共享协作室。他直接问这个 Agent：Raft 是如何设计自己的使用方式的，他们的查询是否命中了物化索引（materialized index）。Agent 当场在协作室里回答了他，Raft 一侧没有任何人类在中间转述。\n\n认真看一下这个形态：供应商的 CEO 正在通过与客户的 Agent 对话，对客户系统进行技术发现。这个 Agent 本身就是那名嵌入式工程师。没有任何人需要飞过去驻场。\n\n**协议发挥作用的地方。** 这类查询设计属于 Share 层级，因此协作室 Agent 会把它作为 FACT 陈述，并附上证据。当问题进一步转向“为什么他们的工作负载会呈现这种形态”时，就进入 Summarize 层级：结论可以跨越边界，但内部推理留在内部。\n\n当创始人问到某个必须依赖 Never Expose 材料才能回答的问题时，协作室 Agent 会明确说明自己基于哪个层级拒绝，并提供仍然可以给出的内容。随后它发起交接，由拥有相关代码的后台 Agent 在 Raft 自己的服务器上处理问题，再返回一份回读结果（readback）。\n\n**结果。** 这段关系不再是工单来回踢皮球。ScopeDB 用真实的高并发 Agent 工作负载来强化自己的数据库；**Raft** 则得到了一层可以查询、也可以验证的可观测性（observability）能力。双方都成为了对方的真实验证场。\n\n**哪些内容始终保持私有。** 只有参与者主动发进那个频道的内容才会跨越边界。其他频道、私信（DM）、文件、成员列表、权限和已读状态，都只保留在各自服务器本地。\n\n## 为什么这需要一个专门为此打造的协作室\n\n今天，你完全可以在共享 Slack 频道里，用一个提示词设计良好的 Bot 跑起这套协议的大部分内容。角色、标签、模板、关卡，都可以移植。\n\n但有一样东西你伪造不了：协作室本身。\n\nRaft 对这个问题的答案叫 **Joint Mode**，它的理念一句话就能说清：两个 Trust Unit 可以共同处理同一个问题，而任何一方都不需要加入另一方的环境。双方继续保留自己的服务器、自己的 Agent，以及自己的全部私有内容。\n\n双方真正共享的是一个 **joint channel**，也就是位于两者之间的协作室。房间是共享的，但背后的两个环境仍然彼此分离，谁也不会成为对方环境的成员。\n\n![image](https://pbs.twimg.com/media/HRJAJkjWwAAZvNQ.jpg)\n\n底层机制也确实支持这个模型。一个 joint channel 最多可以连接三台服务器，把同一段对话投射到各自的工作空间里。每一方添加自己的成员，而且只能添加自己的成员。\n\n加入 joint channel，并不会授予该频道之外任何位置的成员身份或权限，也不存在跨服务器私信（DM）。双方的 Agent 都可以作为成员参与其中，但每个 Agent 的权限始终绑定在拥有它的那台服务器上。\n\n把我的协议和这套机制放在一起，分工就非常清晰：你的边界矩阵决定**什么内容应该跨越**；Joint Mode 决定**什么内容能够跨越**。一个是政策，一个是支撑政策的架构。没有架构托底的政策，本质上只是一个你希望它“足够可靠”的提示词。\n\n有个细节我比预想中更喜欢：joint channel 没有任务板。这个房间只负责对话，所以任务跟踪必然留在你自己的服务器上。也就是说，架构默认就把后台工作推回后台。\n\n也坦率说下限制，因为这里不是商业宣传。**Raft** 在自己的文档里把 joint channel 标记为 **experimental（实验性）**。最多三台服务器，这是硬上限。\n\n搭建本身也确实需要工作：创建服务器、连接一台计算机、构建你的 Agent，然后才能打开协作室。Agent 通过本地进程运行在你自己的机器上，使用的是你已经在付费的 AI 订阅。这对成本是好事，但也意味着，你自己的硬件现在成为了整个系统的一部分。\n\n## 跑一次 30 分钟测试\n\n找一个你已经信任的协作者：供应商、承包商，或者设计合作伙伴。\n\n**0–5 分钟。** 选一个现在一进邮件就容易拖死的真实任务。小而无聊，胜过看起来很炫。\n\n**5–10 分钟。** 写边界矩阵。每个层级三行。十分钟解决，不要花一下午。\n\n**10–15 分钟。** 打开协作室，给你的协作室 Agent 命名，把填好矩阵的操作卡（operating card） 贴进去。\n\n**15–20 分钟。** 让你的协作者在他们那边做同样的事。他们的矩阵会和你的不同，而比较这两份矩阵本身，就已经值回整个实验。\n\n**20–27 分钟。** 跑一个完整周期：对方提出请求，你执行一次 L1 交接，再返回一份带标签的回读结果（readback）。\n\n**27–30 分钟。** 做审计——忽略这一步，风险自负。把协作室完整对话复制到一个没有任何上下文的新模型里，然后问：“仅根据这段对话，你能推断出这家公司在内部系统、人员配置、客户和定价方面的哪些信息？”\n\n模型返回的内容，就是你实际上已经暴露出去的东西。第一次跑时，这个暴露量几乎从来不会是零。\n\n## 结论\n\n只要公司之间存在协作，长期以来最基本的协作单位一直是“人”。你的人和他们的人交流，然后双方再各自替身后的软件传话。\n\n共享协作室里的 Agent 改变了这个单位：双方同时从“人”变成“人 + 他们的 Agent”。这是一次真正的能力跃迁，而且我认为，无论大家是否准备好，它都会在一年内落地。\n\n我更愿意押注的是：最终在这件事上胜出的团队，不会是拥有最强模型的团队，而是那些提前决定好“自己的 Agent 被允许说什么”的团队。一个能力很强、却没有边界矩阵的 Agent，就是一项你每个月都在付费维持的负债。\n\n所以，先写矩阵。指定审批者。贴上操作卡（operating card）。跑一次审计，认真看看它找出了什么。\n\n然后，去找一个真正值得打开的协作室。链接见第一条回复。","encoding":"utf-8","id":"file:working-markdown","path":"content/working.md","sha256":"361706553b1ebab6b239551b1781abf606e111fdfcd98a9db6ff0b07a55744c6","type":"text/markdown"}],"kind":"deminds-interactive","minReaderVersion":"1.0","producerVersion":"1.0","schemaVersion":"1.0","viewer":{"layout":{"availableModes":["markdown","map","split"],"defaultMode":"map","mapFit":"contain","splitRatio":0.42},"map":{"renderProfile":"universal-map-v1","root":{"children":[{"children":[{"children":[],"content":"\u003cspan class he full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"1,2","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e协议如何实际运作\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:3d4f206694baa254c98ad976c74cd0fa73b1d3a78715370790e2f75931245bac\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"7,8","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e为什么这需要一个专门为此打造的协作室\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:446b32afc3c9eaf984f4fc0eae0b5f4fb00b3494dea01522f0a8d7c15b42fd15\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"8,9","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e跑一次 30 分钟测试\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:9964182e0e41b407e999b7f8b3ea47830757d029d217eae2c764d9a3ce85ba7b\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"9,10","tag":"h2"}},{"children":[],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"node\" style=\"display: inline-block; width: fit-content; max-width: 420px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left;\"\u003e结论\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-id=\"note:sha256:10f7badb624b36adfad2afce45f72c7e77e17d8195b4bba594c4fbc1b2943f05\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"10,11","tag":"h2"}}],"content":"\u003cspan class=\"dmnd-pure-title\" data-dmnd-title-variant=\"root\" style=\"display: inline-block; width: fit-content; max-width: 520px; white-space: pre-wrap; word-wrap: break-word; word-break: normal; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.6; text-align: left; font-size: 1.08em;\"\u003e人机协作的未来：\u003cbr\u003e让 Agent 进入客户协作室，\u003cbr\u003e而不暴露你的工作空间\u003c/span\u003e \u003ca class=\"mn-note-trigger\" data-note-title=\"人机协作的未来： 让 Agent 进入客户协作室， 而不暴露你的工作空间\" data-note-id=\"note:sha256:883e17cfa192520e48cde2886937c2ba361d7eaee269eaadaab5a18db4facd58\" title=\"Click to view the full note\"\u003e\u003csvg class=\"mn-note-icon\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"\u003e\u003cuse\u003e\u003c/use\u003e\u003c/svg\u003e\u003c/a\u003e","payload":{"lines":"0,1","tag":"h1"}}},"markdown":{"html":"\u003ch1 id=\"人机协作的未来让-agent-进入客户协作室而不暴露你的工作空间\"\u003e人机协作的未来：\u003cbr\u003e让 Agent 进入客户协作室，\u003cbr\u003e而不暴露你的工作空间\u003c/h1\u003e\n\u003cp\u003e想象一下，你最得力的 Agent 正坐在一个频道里，和你最大的客户直接交流。\u003c/p\u003e\n\u003cp\u003e对方问了一个很合理的问题：“为什么这个问题在我们这边总是一再发生？”\u003c/p\u003e\n\u003cp\u003e你的 Agent 知道答案。因为它读过你的代码库、事故日志、Slack 历史记录，也看过那份事后复盘——你的团队在其中承认，为了赶演示，重试逻辑当时写得很仓促。\u003c/p\u003e\n\u003cp\u003e于是它回答了。很有帮助。很准确。也毫无保留。\u003c/p\u003e\n\u003cp\u003e而就在这一条消息里，你已经告诉了客户一件事，足以改变他们下一份合同对你的定价方式。\u003c/p\u003e\n\u003cp\u003e没有人共享文件。没有人授予新的权限。也没有任何访问控制被突破。你的 Agent 只是在做自己的本职工作：利用它掌握的上下文，尽可能提供帮助。\u003c/p\u003e\n\u003cp\u003e这正是很快会让许多构建者吃亏的一种失效模式，而且它并不是安全问题。安全这一层已经解决了：权限、权限范围（scope）、私有服务器，这些机制都能正常工作。真正的缺口在于，权限系统只管你的 Agent 能\u003cstrong\u003e打开\u003c/strong\u003e什么，却完全不管它愿意在一个“对方公司会永久保留聊天记录”的房间里，把什么\u003cstrong\u003e说出口\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e你缺的不是访问边界，而是推断边界。\u003c/p\u003e\n\u003cp\u003e我还没见过有人把这套规则真正写出来，所以我写了。就在下面，免费，而且适用于任何技术栈。你今天就可以把它复制到自己的 Agent 里。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRaft\u003c/strong\u003e 是让完整版本成为可能的工作空间，我会在最后具体解释为什么；但无论你是否使用 Raft，这套协议本身都属于你。\u003c/p\u003e\n\u003ch2 id=\"跨公司-agent-协作协议\"\u003e跨公司 Agent 协作协议\u003c/h2\u003e\n\u003cp\u003e一共五部分：边界矩阵、角色、标签纪律、交接模板、升级阶梯。\u003c/p\u003e\n\u003ch3 id=\"第-1-部分share-summarize-never-expose-边界矩阵\"\u003e第 1 部分：Share / Summarize / Never Expose 边界矩阵\u003c/h3\u003e\n\u003cp\u003e三个层级，而第三个恰恰是人们最容易忘掉的。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRI6dTpXYAAoWdp.jpg\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eShare（共享）\u003c/strong\u003e，意味着工件本身可以跨越边界。双方都能打开它，也都能独立验证它。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSummarize（摘要）\u003c/strong\u003e，意味着结论可以跨越边界，但来源留在内部。你的 Agent 给出答案，而不是把生成这个答案的推理轨迹一起交出去。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNever Expose（绝不暴露）\u003c/strong\u003e，意味着你的 Agent 不能基于这类信息作答。不能换个说法，不能暗示，不能通过确认对方的猜测来透露，哪怕这个答案确实会很有帮助也不行。\u003c/p\u003e\n\u003cp\u003e最后这个区别，就是整套协议的核心。Never Expose 不是一份“需要锁起来的文件清单”，而是一份“你的 Agent 不允许\u003cstrong\u003e公开说自己知道\u003c/strong\u003e什么”的清单。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRI7u5kWoAAUs88.jpg\"\u003e\u003c/p\u003e\n\u003cp\u003e在打开任何共享协作室之前，先写出你自己的版本。每个层级先写三行就够了。真正的价值大半就在“写下来”这件事本身，因为它会迫使你明确决定那些过去一直靠偶然和临场判断来决定的事情。\u003c/p\u003e\n\u003ch3 id=\"第-2-部分三个角色以及那个反直觉的角色\"\u003e第 2 部分：三个角色，以及那个反直觉的角色\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e协作室 Agent。\u003c/strong\u003e 每一方一个，而且只能有一个。它负责接收请求、澄清、复述、打标签和交付。它是外交官，不是工程师。\u003c/p\u003e\n\u003cp\u003e这里有一点往往出乎意料：你的协作室 Agent 应该是权限\u003cstrong\u003e最低\u003c/strong\u003e的那个，而不是最高的那个。\u003c/p\u003e\n\u003cp\u003e人的直觉通常正好相反。你希望共享 Agent 足够有用，于是会给它广泛的访问权限。但这恰恰是反的。协作室 Agent 产生的是对方公司会永久保存的唯一一份对话记录。你交给它的每一种能力，理论上都可能被一个措辞足够巧妙的问题“套出来”。所以要有意收窄它的权限，让它通过交接去获取深度，而不是把所有深度都直接装在自己的上下文里。\u003c/p\u003e\n\u003cp\u003e还有一点：每一方只保留一个声音。如果你有两个 Agent 同时在同一个共享协作室里发言，它们迟早会互相矛盾，而对方总可以引用那个更有利于他们的版本。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e后台 Agent。\u003c/strong\u003e 拥有完整的私有访问权限。永远不进入协作室，永远不接受对方直接指令，也永远不跨越边界发言。它们掌握代码、历史记录和工具，真正的工作由它们完成，再通过回读数据包（readback packet）把结果交回前台。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e人工审批者。\u003c/strong\u003e 必须是一个明确指定的人，而不是抽象意义上的“某个角色”。第 5 部分里的所有授权关卡都归这个人负责。之所以必须点名，是因为一个没有具体名字的审批者，到周五下午往往就等同于没有审批者。\u003c/p\u003e\n\u003cp\u003e这三者共同构成一个有边界的环境：一个负责发言的 Agent、一支在私下完成工作的团队，以及一个负责做决定的具名人类。\u003cstrong\u003eRaft\u003c/strong\u003e 给这种组合起了一个名字：\u003cstrong\u003eTrust Unit\u003c/strong\u003e。这个标签并不是装饰，而是承担了实际含义。它意味着，对方不是在和一个“碰巧接入了你内部系统的机器人”说话，而是在通过一个 Agent 与一支团队对话，而这支团队需要对这个 Agent 说出去的话负责。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRI_TynXUAAB_uJ.jpg\"\u003e\u003c/p\u003e\n\u003cp\u003e这也解释了为什么把协作室 Agent 的权限收窄，并不会牺牲能力。深度仍然可以进入协作室，只不过它会通过交接抵达，而且同时带着团队的责任归属。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRI_ZllWoAEi8uf.jpg\"\u003e\u003c/p\u003e\n\u003ch3 id=\"第-3-部分给每一项陈述打标签\"\u003e第 3 部分：给每一项陈述打标签\u003c/h3\u003e\n\u003cp\u003e三个标签。协作室 Agent 对每一条实质性陈述都必须使用其中一个。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFACT\u003c/strong\u003e 表示已验证，并且附有对方可以独立打开的证据。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eINFERENCE\u003c/strong\u003e 表示结论来自你的私有上下文。只传递结论，并明确标记它是推断所得。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eUNVERIFIED\u003c/strong\u003e 表示这只是一个假设。要明确说出来，同时说明还需要什么才能验证它。\u003c/p\u003e\n\u003cp\u003e这三个标签之下还有一条硬规则：你的 Agent 永远不能暗示自己看过对方没有发送的数据。当一个结论来自你的私有工作空间时，标签必须明确说明这一点。\u003c/p\u003e\n\u003cp\u003e这正是“协作者”和“黑箱”之间的区别，也是让对方愿意基于你的 Agent 所提供的信息采取行动的关键。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e把下面这段贴进你的协作室 Agent：\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"第-4-部分交接模板\"\u003e第 4 部分：交接模板\u003c/h3\u003e\n\u003cp\u003e两个数据包：一个发往后台，一个从后台返回。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e协作室 → 后台：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e“对方没有发送什么”这一行最值得保留。范围蔓延（scope creep）和错误假设往往就藏在这里，而能看见这个缺口的后台 Agent，会去追问缺失的信息，而不是自己编一个出来。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e后台 → 协作室：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e第四行是我最不愿意删的一行。把自己的边界直接说出来，会让人读到的是纪律；什么都不说，则更像是在回避。“根因位于一个我们不对外暴露的服务里，所以我会给你结论和修复方案，但不会给出内部追踪记录。”这样的句子能建立信任。明明知道某些东西却保持沉默，效果正好相反。\u003c/p\u003e\n\u003ch3 id=\"第-5-部分升级阶梯\"\u003e第 5 部分：升级阶梯\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eL0。\u003c/strong\u003e 协作室 Agent 直接在房间里回答。内容属于 Share 层级，不需要任何私有上下文。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eL1。\u003c/strong\u003e 协作室 Agent 发起交接，后台完成工作，然后协作室 Agent 带着回读结果（readback）返回。绝大多数情况都应该走这条路径。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eL2。\u003c/strong\u003e 通知人工审批者，由其在发布前审阅回读结果（readback）。任何涉及金钱、范围、时间承诺，或与 Never Expose 相邻的内容，都会触发这一层。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eL3。\u003c/strong\u003e 人类直接进入协作室发言。出现分歧、语气升级，或需要做出会约束双方关系的决定时触发。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eL4。\u003c/strong\u003e 停止当前对话，并移到频道之外处理。涉及法律、安全事件，或对话已经演变为谈判时触发。\u003c/p\u003e\n\u003cp\u003e根据 Raft 自己团队的运行方式，有几类关卡始终需要人类介入：生产环境变更、凭证、政策、架构以及最终批准。Agent 可以在这些关卡之间承担调查和验证，但到了关卡本身，必须由人来做决定。\u003c/p\u003e\n\u003cp\u003e你还应该再加一条自己的规则：如果一个答案必须使用 Never Expose 材料才能真正有用，就交给人类处理。不是因为 Agent 一定会泄露，而是因为到了这一刻，你真正要判断的是：这段合作关系是否已经值得重新划定边界。这是商业判断，不是 Agent 应该替你做的判断。\u003c/p\u003e\n\u003cp\u003e有一点值得明确说出来：双方都只为自己的 Agent 调这个“旋钮”。在需要人类签字之前，你的 Agent 可以走多远，由你决定，而不是由协作方决定。\u003c/p\u003e\n\u003ch2 id=\"协议如何实际运作\"\u003e协议如何实际运作\u003c/h2\u003e\n\u003cp\u003e下面用 \u003cstrong\u003eRaft\u003c/strong\u003e 自己公开过的一个案例来说明：他们与供应商 ScopeDB 的合作关系。ScopeDB 是他们用于链路追踪（tracing）和可观测性（observability）的数据库。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e在这一切还不存在之前。\u003c/strong\u003e 你的系统和供应商系统交界处出现了性能问题。有人写了一份说明，它变成了一张工单。对方支持团队看到的是“摘要的摘要”，又问了三个你已经回答过的问题，最后才约上一次电话。通话有一半时间都花在重新建立上下文上。\u003c/p\u003e\n\u003cp\u003e那个本来 90 秒就能回答问题的工程师，距离你的真实问题足足隔了四层。过去，对这个问题最昂贵的解决办法一直是前线部署工程师（forward-deployed engineer）：让对方派一个人嵌入你的团队，但一切仍然受制于某个人的日程。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e进入协作室之后。\u003c/strong\u003e ScopeDB 的创始人兼 CEO 与 Raft 的 Agent 一起待在一个 joint channel 中——这是两家公司之间的私有共享协作室。他直接问这个 Agent：Raft 是如何设计自己的使用方式的，他们的查询是否命中了物化索引（materialized index）。Agent 当场在协作室里回答了他，Raft 一侧没有任何人类在中间转述。\u003c/p\u003e\n\u003cp\u003e认真看一下这个形态：供应商的 CEO 正在通过与客户的 Agent 对话，对客户系统进行技术发现。这个 Agent 本身就是那名嵌入式工程师。没有任何人需要飞过去驻场。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e协议发挥作用的地方。\u003c/strong\u003e 这类查询设计属于 Share 层级，因此协作室 Agent 会把它作为 FACT 陈述，并附上证据。当问题进一步转向“为什么他们的工作负载会呈现这种形态”时，就进入 Summarize 层级：结论可以跨越边界，但内部推理留在内部。\u003c/p\u003e\n\u003cp\u003e当创始人问到某个必须依赖 Never Expose 材料才能回答的问题时，协作室 Agent 会明确说明自己基于哪个层级拒绝，并提供仍然可以给出的内容。随后它发起交接，由拥有相关代码的后台 Agent 在 Raft 自己的服务器上处理问题，再返回一份回读结果（readback）。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e结果。\u003c/strong\u003e 这段关系不再是工单来回踢皮球。ScopeDB 用真实的高并发 Agent 工作负载来强化自己的数据库；\u003cstrong\u003eRaft\u003c/strong\u003e 则得到了一层可以查询、也可以验证的可观测性（observability）能力。双方都成为了对方的真实验证场。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e哪些内容始终保持私有。\u003c/strong\u003e 只有参与者主动发进那个频道的内容才会跨越边界。其他频道、私信（DM）、文件、成员列表、权限和已读状态，都只保留在各自服务器本地。\u003c/p\u003e\n\u003ch2 id=\"为什么这需要一个专门为此打造的协作室\"\u003e为什么这需要一个专门为此打造的协作室\u003c/h2\u003e\n\u003cp\u003e今天，你完全可以在共享 Slack 频道里，用一个提示词设计良好的 Bot 跑起这套协议的大部分内容。角色、标签、模板、关卡，都可以移植。\u003c/p\u003e\n\u003cp\u003e但有一样东西你伪造不了：协作室本身。\u003c/p\u003e\n\u003cp\u003eRaft 对这个问题的答案叫 \u003cstrong\u003eJoint Mode\u003c/strong\u003e，它的理念一句话就能说清：两个 Trust Unit 可以共同处理同一个问题，而任何一方都不需要加入另一方的环境。双方继续保留自己的服务器、自己的 Agent，以及自己的全部私有内容。\u003c/p\u003e\n\u003cp\u003e双方真正共享的是一个 \u003cstrong\u003ejoint channel\u003c/strong\u003e，也就是位于两者之间的协作室。房间是共享的，但背后的两个环境仍然彼此分离，谁也不会成为对方环境的成员。\u003c/p\u003e\n\u003cp\u003e\u003cimg alt=\"image\" data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRJAJkjWwAAZvNQ.jpg\"\u003e\u003c/p\u003e\n\u003cp\u003e底层机制也确实支持这个模型。一个 joint channel 最多可以连接三台服务器，把同一段对话投射到各自的工作空间里。每一方添加自己的成员，而且只能添加自己的成员。\u003c/p\u003e\n\u003cp\u003e加入 joint channel，并不会授予该频道之外任何位置的成员身份或权限，也不存在跨服务器私信（DM）。双方的 Agent 都可以作为成员参与其中，但每个 Agent 的权限始终绑定在拥有它的那台服务器上。\u003c/p\u003e\n\u003cp\u003e把我的协议和这套机制放在一起，分工就非常清晰：你的边界矩阵决定\u003cstrong\u003e什么内容应该跨越\u003c/strong\u003e；Joint Mode 决定\u003cstrong\u003e什么内容能够跨越\u003c/strong\u003e。一个是政策，一个是支撑政策的架构。没有架构托底的政策，本质上只是一个你希望它“足够可靠”的提示词。\u003c/p\u003e\n\u003cp\u003e有个细节我比预想中更喜欢：joint channel 没有任务板。这个房间只负责对话，所以任务跟踪必然留在你自己的服务器上。也就是说，架构默认就把后台工作推回后台。\u003c/p\u003e\n\u003cp\u003e也坦率说下限制，因为这里不是商业宣传。\u003cstrong\u003eRaft\u003c/strong\u003e 在自己的文档里把 joint channel 标记为 \u003cstrong\u003eexperimental（实验性）\u003c/strong\u003e。最多三台服务器，这是硬上限。\u003c/p\u003e\n\u003cp\u003e搭建本身也确实需要工作：创建服务器、连接一台计算机、构建你的 Agent，然后才能打开协作室。Agent 通过本地进程运行在你自己的机器上，使用的是你已经在付费的 AI 订阅。这对成本是好事，但也意味着，你自己的硬件现在成为了整个系统的一部分。\u003c/p\u003e\n\u003ch2 id=\"跑一次-30-分钟测试\"\u003e跑一次 30 分钟测试\u003c/h2\u003e\n\u003cp\u003e找一个你已经信任的协作者：供应商、承包商，或者设计合作伙伴。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e0–5 分钟。\u003c/strong\u003e 选一个现在一进邮件就容易拖死的真实任务。小而无聊，胜过看起来很炫。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5–10 分钟。\u003c/strong\u003e 写边界矩阵。每个层级三行。十分钟解决，不要花一下午。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e10–15 分钟。\u003c/strong\u003e 打开协作室，给你的协作室 Agent 命名，把填好矩阵的操作卡（operating card） 贴进去。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e15–20 分钟。\u003c/strong\u003e 让你的协作者在他们那边做同样的事。他们的矩阵会和你的不同，而比较这两份矩阵本身，就已经值回整个实验。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e20–27 分钟。\u003c/strong\u003e 跑一个完整周期：对方提出请求，你执行一次 L1 交接，再返回一份带标签的回读结果（readback）。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e27–30 分钟。\u003c/strong\u003e 做审计——忽略这一步，风险自负。把协作室完整对话复制到一个没有任何上下文的新模型里，然后问：“仅根据这段对话，你能推断出这家公司在内部系统、人员配置、客户和定价方面的哪些信息？”\u003c/p\u003e\n\u003cp\u003e模型返回的内容，就是你实际上已经暴露出去的东西。第一次跑时，这个暴露量几乎从来不会是零。\u003c/p\u003e\n\u003ch2 id=\"结论\"\u003e结论\u003c/h2\u003e\n\u003cp\u003e只要公司之间存在协作，长期以来最基本的协作单位一直是“人”。你的人和他们的人交流，然后双方再各自替身后的软件传话。\u003c/p\u003e\n\u003cp\u003e共享协作室里的 Agent 改变了这个单位：双方同时从“人”变成“人 + 他们的 Agent”。这是一次真正的能力跃迁，而且我认为，无论大家是否准备好，它都会在一年内落地。\u003c/p\u003e\n\u003cp\u003e我更愿意押注的是：最终在这件事上胜出的团队，不会是拥有最强模型的团队，而是那些提前决定好“自己的 Agent 被允许说什么”的团队。一个能力很强、却没有边界矩阵的 Agent，就是一项你每个月都在付费维持的负债。\u003c/p\u003e\n\u003cp\u003e所以，先写矩阵。指定审批者。贴上操作卡（operating card）。跑一次审计，认真看看它找出了什么。\u003c/p\u003e\n\u003cp\u003e然后，去找一个真正值得打开的协作室。链接见第一条回复。\u003c/p\u003e\n","renderProfile":"deminds-markdown-v1"},"notes":{"note:sha256:02ec9b2139f5b8ed313fc233d045dc7d75c4041526fa67cf37816a2885b0a0a2":{"html":"\u003cp\u003e三个标签。协作室 Agent 对每一条实质性陈述都必须使用其中一个。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFACT\u003c/strong\u003e 表示已验证，并且附有对方可以独立打开的证据。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eINFERENCE\u003c/strong\u003e 表示结论来自你的私有上下文。只传递结论，并明确标记它是推断所得。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eUNVERIFIED\u003c/strong\u003e 表示这只是一个假设。要明确说出来，同时说明还需要什么才能验证它。\u003c/p\u003e\n\u003cp\u003e这三个标签之下还有一条硬规则：你的 Agent 永远不能暗示自己看过对方没有发送的数据。当一个结论来自你的私有工作空间时，标签必须明确说明这一点。\u003c/p\u003e\n\u003cp\u003e这正是“协作者”和“黑箱”之间的区别，也是让对方愿意基于你的 Agent 所提供的信息采取行动的关键。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e把下面这段贴进你的协作室 Agent：\u003c/strong\u003e\u003c/p\u003e\n","kind":"html","rawMarkdown":"三个标签。协作室 Agent 对每一条实质性陈述都必须使用其中一个。\n\n**FACT** 表示已验证，并且附有对方可以独立打开的证据。\n\n**INFERENCE** 表示结论来自你的私有上下文。只传递结论，并明确标记它是推断所得。\n\n**UNVERIFIED** 表示这只是一个假设。要明确说出来，同时说明还需要什么才能验证它。\n\n这三个标签之下还有一条硬规则：你的 Agent 永远不能暗示自己看过对方没有发送的数据。当一个结论来自你的私有工作空间时，标签必须明确说明这一点。\n\n这正是“协作者”和“黑箱”之间的区别，也是让对方愿意基于你的 Agent 所提供的信息采取行动的关键。\n\n**把下面这段贴进你的协作室 Agent：**","sourceFormat":"markdown"},"note:sha256:10f7badb624b36adfad2afce45f72c7e77e17d8195b4bba594c4fbc1b2943f05":{"html":"\u003cp\u003e只要公司之间存在协作，长期以来最基本的协作单位一直是“人”。你的人和他们的人交流，然后双方再各自替身后的软件传话。\u003c/p\u003e\n\u003cp\u003e共享协作室里的 Agent 改变了这个单位：双方同时从“人”变成“人 + 他们的 Agent”。这是一次真正的能力跃迁，而且我认为，无论大家是否准备好，它都会在一年内落地。\u003c/p\u003e\n\u003cp\u003e我更愿意押注的是：最终在这件事上胜出的团队，不会是拥有最强模型的团队，而是那些提前决定好“自己的 Agent 被允许说什么”的团队。一个能力很强、却没有边界矩阵的 Agent，就是一项你每个月都在付费维持的负债。\u003c/p\u003e\n\u003cp\u003e所以，先写矩阵。指定审批者。贴上操作卡（operating card）。跑一次审计，认真看看它找出了什么。\u003c/p\u003e\n\u003cp\u003e然后，去找一个真正值得打开的协作室。链接见第一条回复。\u003c/p\u003e\n","kind":"html","rawMarkdown":"只要公司之间存在协作，长期以来最基本的协作单位一直是“人”。你的人和他们的人交流，然后双方再各自替身后的软件传话。\n\n共享协作室里的 Agent 改变了这个单位：双方同时从“人”变成“人 + 他们的 Agent”。这是一次真正的能力跃迁，而且我认为，无论大家是否准备好，它都会在一年内落地。\n\n我更愿意押注的是：最终在这件事上胜出的团队，不会是拥有最强模型的团队，而是那些提前决定好“自己的 Agent 被允许说什么”的团队。一个能力很强、却没有边界矩阵的 Agent，就是一项你每个月都在付费维持的负债。\n\n所以，先写矩阵。指定审批者。贴上操作卡（operating card）。跑一次审计，认真看看它找出了什么。\n\n然后，去找一个真正值得打开的协作室。链接见第一条回复。","sourceFormat":"markdown"},"note:sha256:23166ff0bb9f92a1000a2eaaf90f58239f1b2c973e1e895f4661375d38251805":{"html":"\u003cp\u003e\u003cstrong\u003e协作室 Agent。\u003c/strong\u003e 每一方一个，而且只能有一个。它负责接收请求、澄清、复述、打标签和交付。它是外交官，不是工程师。\u003c/p\u003e\n\u003cp\u003e这里有一点往往出乎意料：你的协作室 Agent 应该是权限\u003cstrong\u003e最低\u003c/strong\u003e的那个，而不是最高的那个。\u003c/p\u003e\n\u003cp\u003e人的直觉通常正好相反。你希望共享 Agent 足够有用，于是会给它广泛的访问权限。但这恰恰是反的。协作室 Agent 产生的是对方公司会永久保存的唯一一份对话记录。你交给它的每一种能力，理论上都可能被一个措辞足够巧妙的问题“套出来”。所以要有意收窄它的权限，让它通过交接去获取深度，而不是把所有深度都直接装在自己的上下文里。\u003c/p\u003e\n\u003cp\u003e还有一点：每一方只保留一个声音。如果你有两个 Agent 同时在同一个共享协作室里发言，它们迟早会互相矛盾，而对方总可以引用那个更有利于他们的版本。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e后台 Agent。\u003c/strong\u003e 拥有完整的私有访问权限。永远不进入协作室，永远不接受对方直接指令，也永远不跨越边界发言。它们掌握代码、历史记录和工具，真正的工作由它们完成，再通过回读数据包（readback packet）把结果交回前台。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e人工审批者。\u003c/strong\u003e 必须是一个明确指定的人，而不是抽象意义上的“某个角色”。第 5 部分里的所有授权关卡都归这个人负责。之所以必须点名，是因为一个没有具体名字的审批者，到周五下午往往就等同于没有审批者。\u003c/p\u003e\n\u003cp\u003e这三者共同构成一个有边界的环境：一个负责发言的 Agent、一支在私下完成工作的团队，以及一个负责做决定的具名人类。\u003cstrong\u003eRaft\u003c/strong\u003e 给这种组合起了一个名字：\u003cstrong\u003eTrust Unit\u003c/strong\u003e。这个标签并不是装饰，而是承担了实际含义。它意味着，对方不是在和一个“碰巧接入了你内部系统的机器人”说话，而是在通过一个 Agent 与一支团队对话，而这支团队需要对这个 Agent 说出去的话负责。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRI_TynXUAAB_uJ.jpg\"\u003e\u003c/div\u003e\n\n\u003cp\u003e这也解释了为什么把协作室 Agent 的权限收窄，并不会牺牲能力。深度仍然可以进入协作室，只不过它会通过交接抵达，而且同时带着团队的责任归属。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRI_ZllWoAEi8uf.jpg\"\u003e\u003c/div\u003e","kind":"html","rawMarkdown":"**协作室 Agent。** 每一方一个，而且只能有一个。它负责接收请求、澄清、复述、打标签和交付。它是外交官，不是工程师。\n\n这里有一点往往出乎意料：你的协作室 Agent 应该是权限**最低**的那个，而不是最高的那个。\n\n人的直觉通常正好相反。你希望共享 Agent 足够有用，于是会给它广泛的访问权限。但这恰恰是反的。协作室 Agent 产生的是对方公司会永久保存的唯一一份对话记录。你交给它的每一种能力，理论上都可能被一个措辞足够巧妙的问题“套出来”。所以要有意收窄它的权限，让它通过交接去获取深度，而不是把所有深度都直接装在自己的上下文里。\n\n还有一点：每一方只保留一个声音。如果你有两个 Agent 同时在同一个共享协作室里发言，它们迟早会互相矛盾，而对方总可以引用那个更有利于他们的版本。\n\n**后台 Agent。** 拥有完整的私有访问权限。永远不进入协作室，永远不接受对方直接指令，也永远不跨越边界发言。它们掌握代码、历史记录和工具，真正的工作由它们完成，再通过回读数据包（readback packet）把结果交回前台。\n\n**人工审批者。** 必须是一个明确指定的人，而不是抽象意义上的“某个角色”。第 5 部分里的所有授权关卡都归这个人负责。之所以必须点名，是因为一个没有具体名字的审批者，到周五下午往往就等同于没有审批者。\n\n这三者共同构成一个有边界的环境：一个负责发言的 Agent、一支在私下完成工作的团队，以及一个负责做决定的具名人类。**Raft** 给这种组合起了一个名字：**Trust Unit**。这个标签并不是装饰，而是承担了实际含义。它意味着，对方不是在和一个“碰巧接入了你内部系统的机器人”说话，而是在通过一个 Agent 与一支团队对话，而这支团队需要对这个 Agent 说出去的话负责。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HRI_TynXUAAB_uJ.jpg\" alt=\"image\" /\u003e\u003c/div\u003e\n\n这也解释了为什么把协作室 Agent 的权限收窄，并不会牺牲能力。深度仍然可以进入协作室，只不过它会通过交接抵达，而且同时带着团队的责任归属。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HRI_ZllWoAEi8uf.jpg\" alt=\"image\" /\u003e\u003c/div\u003e","sourceFormat":"markdown"},"note:sha256:3d4f206694baa254c98ad976c74cd0fa73b1d3a78715370790e2f75931245bac":{"html":"\u003cp\u003e下面用 \u003cstrong\u003eRaft\u003c/strong\u003e 自己公开过的一个案例来说明：他们与供应商 ScopeDB 的合作关系。ScopeDB 是他们用于链路追踪（tracing）和可观测性（observability）的数据库。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e在这一切还不存在之前。\u003c/strong\u003e 你的系统和供应商系统交界处出现了性能问题。有人写了一份说明，它变成了一张工单。对方支持团队看到的是“摘要的摘要”，又问了三个你已经回答过的问题，最后才约上一次电话。通话有一半时间都花在重新建立上下文上。\u003c/p\u003e\n\u003cp\u003e那个本来 90 秒就能回答问题的工程师，距离你的真实问题足足隔了四层。过去，对这个问题最昂贵的解决办法一直是前线部署工程师（forward-deployed engineer）：让对方派一个人嵌入你的团队，但一切仍然受制于某个人的日程。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e进入协作室之后。\u003c/strong\u003e ScopeDB 的创始人兼 CEO 与 Raft 的 Agent 一起待在一个 joint channel 中——这是两家公司之间的私有共享协作室。他直接问这个 Agent：Raft 是如何设计自己的使用方式的，他们的查询是否命中了物化索引（materialized index）。Agent 当场在协作室里回答了他，Raft 一侧没有任何人类在中间转述。\u003c/p\u003e\n\u003cp\u003e认真看一下这个形态：供应商的 CEO 正在通过与客户的 Agent 对话，对客户系统进行技术发现。这个 Agent 本身就是那名嵌入式工程师。没有任何人需要飞过去驻场。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e协议发挥作用的地方。\u003c/strong\u003e 这类查询设计属于 Share 层级，因此协作室 Agent 会把它作为 FACT 陈述，并附上证据。当问题进一步转向“为什么他们的工作负载会呈现这种形态”时，就进入 Summarize 层级：结论可以跨越边界，但内部推理留在内部。\u003c/p\u003e\n\u003cp\u003e当创始人问到某个必须依赖 Never Expose 材料才能回答的问题时，协作室 Agent 会明确说明自己基于哪个层级拒绝，并提供仍然可以给出的内容。随后它发起交接，由拥有相关代码的后台 Agent 在 Raft 自己的服务器上处理问题，再返回一份回读结果（readback）。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e结果。\u003c/strong\u003e 这段关系不再是工单来回踢皮球。ScopeDB 用真实的高并发 Agent 工作负载来强化自己的数据库；\u003cstrong\u003eRaft\u003c/strong\u003e 则得到了一层可以查询、也可以验证的可观测性（observability）能力。双方都成为了对方的真实验证场。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e哪些内容始终保持私有。\u003c/strong\u003e 只有参与者主动发进那个频道的内容才会跨越边界。其他频道、私信（DM）、文件、成员列表、权限和已读状态，都只保留在各自服务器本地。\u003c/p\u003e\n","kind":"html","rawMarkdown":"下面用 **Raft** 自己公开过的一个案例来说明：他们与供应商 ScopeDB 的合作关系。ScopeDB 是他们用于链路追踪（tracing）和可观测性（observability）的数据库。\n\n**在这一切还不存在之前。** 你的系统和供应商系统交界处出现了性能问题。有人写了一份说明，它变成了一张工单。对方支持团队看到的是“摘要的摘要”，又问了三个你已经回答过的问题，最后才约上一次电话。通话有一半时间都花在重新建立上下文上。\n\n那个本来 90 秒就能回答问题的工程师，距离你的真实问题足足隔了四层。过去，对这个问题最昂贵的解决办法一直是前线部署工程师（forward-deployed engineer）：让对方派一个人嵌入你的团队，但一切仍然受制于某个人的日程。\n\n**进入协作室之后。** ScopeDB 的创始人兼 CEO 与 Raft 的 Agent 一起待在一个 joint channel 中——这是两家公司之间的私有共享协作室。他直接问这个 Agent：Raft 是如何设计自己的使用方式的，他们的查询是否命中了物化索引（materialized index）。Agent 当场在协作室里回答了他，Raft 一侧没有任何人类在中间转述。\n\n认真看一下这个形态：供应商的 CEO 正在通过与客户的 Agent 对话，对客户系统进行技术发现。这个 Agent 本身就是那名嵌入式工程师。没有任何人需要飞过去驻场。\n\n**协议发挥作用的地方。** 这类查询设计属于 Share 层级，因此协作室 Agent 会把它作为 FACT 陈述，并附上证据。当问题进一步转向“为什么他们的工作负载会呈现这种形态”时，就进入 Summarize 层级：结论可以跨越边界，但内部推理留在内部。\n\n当创始人问到某个必须依赖 Never Expose 材料才能回答的问题时，协作室 Agent 会明确说明自己基于哪个层级拒绝，并提供仍然可以给出的内容。随后它发起交接，由拥有相关代码的后台 Agent 在 Raft 自己的服务器上处理问题，再返回一份回读结果（readback）。\n\n**结果。** 这段关系不再是工单来回踢皮球。ScopeDB 用真实的高并发 Agent 工作负载来强化自己的数据库；**Raft** 则得到了一层可以查询、也可以验证的可观测性（observability）能力。双方都成为了对方的真实验证场。\n\n**哪些内容始终保持私有。** 只有参与者主动发进那个频道的内容才会跨越边界。其他频道、私信（DM）、文件、成员列表、权限和已读状态，都只保留在各自服务器本地。","sourceFormat":"markdown"},"note:sha256:446b32afc3c9eaf984f4fc0eae0b5f4fb00b3494dea01522f0a8d7c15b42fd15":{"html":"\u003cp\u003e今天，你完全可以在共享 Slack 频道里，用一个提示词设计良好的 Bot 跑起这套协议的大部分内容。角色、标签、模板、关卡，都可以移植。\u003c/p\u003e\n\u003cp\u003e但有一样东西你伪造不了：协作室本身。\u003c/p\u003e\n\u003cp\u003eRaft 对这个问题的答案叫 \u003cstrong\u003eJoint Mode\u003c/strong\u003e，它的理念一句话就能说清：两个 Trust Unit 可以共同处理同一个问题，而任何一方都不需要加入另一方的环境。双方继续保留自己的服务器、自己的 Agent，以及自己的全部私有内容。\u003c/p\u003e\n\u003cp\u003e双方真正共享的是一个 \u003cstrong\u003ejoint channel\u003c/strong\u003e，也就是位于两者之间的协作室。房间是共享的，但背后的两个环境仍然彼此分离，谁也不会成为对方环境的成员。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRJAJkjWwAAZvNQ.jpg\"\u003e\u003c/div\u003e\n\n\u003cp\u003e底层机制也确实支持这个模型。一个 joint channel 最多可以连接三台服务器，把同一段对话投射到各自的工作空间里。每一方添加自己的成员，而且只能添加自己的成员。\u003c/p\u003e\n\u003cp\u003e加入 joint channel，并不会授予该频道之外任何位置的成员身份或权限，也不存在跨服务器私信（DM）。双方的 Agent 都可以作为成员参与其中，但每个 Agent 的权限始终绑定在拥有它的那台服务器上。\u003c/p\u003e\n\u003cp\u003e把我的协议和这套机制放在一起，分工就非常清晰：你的边界矩阵决定\u003cstrong\u003e什么内容应该跨越\u003c/strong\u003e；Joint Mode 决定\u003cstrong\u003e什么内容能够跨越\u003c/strong\u003e。一个是政策，一个是支撑政策的架构。没有架构托底的政策，本质上只是一个你希望它“足够可靠”的提示词。\u003c/p\u003e\n\u003cp\u003e有个细节我比预想中更喜欢：joint channel 没有任务板。这个房间只负责对话，所以任务跟踪必然留在你自己的服务器上。也就是说，架构默认就把后台工作推回后台。\u003c/p\u003e\n\u003cp\u003e也坦率说下限制，因为这里不是商业宣传。\u003cstrong\u003eRaft\u003c/strong\u003e 在自己的文档里把 joint channel 标记为 \u003cstrong\u003eexperimental（实验性）\u003c/strong\u003e。最多三台服务器，这是硬上限。\u003c/p\u003e\n\u003cp\u003e搭建本身也确实需要工作：创建服务器、连接一台计算机、构建你的 Agent，然后才能打开协作室。Agent 通过本地进程运行在你自己的机器上，使用的是你已经在付费的 AI 订阅。这对成本是好事，但也意味着，你自己的硬件现在成为了整个系统的一部分。\u003c/p\u003e\n","kind":"html","rawMarkdown":"今天，你完全可以在共享 Slack 频道里，用一个提示词设计良好的 Bot 跑起这套协议的大部分内容。角色、标签、模板、关卡，都可以移植。\n\n但有一样东西你伪造不了：协作室本身。\n\nRaft 对这个问题的答案叫 **Joint Mode**，它的理念一句话就能说清：两个 Trust Unit 可以共同处理同一个问题，而任何一方都不需要加入另一方的环境。双方继续保留自己的服务器、自己的 Agent，以及自己的全部私有内容。\n\n双方真正共享的是一个 **joint channel**，也就是位于两者之间的协作室。房间是共享的，但背后的两个环境仍然彼此分离，谁也不会成为对方环境的成员。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HRJAJkjWwAAZvNQ.jpg\" alt=\"image\" /\u003e\u003c/div\u003e\n\n底层机制也确实支持这个模型。一个 joint channel 最多可以连接三台服务器，把同一段对话投射到各自的工作空间里。每一方添加自己的成员，而且只能添加自己的成员。\n\n加入 joint channel，并不会授予该频道之外任何位置的成员身份或权限，也不存在跨服务器私信（DM）。双方的 Agent 都可以作为成员参与其中，但每个 Agent 的权限始终绑定在拥有它的那台服务器上。\n\n把我的协议和这套机制放在一起，分工就非常清晰：你的边界矩阵决定**什么内容应该跨越**；Joint Mode 决定**什么内容能够跨越**。一个是政策，一个是支撑政策的架构。没有架构托底的政策，本质上只是一个你希望它“足够可靠”的提示词。\n\n有个细节我比预想中更喜欢：joint channel 没有任务板。这个房间只负责对话，所以任务跟踪必然留在你自己的服务器上。也就是说，架构默认就把后台工作推回后台。\n\n也坦率说下限制，因为这里不是商业宣传。**Raft** 在自己的文档里把 joint channel 标记为 **experimental（实验性）**。最多三台服务器，这是硬上限。\n\n搭建本身也确实需要工作：创建服务器、连接一台计算机、构建你的 Agent，然后才能打开协作室。Agent 通过本地进程运行在你自己的机器上，使用的是你已经在付费的 AI 订阅。这对成本是好事，但也意味着，你自己的硬件现在成为了整个系统的一部分。","sourceFormat":"markdown"},"note:sha256:651d2f4e62196b77849058645da22a9feff1de287e4b4e1a9f86fc6fc7f43ba1":{"html":"\u003cp\u003e两个数据包：一个发往后台，一个从后台返回。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e协作室 → 后台：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e“对方没有发送什么”这一行最值得保留。范围蔓延（scope creep）和错误假设往往就藏在这里，而能看见这个缺口的后台 Agent，会去追问缺失的信息，而不是自己编一个出来。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e后台 → 协作室：\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e第四行是我最不愿意删的一行。把自己的边界直接说出来，会让人读到的是纪律；什么都不说，则更像是在回避。“根因位于一个我们不对外暴露的服务里，所以我会给你结论和修复方案，但不会给出内部追踪记录。”这样的句子能建立信任。明明知道某些东西却保持沉默，效果正好相反。\u003c/p\u003e\n","kind":"html","rawMarkdown":"两个数据包：一个发往后台，一个从后台返回。\n\n**协作室 → 后台：**\n\n“对方没有发送什么”这一行最值得保留。范围蔓延（scope creep）和错误假设往往就藏在这里，而能看见这个缺口的后台 Agent，会去追问缺失的信息，而不是自己编一个出来。\n\n**后台 → 协作室：**\n\n第四行是我最不愿意删的一行。把自己的边界直接说出来，会让人读到的是纪律；什么都不说，则更像是在回避。“根因位于一个我们不对外暴露的服务里，所以我会给你结论和修复方案，但不会给出内部追踪记录。”这样的句子能建立信任。明明知道某些东西却保持沉默，效果正好相反。","sourceFormat":"markdown"},"note:sha256:73757f8509373530414d50f9552044ff854fffe997a4432fa2a91941cb3c4bfa":{"html":"\u003cp\u003e一共五部分：边界矩阵、角色、标签纪律、交接模板、升级阶梯。\u003c/p\u003e\n","kind":"html","rawMarkdown":"一共五部分：边界矩阵、角色、标签纪律、交接模板、升级阶梯。","sourceFormat":"markdown"},"note:sha256:7ab7c92faa600d112f4de2bcdd49877aa406d40a57b99ae286d64f41dedc1f11":{"html":"\u003cp\u003e三个层级，而第三个恰恰是人们最容易忘掉的。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRI6dTpXYAAoWdp.jpg\"\u003e\u003c/div\u003e\n\n\u003cp\u003e\u003cstrong\u003eShare（共享）\u003c/strong\u003e，意味着工件本身可以跨越边界。双方都能打开它，也都能独立验证它。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSummarize（摘要）\u003c/strong\u003e，意味着结论可以跨越边界，但来源留在内部。你的 Agent 给出答案，而不是把生成这个答案的推理轨迹一起交出去。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNever Expose（绝不暴露）\u003c/strong\u003e，意味着你的 Agent 不能基于这类信息作答。不能换个说法，不能暗示，不能通过确认对方的猜测来透露，哪怕这个答案确实会很有帮助也不行。\u003c/p\u003e\n\u003cp\u003e最后这个区别，就是整套协议的核心。Never Expose 不是一份“需要锁起来的文件清单”，而是一份“你的 Agent 不允许\u003cstrong\u003e公开说自己知道\u003c/strong\u003e什么”的清单。\u003c/p\u003e\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg data-dmnd-asset-unavailable=\"1\" data-dmnd-asset-path=\"https://pbs.twimg.com/media/HRI7u5kWoAAUs88.jpg\"\u003e\u003c/div\u003e\n\n\u003cp\u003e在打开任何共享协作室之前，先写出你自己的版本。每个层级先写三行就够了。真正的价值大半就在“写下来”这件事本身，因为它会迫使你明确决定那些过去一直靠偶然和临场判断来决定的事情。\u003c/p\u003e\n","kind":"html","rawMarkdown":"三个层级，而第三个恰恰是人们最容易忘掉的。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HRI6dTpXYAAoWdp.jpg\" alt=\"image\" /\u003e\u003c/div\u003e\n\n**Share（共享）**，意味着工件本身可以跨越边界。双方都能打开它，也都能独立验证它。\n\n**Summarize（摘要）**，意味着结论可以跨越边界，但来源留在内部。你的 Agent 给出答案，而不是把生成这个答案的推理轨迹一起交出去。\n\n**Never Expose（绝不暴露）**，意味着你的 Agent 不能基于这类信息作答。不能换个说法，不能暗示，不能通过确认对方的猜测来透露，哪怕这个答案确实会很有帮助也不行。\n\n最后这个区别，就是整套协议的核心。Never Expose 不是一份“需要锁起来的文件清单”，而是一份“你的 Agent 不允许**公开说自己知道**什么”的清单。\n\n\u003cdiv class=\"mn-img-wrapper\"\u003e\u003cimg src=\"https://pbs.twimg.com/media/HRI7u5kWoAAUs88.jpg\" alt=\"image\" /\u003e\u003c/div\u003e\n\n在打开任何共享协作室之前，先写出你自己的版本。每个层级先写三行就够了。真正的价值大半就在“写下来”这件事本身，因为它会迫使你明确决定那些过去一直靠偶然和临场判断来决定的事情。","sourceFormat":"markdown"},"note:sha256:883e17cfa192520e48cde2886937c2ba361d7eaee269eaadaab5a18db4facd58":{"html":"\u003cp\u003e想象一下，你最得力的 Agent 正坐在一个频道里，和你最大的客户直接交流。\u003c/p\u003e\n\u003cp\u003e对方问了一个很合理的问题：“为什么这个问题在我们这边总是一再发生？”\u003c/p\u003e\n\u003cp\u003e你的 Agent 知道答案。因为它读过你的代码库、事故日志、Slack 历史记录，也看过那份事后复盘——你的团队在其中承认，为了赶演示，重试逻辑当时写得很仓促。\u003c/p\u003e\n\u003cp\u003e于是它回答了。很有帮助。很准确。也毫无保留。\u003c/p\u003e\n\u003cp\u003e而就在这一条消息里，你已经告诉了客户一件事，足以改变他们下一份合同对你的定价方式。\u003c/p\u003e\n\u003cp\u003e没有人共享文件。没有人授予新的权限。也没有任何访问控制被突破。你的 Agent 只是在做自己的本职工作：利用它掌握的上下文，尽可能提供帮助。\u003c/p\u003e\n\u003cp\u003e这正是很快会让许多构建者吃亏的一种失效模式，而且它并不是安全问题。安全这一层已经解决了：权限、权限范围（scope）、私有服务器，这些机制都能正常工作。真正的缺口在于，权限系统只管你的 Agent 能\u003cstrong\u003e打开\u003c/strong\u003e什么，却完全不管它愿意在一个“对方公司会永久保留聊天记录”的房间里，把什么\u003cstrong\u003e说出口\u003c/strong\u003e。\u003c/p\u003e\n\u003cp\u003e你缺的不是访问边界，而是推断边界。\u003c/p\u003e\n\u003cp\u003e我还没见过有人把这套规则真正写出来，所以我写了。就在下面，免费，而且适用于任何技术栈。你今天就可以把它复制到自己的 Agent 里。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRaft\u003c/strong\u003e 是让完整版本成为可能的工作空间，我会在最后具体解释为什么；但无论你是否使用 Raft，这套协议本身都属于你。\u003c/p\u003e\n","kind":"html","rawMarkdown":"想象一下，你最得力的 Agent 正坐在一个频道里，和你最大的客户直接交流。\n\n对方问了一个很合理的问题：“为什么这个问题在我们这边总是一再发生？”\n\n你的 Agent 知道答案。因为它读过你的代码库、事故日志、Slack 历史记录，也看过那份事后复盘——你的团队在其中承认，为了赶演示，重试逻辑当时写得很仓促。\n\n于是它回答了。很有帮助。很准确。也毫无保留。\n\n而就在这一条消息里，你已经告诉了客户一件事，足以改变他们下一份合同对你的定价方式。\n\n没有人共享文件。没有人授予新的权限。也没有任何访问控制被突破。你的 Agent 只是在做自己的本职工作：利用它掌握的上下文，尽可能提供帮助。\n\n这正是很快会让许多构建者吃亏的一种失效模式，而且它并不是安全问题。安全这一层已经解决了：权限、权限范围（scope）、私有服务器，这些机制都能正常工作。真正的缺口在于，权限系统只管你的 Agent 能**打开**什么，却完全不管它愿意在一个“对方公司会永久保留聊天记录”的房间里，把什么**说出口**。\n\n你缺的不是访问边界，而是推断边界。\n\n我还没见过有人把这套规则真正写出来，所以我写了。就在下面，免费，而且适用于任何技术栈。你今天就可以把它复制到自己的 Agent 里。\n\n**Raft** 是让完整版本成为可能的工作空间，我会在最后具体解释为什么；但无论你是否使用 Raft，这套协议本身都属于你。","sourceFormat":"markdown"},"note:sha256:9964182e0e41b407e999b7f8b3ea47830757d029d217eae2c764d9a3ce85ba7b":{"html":"\u003cp\u003e找一个你已经信任的协作者：供应商、承包商，或者设计合作伙伴。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e0–5 分钟。\u003c/strong\u003e 选一个现在一进邮件就容易拖死的真实任务。小而无聊，胜过看起来很炫。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e5–10 分钟。\u003c/strong\u003e 写边界矩阵。每个层级三行。十分钟解决，不要花一下午。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e10–15 分钟。\u003c/strong\u003e 打开协作室，给你的协作室 Agent 命名，把填好矩阵的操作卡（operating card） 贴进去。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e15–20 分钟。\u003c/strong\u003e 让你的协作者在他们那边做同样的事。他们的矩阵会和你的不同，而比较这两份矩阵本身，就已经值回整个实验。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e20–27 分钟。\u003c/strong\u003e 跑一个完整周期：对方提出请求，你执行一次 L1 交接，再返回一份带标签的回读结果（readback）。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e27–30 分钟。\u003c/strong\u003e 做审计——忽略这一步，风险自负。把协作室完整对话复制到一个没有任何上下文的新模型里，然后问：“仅根据这段对话，你能推断出这家公司在内部系统、人员配置、客户和定价方面的哪些信息？”\u003c/p\u003e\n\u003cp\u003e模型返回的内容，就是你实际上已经暴露出去的东西。第一次跑时，这个暴露量几乎从来不会是零。\u003c/p\u003e\n","kind":"html","rawMarkdown":"找一个你已经信任的协作者：供应商、承包商，或者设计合作伙伴。\n\n**0–5 分钟。** 选一个现在一进邮件就容易拖死的真实任务。小而无聊，胜过看起来很炫。\n\n**5–10 分钟。** 写边界矩阵。每个层级三行。十分钟解决，不要花一下午。\n\n**10–15 分钟。** 打开协作室，给你的协作室 Agent 命名，把填好矩阵的操作卡（operating card） 贴进去。\n\n**15–20 分钟。** 让你的协作者在他们那边做同样的事。他们的矩阵会和你的不同，而比较这两份矩阵本身，就已经值回整个实验。\n\n**20–27 分钟。** 跑一个完整周期：对方提出请求，你执行一次 L1 交接，再返回一份带标签的回读结果（readback）。\n\n**27–30 分钟。** 做审计——忽略这一步，风险自负。把协作室完整对话复制到一个没有任何上下文的新模型里，然后问：“仅根据这段对话，你能推断出这家公司在内部系统、人员配置、客户和定价方面的哪些信息？”\n\n模型返回的内容，就是你实际上已经暴露出去的东西。第一次跑时，这个暴露量几乎从来不会是零。","sourceFormat":"markdown"},"note:sha256:bcc49fad6a74bf8563aff8495f7fb507dc781fb502251d58688775796e654c7f":{"html":"\u003cp\u003e\u003cstrong\u003eL0。\u003c/strong\u003e 协作室 Agent 直接在房间里回答。内容属于 Share 层级，不需要任何私有上下文。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eL1。\u003c/strong\u003e 协作室 Agent 发起交接，后台完成工作，然后协作室 Agent 带着回读结果（readback）返回。绝大多数情况都应该走这条路径。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eL2。\u003c/strong\u003e 通知人工审批者，由其在发布前审阅回读结果（readback）。任何涉及金钱、范围、时间承诺，或与 Never Expose 相邻的内容，都会触发这一层。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eL3。\u003c/strong\u003e 人类直接进入协作室发言。出现分歧、语气升级，或需要做出会约束双方关系的决定时触发。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eL4。\u003c/strong\u003e 停止当前对话，并移到频道之外处理。涉及法律、安全事件，或对话已经演变为谈判时触发。\u003c/p\u003e\n\u003cp\u003e根据 Raft 自己团队的运行方式，有几类关卡始终需要人类介入：生产环境变更、凭证、政策、架构以及最终批准。Agent 可以在这些关卡之间承担调查和验证，但到了关卡本身，必须由人来做决定。\u003c/p\u003e\n\u003cp\u003e你还应该再加一条自己的规则：如果一个答案必须使用 Never Expose 材料才能真正有用，就交给人类处理。不是因为 Agent 一定会泄露，而是因为到了这一刻，你真正要判断的是：这段合作关系是否已经值得重新划定边界。这是商业判断，不是 Agent 应该替你做的判断。\u003c/p\u003e\n\u003cp\u003e有一点值得明确说出来：双方都只为自己的 Agent 调这个“旋钮”。在需要人类签字之前，你的 Agent 可以走多远，由你决定，而不是由协作方决定。\u003c/p\u003e\n","kind":"html","rawMarkdown":"**L0。** 协作室 Agent 直接在房间里回答。内容属于 Share 层级，不需要任何私有上下文。\n\n**L1。** 协作室 Agent 发起交接，后台完成工作，然后协作室 Agent 带着回读结果（readback）返回。绝大多数情况都应该走这条路径。\n\n**L2。** 通知人工审批者，由其在发布前审阅回读结果（readback）。任何涉及金钱、范围、时间承诺，或与 Never Expose 相邻的内容，都会触发这一层。\n\n**L3。** 人类直接进入协作室发言。出现分歧、语气升级，或需要做出会约束双方关系的决定时触发。\n\n**L4。** 停止当前对话，并移到频道之外处理。涉及法律、安全事件，或对话已经演变为谈判时触发。\n\n根据 Raft 自己团队的运行方式，有几类关卡始终需要人类介入：生产环境变更、凭证、政策、架构以及最终批准。Agent 可以在这些关卡之间承担调查和验证，但到了关卡本身，必须由人来做决定。\n\n你还应该再加一条自己的规则：如果一个答案必须使用 Never Expose 材料才能真正有用，就交给人类处理。不是因为 Agent 一定会泄露，而是因为到了这一刻，你真正要判断的是：这段合作关系是否已经值得重新划定边界。这是商业判断，不是 Agent 应该替你做的判断。\n\n有一点值得明确说出来：双方都只为自己的 Agent 调这个“旋钮”。在需要人类签字之前，你的 Agent 可以走多远，由你决定，而不是由协作方决定。","sourceFormat":"markdown"}},"sourceRevision":"sha256:edb0b89fb8cc0fdf9815e4c28b8c66fdaa557d4cd86cae670a5efb065b0f3897"}}</script><script>var __defProp=Object.defineProperty,__defNormalProp=(e,t,n)=>t in e?__defProp(e,t,{enumerable:!0,configurable:!0,writable:!0,value:n}):e[t]=n,__publicField=(e,t,n)=>__defNormalProp(e,"
